<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>error</title>
    <!-- เรียกใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เรียกใช้ Font Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- เรียกใช้ Lucide Icons สำหรับไอคอนปุ่ม -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#0f326e',
                        'secondary': '#64748b',
                        'brand-blue': '#2563eb',
                        'brand-blue-dark': '#1d4ed8',
                        'bg-blue': '#f4f7fe',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #ffffff;
        }

        /* ลายจุด (Dot Pattern) พื้นหลัง */
        .bg-dots {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 md:p-12 relative overflow-hidden bg-white">

    <!-- ลวดลายพื้นหลังตกแต่ง (ซ้าย) -->
    <div class="absolute left-0 top-1/4 w-40 h-40 sm:w-64 sm:h-64 bg-dots opacity-40 -z-10 rounded-full blur-sm"></div>
    <div class="absolute left-[-10%] bottom-0 w-64 h-64 sm:w-96 sm:h-96 bg-blue-100/50 rounded-full mix-blend-multiply filter blur-3xl opacity-70 -z-10"></div>

    <!-- ลวดลายพื้นหลังตกแต่ง (ขวา) -->
    <div class="absolute right-6 sm:right-10 bottom-1/4 w-32 h-32 sm:w-48 sm:h-48 bg-dots opacity-40 -z-10 rounded-full blur-sm"></div>
    <div class="absolute right-[-5%] top-1/4 w-56 h-56 sm:w-80 sm:h-80 bg-blue-200/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 -z-10"></div>

    <!-- Main Content Container (ไม่มีการ์ดสีขาว) -->
    <div class="w-full max-w-xs sm:max-w-lg md:max-w-2xl lg:max-w-3xl p-4 sm:p-8 md:p-12 text-center relative z-10 mx-auto">

        <!-- Illustration Area (กราฟิกจำลองโลกและลูกศร) -->
        <div class="relative w-32 h-32 sm:w-44 sm:h-44 md:w-48 md:h-48 mx-auto mb-6 sm:mb-8 flex justify-center items-center">
            <!-- ตกแต่งจุดเล็กๆ รอบๆ กราฟิก -->
            <div class="absolute top-4 left-0 w-1 h-1 bg-blue-400 rounded-full"></div>
            <div class="absolute bottom-10 right-4 w-1.5 h-1.5 bg-blue-300 rounded-full"></div>
            <div class="absolute top-1/3 right-0 text-blue-400 font-bold text-lg sm:text-xl">+</div>
            <div class="absolute top-8 left-8 text-gray-300 font-bold text-base sm:text-lg">+</div>

            <!-- กราฟิก SVG วาดโลกและช่องค้นหา (ทดแทนรูป 3D) -->
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-xl" xmlns="http://www.w3.org/2000/svg">
                <!-- ลูกศรหมุนวนรอบหลัง -->
                <path d="M 40 140 C 0 100, 20 40, 80 20" fill="none" stroke="#dbeafe" stroke-width="8" stroke-linecap="round" />
                <path d="M 80 20 L 75 10 M 80 20 L 70 25" fill="none" stroke="#dbeafe" stroke-width="4" stroke-linecap="round" />

                <!-- ลูกโลก (Globe) -->
                <circle cx="100" cy="100" r="50" fill="#3b82f6" />
                <!-- เส้นตารางลูกโลก -->
                <path d="M 100 50 A 25 50 0 0 0 100 150 M 100 50 A 25 50 0 0 1 100 150" fill="none" stroke="#2563eb" stroke-width="2" />
                <path d="M 100 50 A 50 50 0 0 0 100 150 M 100 50 A 50 50 0 0 1 100 150" fill="none" stroke="#2563eb" stroke-width="2" />
                <path d="M 54 80 L 146 80 M 50 100 L 150 100 M 54 120 L 146 120" fill="none" stroke="#2563eb" stroke-width="2" />

                <!-- ลูกศรหมุนวนด้านหน้า -->
                <path d="M 160 60 C 200 100, 180 160, 120 180" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
                <polygon points="120,180 130,172 135,188" fill="#e2e8f0" />

                <!-- กล่องแจ้งเตือน (Alert Bubble) -->
                <circle cx="140" cy="55" r="16" fill="#2563eb" stroke="white" stroke-width="3" />
                <text x="140" y="62" fill="white" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">!</text>

                <!-- Search Bar -->
                <rect x="35" y="85" width="130" height="30" rx="15" fill="white" />
                <!-- เงากล่องค้นหา -->
                <rect x="35" y="86" width="130" height="30" rx="15" fill="black" opacity="0.05" />
                <text x="50" y="105" fill="#1e3a8a" font-size="14" font-family="Arial, sans-serif" font-weight="bold">www.</text>

                <!-- ปุ่มแว่นขยาย -->
                <circle cx="145" cy="100" r="11" fill="#3b82f6" />
                <!-- ไอคอนแว่นขยายข้างในปุ่ม -->
                <circle cx="143" cy="98" r="4" fill="none" stroke="white" stroke-width="2" />
                <line x1="146" y1="101" x2="149" y2="104" stroke="white" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>

        <!-- Typography Section -->
        <h1 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold text-primary mb-3 sm:mb-4 tracking-tight">
            เว็บไซต์มีการเปลี่ยนแปลงโดเมน
        </h1>

        <p class="text-secondary text-sm sm:text-base leading-relaxed max-w-xs sm:max-w-md md:max-w-lg mx-auto mb-6 sm:mb-10">
            ขณะนี้เว็บไซต์ได้เปลี่ยนไปใช้ที่อยู่ใหม่ เพื่อให้บริการได้อย่างต่อเนื่อง<br class="hidden sm:block">
            กรุณาติดต่อผู้ดูแลระบบเพื่อขอที่อยู่เว็บไซต์ใหม่
        </p>

    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
