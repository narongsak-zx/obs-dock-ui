    let state = JSON.parse(localStorage.getItem("dsq_state")) || {
      name: "", total: 0, completed: [], scores: {}, badges: [], currentMission: 1, answers: {}
    };
    let activeMission = null;
    let currentQuestion = 0;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[ch]));
    }

    function save() {
      localStorage.setItem("dsq_state", JSON.stringify(state));
      updateNav();
    }

    function updateNav() {
      const chip = document.getElementById("playerChip");
      const safeName = escapeHTML(state.name);
      chip.innerHTML = state.name ? `<i data-lucide="user" class="icon-sm"></i> ${safeName} · ${state.total} SP` : `<i data-lucide="user" class="icon-sm"></i> ผู้เล่นใหม่`;
      document.getElementById("badgeNav").classList.toggle("hidden", !state.name);
      document.getElementById("resetNav").classList.toggle("hidden", !state.name);
      lucide.createIcons();
    }

    // ฟังก์ชัน Render หลัก (รัน Lucide ทุกครั้งที่มีการอัปเดต DOM)
    function render(html) {
      document.getElementById("screen").innerHTML = `<section class="page">${html}</section>`;
      updateNav();
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function startJourney() {
      if (state.name) return missionMap();
      render(`
        <div class="panel">
          <div class="eyebrow">USER REGISTRATION</div>
          <h2>ข้อมูลเบื้องต้น</h2>
          <p class="muted">ระบุชื่อหรือนามแฝงของคุณ เพื่อสร้างโปรไฟล์ความปลอดภัย</p>

          <div class="btn-group">
            <button class="btn btn-primary" onclick="createProfile()">ดำเนินการต่อ <i data-lucide="arrow-right" class="icon-sm"></i></button>
            <button class="btn btn-secondary" onclick="home()">ย้อนกลับ</button>
          </div>
        </div>
      `);
      setTimeout(() => document.getElementById("nameInput").focus(), 300);
    }

    function createProfile() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) return showToast("กรุณาระบุชื่อก่อนเริ่มต้น", "var(--danger)", "alert-circle");
      state.name = name;
      save();
      missionMap();
    }

    function missionMap() {
      const completed = state.completed.length;
      const cards = missions.map(m => {
        const done = state.completed.includes(m.id);
        const available = m.id === 1 || state.completed.includes(m.id - 1);
        const status = done ? "✓ Completed" : available ? "Available" : "Locked";
        return `
          <button class="mission-card ${done ? "completed" : ""} ${available ? "available" : "locked"}"
            ${available ? `onclick="missionIntro(${m.id})"` : ""}>
            <span class="mission-status">${status}</span>
            <div class="icon-container"><i data-lucide="${m.icon}" class="icon-lg"></i></div>
            <h3>MISSION ${String(m.id).padStart(2, "0")}</h3>
            <strong>${m.title}</strong>
            <p>${m.subtitle}</p>
          </button>`;
      }).join("");

      render(`
        <div class="section-title">
          <div><div class="eyebrow">DASHBOARD</div><h2>ยินดีต้อนรับ ${escapeHTML(state.name)}</h2><p class="muted" style="margin:4px 0 0;">ฝึกคิดก่อนคลิก เพื่อสร้างภูมิคุ้มกันดิจิทัล</p></div>
        </div>
        <div class="quest-progress">
          <div class="progress-head"><span>ความคืบหน้า (${completed}/5)</span><span>${completed * 20}%</span></div>
          <div class="progress"><i style="width:${completed * 20}%"></i></div>
        </div>
        <div class="mission-grid">${cards}</div>
      `);
    }

    function missionIntro(id) {
      const m = missions.find(x => x.id === id);
      render(`
        <div class="panel">
          <div class="result-icon"><i data-lucide="${m.icon}" style="width:56px;height:56px;stroke-width:1;"></i></div>
          <div class="eyebrow">MISSION ${String(m.id).padStart(2, "0")}</div>
          <h2>${m.title}</h2>
          <p class="muted">${m.subtitle}</p>
          <div class="note"><b><i data-lucide="target" class="icon-sm"></i> เป้าหมายของภารกิจ</b><p>${missionGoal(id)}</p></div>
          <div class="note"><b><i data-lucide="layout-list" class="icon-sm"></i> ระบบคะแนน</b><p>3 สถานการณ์ · สูงสุด 10 SP ต่อข้อ · คำตอบที่เสี่ยงก็ยังได้รับคะแนนตามระดับความปลอดภัย เพื่อให้ทุกคำตอบเป็นการเรียนรู้</p></div>
          <div class="btn-group">
            <button class="btn btn-primary" onclick="playMission(${id})"><i data-lucide="play" class="icon-sm"></i> เริ่มภารกิจ</button>
            <button class="btn btn-secondary" onclick="missionMap()">กลับแดชบอร์ด</button>
          </div>
        </div>
      `);
    }

    function missionGoal(id) {
      return [
        "สังเกตข้อความหลอกลวง ไม่เปิดเผยรหัส OTP และตรวจสอบผ่านช่องทางทางการ",
        "สร้างรหัสผ่านที่ปลอดภัย ใช้รหัสต่างกันในแต่ละบริการ และเปิดใช้ 2FA",
        "ตรวจสอบความน่าเชื่อถือของแหล่งที่มา และไม่ส่งต่อข้อมูลที่ยังไม่ได้รับการยืนยัน",
        "สังเกตความผิดปกติของเว็บไซต์และอีเมล ป้องกันการถูกหลอกลวง",
        "จำกัดการเข้าถึงข้อมูลอ่อนไหว และให้สิทธิ์แอปพลิเคชันเท่าที่จำเป็น"
      ][id - 1];
    }

    function playMission(id) {
      const mission = missions.find(x => x.id === id);
      if (!mission) return;
      const available = id === 1 || state.completed.includes(id - 1);
      if (!available) {
        showToast("กรุณาผ่านภารกิจก่อนหน้า", "var(--warning)", "lock");
        return missionMap();
      }
      activeMission = mission;
      currentQuestion = 0;
      playQuestion();
    }

    function mockHTML(s) {
      const icon = `<i data-lucide="${s.icon || 'message-square'}" class="icon-sm"></i>`;
      if (s.type === "sms") return `<div class="mock-ui"><div class="mock-top">${icon} Messages · ผู้ส่งไม่ระบุชื่อ</div><div class="bubble">${s.mock}</div></div>`;
      if (s.type === "post") return `<div class="mock-ui"><div class="mock-top">${icon} Social Feed · เนื้อหาที่ถูกแชร์</div><div class="post">${s.mock}</div></div>`;
      if (s.type === "email") return `<div class="mock-ui"><div class="mock-top">${icon} Mail Inbox</div><div class="email">${s.mock}</div></div>`;
      return `<div class="mock-ui"><div class="mock-top">${icon} Security Setting</div><div style="padding:16px;background:var(--surface);border-radius:8px;border:1px solid var(--line);"><div style="letter-spacing:4px;font-size:20px;color:var(--primary);background:var(--bg);padding:12px;border-radius:6px;border:1px solid var(--line);">••••••••••••••••</div><div style="display:flex;gap:6px;margin-top:12px;"><i style="flex:1;height:4px;background:var(--success);border-radius:2px;"></i><i style="flex:1;height:4px;background:var(--success);border-radius:2px;"></i><i style="flex:1;height:4px;background:var(--success);border-radius:2px;"></i><i style="flex:1;height:4px;background:var(--success);border-radius:2px;"></i><i style="flex:1;height:4px;background:var(--success);border-radius:2px;"></i></div><p class="muted" style="font-size:13px; margin:12px 0 0;">${s.mock}</p></div></div>`;
    }

    function playQuestion() {
      const s = activeMission.scenarios[currentQuestion];
      const options = s.options.map((o, i) => `
        <button class="option" onclick="chooseAnswer(${i})">
          <span class="option-key">${"ABCD"[i]}</span><span>${o[0]}</span>
        </button>`).join("");

      render(`
        <div class="game-header">
          <div>
            <div class="mission-label">MISSION ${String(activeMission.id).padStart(2, "0")}</div>
            <h2>${activeMission.title}</h2>
            <div class="progress" style="margin-top:8px; width: 100px;"><i style="width:${((currentQuestion + 1) / 3) * 100}%"></i></div>
          </div>
          <div class="safety-box"><span>SAFETY POINT</span><b>${state.total} / 150</b></div>
        </div>
        <div class="scenario-card">
          <div class="eyebrow" style="margin-bottom:12px;">สถานการณ์ที่ ${currentQuestion + 1}</div>
          <h3>${s.title}</h3>
          ${mockHTML(s)}
          <h3 style="font-size:18px; margin-top:24px;">${s.question}</h3>
          <div class="options">${options}</div>
        </div>
      `);
    }

    function chooseAnswer(index) {
      const s = activeMission.scenarios[currentQuestion];
      const [answer, points] = s.options[index];
      const key = `${activeMission.id}-${currentQuestion}`;
      const firstTry = state.answers[key] === undefined;

      if (firstTry) {
        state.answers[key] = points;
        state.total += points;
        save();
      }

      const level = points >= 10 ? ["Excellent Decision", "good", "ตัวเลือกที่ยอดเยี่ยม!", "check-circle-2"] :
                    points >= 7 ? ["Good Thinking", "good", "การคิดวิเคราะห์ที่ดี!", "thumbs-up"] :
                    points >= 4 ? ["Be Careful", "warn", "ทางเลือกนี้มีความเสี่ยงแฝงอยู่", "alert-triangle"] :
                    ["High Risk", "bad", "ตัวเลือกนี้มีความเสี่ยงสูงมาก", "octagon-alert"];
                    
      const explanation = points >= 10
        ? `“${answer}” เป็นแนวทางที่ปลอดภัยที่สุด ช่วยหยุดความเสี่ยงก่อนเกิดความเสียหาย`
        : points >= 7
        ? `“${answer}” เป็นการคิดอย่างรอบคอบ แต่แนะนำให้ตรวจสอบกับช่องทางทางการโดยตรงเพิ่มด้วย`
        : points >= 4
        ? `“${answer}” อาจดูปลอดภัยในบางส่วน แต่ยังไม่เพียงพอต่อการป้องกันการรั่วไหลของข้อมูล`
        : `“${answer}” อาจนำไปสู่การสูญเสียข้อมูลหรือทรัพย์สิน ผู้ไม่หวังดีมักใช้ความเร่งด่วนเข้ากดดัน`;

      render(`
        <div class="game-header">
          <div><div class="mission-label">MISSION ${String(activeMission.id).padStart(2, "0")}</div><h2>${activeMission.title}</h2></div>
          <div class="safety-box"><span>SAFETY POINT</span><b>${state.total} / 150</b></div>
        </div>
        <div class="feedback ${level[1]}">
          <div class="eyebrow" style="margin-bottom:12px;">${level[0]}</div>
          <h3><i data-lucide="${level[3]}"></i> ${level[2]}</h3>
          <div class="score-gain">${firstTry ? "+" + points + " SP" : "ทบทวนเนื้อหา"} ${firstTry ? `<span class="score-pill"><i data-lucide="shield" class="icon-sm"></i> ${points >= 10 ? "ปลอดภัยมาก" : points >= 7 ? "ค่อนข้างปลอดภัย" : points >= 4 ? "มีความเสี่ยง" : "เสี่ยงสูง"}</span>` : ""}</div>
          <p class="muted" style="font-size: 15px;">${explanation}</p>
          
          <div class="note"><b><i data-lucide="search" class="icon-sm"></i> จุดสังเกตที่สำคัญ</b><p>${s.clues}</p></div>
          <div class="note"><b><i data-lucide="lightbulb" class="icon-sm"></i> หลักการที่ควรจำ</b><p>${s.remember}</p></div>
          
          <div class="btn-group">
            <button class="btn btn-primary" onclick="nextQuestion()">${currentQuestion < 2 ? "ส่วนต่อไป" : "สรุปผลการปฏิบัติการ"} <i data-lucide="arrow-right" class="icon-sm"></i></button>
            <button class="btn btn-secondary" onclick="playQuestion()">ดูสถานการณ์อีกครั้ง</button>
          </div>
        </div>
      `);
    }

    function nextQuestion() {
      if (currentQuestion < 2) {
        currentQuestion++;
        playQuestion();
      } else {
        completeMission();
      }
    }

    function completeMission() {
      const id = activeMission.id;
      const missionScore = activeMission.scenarios.reduce((sum, _, i) => sum + (state.answers[`${id}-${i}`] || 0), 0);

      if (!state.completed.includes(id)) {
        state.completed.push(id);
        state.badges.push(activeMission.badge);
        state.currentMission = Math.min(id + 1, 5);
        save();
        showToast(`ได้รับ Achievement: ${activeMission.badge}`, "var(--primary)", "award");
      }

      const strengths = missionScore >= 24
        ? "วิเคราะห์สถานการณ์ได้รอบคอบและเลือกแนวทางที่ลดความเสี่ยงได้ดี"
        : missionScore >= 15
          ? "เริ่มมองเห็นสัญญาณความเสี่ยงและสามารถนำหลักการไปใช้ได้บางส่วน"
          : "เริ่มต้นฝึกสังเกตความเสี่ยงได้แล้ว และควรทบทวนจุดสังเกตสำคัญเพิ่มเติม";
      const caution = missionScore >= 24
        ? "รักษานิสัยตรวจสอบก่อนคลิก ก่อนแชร์ และก่อนเปิดเผยข้อมูลให้สม่ำเสมอ"
        : "ทบทวนคำอธิบายของแต่ละสถานการณ์ โดยเฉพาะตัวเลือกที่มีความเสี่ยงแฝง";

      render(`
        <div class="result-card">
          <div class="result-icon"><i data-lucide="check-circle" style="width:64px;height:64px;stroke-width:1;"></i></div>
          <div class="eyebrow">MISSION COMPLETE</div>
          <h1 style="margin-top:0;">ภารกิจเสร็จสิ้น</h1>
          <p class="muted">${activeMission.title}</p>
          <div class="score-total">${missionScore} / 30</div>
          
          <div class="insight"><b><i data-lucide="check" class="icon-sm"></i> จุดแข็งที่พบ</b><span>${strengths}</span></div>
          <div class="insight"><b><i data-lucide="alert-circle" class="icon-sm"></i> ข้อเสนอแนะ</b><span>${caution}</span></div>
          <div class="insight"><b><i data-lucide="award" class="icon-sm"></i> ความสำเร็จ</b><span>${activeMission.badge}</span></div>
          
          <div class="btn-group" style="justify-content: center; margin-top: 32px;">
            <button class="btn btn-primary" onclick="${id === 5 ? "overallResult()" : `missionIntro(${id + 1})`}">${id === 5 ? "ดูรายงานสรุปทั้งหมด" : "เข้าสู่ภารกิจถัดไป"} <i data-lucide="arrow-right" class="icon-sm"></i></button>
            <button class="btn btn-secondary" onclick="missionMap()"><i data-lucide="layout-grid" class="icon-sm"></i> แดชบอร์ด</button>
          </div>
        </div>
      `);
    }

    function overallResult() {
      const level = state.total >= 121 ? "DIGITAL SAFETY MASTER" : state.total >= 91 ? "DIGITAL DETECTIVE" : state.total >= 51 ? "SAFETY GUARD" : "DIGITAL BEGINNER";
      
      const skillsHTML = missions.map(m => {
        const score = m.scenarios.reduce((sum, _, i) => sum + (state.answers[`${m.id}-${i}`] || 0), 0);
        return `
          <div style="margin: 16px 0; text-align: left;">
            <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:500;">
              <span>${m.title}</span><span>${score}/30</span>
            </div>
            <div class="progress" style="margin-top:8px;"><i style="width:${(score / 30) * 100}%"></i></div>
          </div>`;
      }).join("");

      render(`
        <div class="result-card">
          <div class="result-icon"><i data-lucide="graduation-cap" style="width:64px;height:64px;stroke-width:1;"></i></div>
          <div class="eyebrow">ASSESSMENT COMPLETE</div>
          <h1 style="font-size:28px;">การประเมินเสร็จสมบูรณ์</h1>
          <p class="muted" style="font-size:15px; margin-top:8px;">ขอแสดงความยินดี การวิเคราะห์ในครั้งนี้สะท้อนทักษะในยุคดิจิทัลของคุณ</p>
          
          <div class="score-total" style="margin: 32px 0;">${state.total} / 150</div>
          
          <div class="note" style="text-align:left;">
            <b><i data-lucide="shield" class="icon-sm"></i> ระดับความปลอดภัย: ${level}</b>
            <p>คะแนนดังกล่าวเป็นการสะท้อนความรอบคอบเบื้องต้นในการจัดการกับสถานการณ์จำลอง</p>
          </div>
          
          <div style="margin-top:32px">${skillsHTML}</div>
          
          <div class="btn-group" style="justify-content: center; margin-top: 40px;">
            <button class="btn btn-primary" onclick="safetyProfile()"><i data-lucide="bar-chart-2" class="icon-sm"></i> ตรวจสอบโปรไฟล์</button>
            <button class="btn btn-secondary" onclick="showBadges()"><i data-lucide="award" class="icon-sm"></i> Achievements</button>
          </div>
        </div>
      `);
    }

    function safetyProfile() {
      const scores = missions.map(m =>
        m.scenarios.reduce((sum, _, i) => sum + (state.answers[`${m.id}-${i}`] || 0), 0)
      );
      const total = scores.reduce((a, b) => a + b, 0);
      const max = Math.max(...scores);
      const min = Math.min(...scores);
      const strong = missions[scores.indexOf(max)];
      const improve = missions[scores.indexOf(min)];

      const skillRows = missions.map((m, i) => {
        const score = scores[i];
        const pct = Math.round((score / 30) * 100);
        return `
          <div class="skill-row">
            <div class="skill-head"><span>${m.title}</span><span>${score}/30</span></div>
            <div class="progress" style="margin-top:8px;"><i style="width:${pct}%"></i></div>
          </div>`;
      }).join("");

      render(`
        <div class="result-card">
          <div class="result-icon"><i data-lucide="pie-chart" style="width:56px;height:56px;stroke-width:1;"></i></div>
          <div class="eyebrow">PERSONAL PROFILE</div>
          <h1 style="font-size:28px;">รายงานโปรไฟล์ความปลอดภัย</h1>
          <p class="muted">สรุปจากการตัดสินใจครั้งแรกของทั้ง 15 สถานการณ์</p>

          <div class="profile-grid">
            <div class="profile-stat"><b>${total}/150</b><span>Safety Points</span></div>
            <div class="profile-stat"><b>${state.completed.length}/5</b><span>Mission Complete</span></div>
          </div>

          <div style="margin-top:28px;">${skillRows}</div>

          <div class="insight">
            <b><i data-lucide="trending-up" class="icon-sm"></i> จุดแข็งเด่นชัด</b>
            <span>ด้าน ${strong.title} ได้ ${max}/30 แสดงว่าคุณมีแนวโน้มในการตัดสินใจด้านนี้ได้ดี</span>
          </div>

          <div class="insight">
            <b><i data-lucide="target" class="icon-sm"></i> ด้านที่ควรเสริม</b>
            <span>ด้าน ${improve.title} ได้ ${min}/30 ควรกลับไปทบทวนจุดสังเกตและหลักการสำคัญของภารกิจนี้</span>
          </div>

          <div class="insight">
            <b><i data-lucide="lightbulb" class="icon-sm"></i> หลักการสำคัญ</b>
            <span>หยุด → ตรวจสอบ → ค่อยตัดสินใจ โดยเฉพาะเมื่อพบความเร่งด่วน ลิงก์แปลก หรือการขอข้อมูลส่วนตัว</span>
          </div>

          <div class="btn-group" style="justify-content:center;margin-top:32px;">
            <button class="btn btn-primary" onclick="showBadges()">ดู Achievements <i data-lucide="arrow-right" class="icon-sm"></i></button>
            <button class="btn btn-secondary" onclick="missionMap()">กลับหน้าแดชบอร์ด</button>
          </div>
        </div>
      `);
    }

    function showBadges() {
      const allBadges = [
        ["shield", "Digital Beginner", "เริ่มต้นใช้งานระบบ", true],
        ["shield-check", "Safety Guard", "ผ่านภารกิจอย่างน้อย 3 ด่าน", state.completed.length >= 3],
        ...missions.map(m => [m.badgeIcon, m.badge, `ผ่าน ${m.title}`, state.badges.includes(m.badge)]),
        ["trophy", "Digital Safety Master", "สำเร็จครบทั้ง 5 ภารกิจ", state.completed.length === 5]
      ];

      render(`
        <div class="section-title">
          <div><div class="eyebrow">ACHIEVEMENTS</div><h2>รายการความสำเร็จ</h2></div>
          <span class="muted" style="font-size:14px;">${allBadges.filter(x => x[3]).length} / ${allBadges.length}</span>
        </div>
        <div class="badge-grid">
          ${allBadges.map(b => `
            <div class="badge ${b[3] ? "unlocked" : "locked"}">
              <i data-lucide="${b[0]}" class="icon-lg" style="color: ${b[3] ? 'var(--secondary)' : 'var(--muted)'}"></i>
              <b>${b[1]}</b>
              <small>${b[3] ? b[2] : "ยังไม่สำเร็จ"}</small>
            </div>`).join("")}
        </div>
        <div class="btn-group" style="margin-top: 32px;">
          <button class="btn btn-primary" onclick="${state.completed.length === 5 ? "overallResult()" : "missionMap()"}"><i data-lucide="arrow-left" class="icon-sm"></i> ${state.completed.length === 5 ? "ดูรายงานสรุป" : "กลับหน้าแดชบอร์ด"}</button>
        </div>
      `);
    }

    function resetGame() {
      if (!confirm("ระบบจะลบข้อมูลประวัติการทำภารกิจและผลคะแนนทั้งหมด ยืนยันที่จะเริ่มดำเนินการใหม่หรือไม่?")) return;
      localStorage.removeItem("dsq_state");
      state = { name: "", total: 0, completed: [], scores: {}, badges: [], currentMission: 1, answers: {} };
      home();
      showToast("รีเซ็ตระบบเรียบร้อยแล้ว", "var(--primary)", "rotate-ccw");
    }

    function showToast(message, color = "var(--primary)", icon = "info") {
      const old = document.querySelector(".toast");
      if (old) old.remove();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.style.background = color;
      toast.innerHTML = `<i data-lucide="${icon}" class="icon-sm"></i> ${message}`;
      document.body.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), 2700);
    }

    // เริ่มต้นระบบ
    updateNav();
    home();
  </script>
</body>
</html>
