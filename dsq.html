<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>ด่านป้องกันภัยไซเบอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#eef1fb;
  --surface:#ffffff;
  --ink:#10142c;
  --muted:#636b8c;
  --line:#e2e5f3;
  --primary:#3454ff;
  --primary-ink:#1f34c9;
  --accent:#7c3aed;
  --success:#16a34a;
  --success-bg:#eafbf1;
  --warning:#d97706;
  --warning-bg:#fff8e8;
  --danger:#dc2626;
  --danger-bg:#fef1f1;
  --nav-h:64px;
  --topbar-h:58px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --sidebar-w:96px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input{font:inherit}
img,svg{display:block}
.icon-sm{width:17px;height:17px;flex:none}
.icon-md{width:22px;height:22px;flex:none}
.icon-lg{width:28px;height:28px;flex:none}
.hidden{display:none !important}

/* ---------- App shell ---------- */
.app{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
.topbar{
  position:sticky;top:0;z-index:40;
  padding-top:var(--safe-t);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  height:var(--topbar-h);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:0 16px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-mark{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  box-shadow:0 6px 14px rgba(52,84,255,.28);
}
.score-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:999px;
  background:#eef1ff;color:var(--primary-ink);font-weight:700;font-size:13px;
  border:1px solid #dbe2ff;
}
.reset-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.reset-btn:active{background:#f1f2fa}

.content-wrap{flex:1;display:flex;min-height:0}
.content{
  flex:1;
  width:100%;
  max-width:640px;
  margin:0 auto;
  padding:18px 16px calc(var(--nav-h) + 28px);
}

/* bottom tab bar (mobile) */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tab{
  flex:1;max-width:110px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 10px;color:var(--muted);font-size:11px;font-weight:600;
  transition:color .15s;
}
.tab.active{color:var(--primary)}
.tab .icon-md{transition:transform .15s}
.tab.active .icon-md{transform:translateY(-1px)}

/* sidebar (tablet/desktop) */
.sidebar{
  display:none;
  width:var(--sidebar-w);flex:none;
  border-right:1px solid var(--line);
  background:var(--surface);
  padding:22px 0;
  flex-direction:column;align-items:center;gap:6px;
}
.side-tab{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 4px;color:var(--muted);font-size:11px;font-weight:600;border-radius:14px;
}
.side-tab.active{color:var(--primary-ink);background:#eef1ff}

@media (min-width:900px){
  .tabbar{display:none}
  .sidebar{display:flex}
  .content{max-width:720px;padding:28px 28px 40px}
}

/* ---------- Building blocks ---------- */
.eyebrow{color:var(--muted);font-size:13px;font-weight:600;margin:0 0 4px}
.h1{font-size:clamp(26px,7vw,34px);line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}
.h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.lead{color:var(--muted);line-height:1.7;font-size:14.5px;margin:0}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 10px 26px rgba(16,20,44,.05);
}
.pad{padding:20px}

.btn{
  min-height:50px;border-radius:14px;padding:0 18px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:scale(.98)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-ink));box-shadow:0 10px 22px rgba(52,84,255,.28)}
.btn-secondary{background:#f1f3fb;color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-group{display:flex;flex-direction:column;gap:10px;margin-top:22px}

.hero{
  position:relative;overflow:hidden;padding:30px 22px;border-radius:26px;color:#fff;
  background:radial-gradient(circle at 88% 6%,rgba(124,58,237,.4),transparent 60%),
             radial-gradient(circle at 8% 100%,rgba(52,84,255,.45),transparent 60%),
             linear-gradient(160deg,#0d1230,#161b45 60%,#241a5c);
  box-shadow:0 20px 40px rgba(13,18,48,.3);
}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hero-badge{
  display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  padding:8px 11px;border-radius:12px;color:#e4e8ff;
}
.hero-stats{display:flex;gap:18px;margin-top:22px}
.hero-stat b{display:block;font-size:22px;font-weight:800}
.hero-stat span{font-size:12px;color:#c4cbf4}

.field{margin-top:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.text-input{
  width:100%;height:52px;border:1px solid #d7dcef;border-radius:14px;padding:0 15px;outline:0;background:#fbfbff;
}
.text-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(52,84,255,.12)}

.progress{height:8px;border-radius:999px;background:#e7eaf7;overflow:hidden}
.progress > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s ease}

.dash-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.progress-card{padding:16px 18px;margin-bottom:18px}
.progress-card .row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:9px}

.mission-list{display:flex;flex-direction:column;gap:12px}
.mission-row{
  width:100%;text-align:left;display:flex;align-items:center;gap:14px;
  padding:15px 16px;border-radius:18px;background:var(--surface);
  border:1px solid var(--line);box-shadow:0 8px 20px rgba(16,20,44,.04);
}
.mission-row:active:not(.locked){transform:scale(.99)}
.mission-row.locked{opacity:.55}
.m-index{
  flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:#eef1ff;color:var(--primary-ink);
}
.mission-row.done .m-index{background:var(--success-bg);color:var(--success)}
.m-body{flex:1;min-width:0}
.m-body h3{margin:0 0 2px;font-size:15px;font-weight:700}
.m-body p{margin:0;font-size:12.5px;color:var(--muted)}
.m-status{flex:none}
.chip{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px}
.chip.done{background:var(--success-bg);color:var(--success)}
.chip.open{background:#eef1ff;color:var(--primary-ink)}
.chip.locked{background:#f1f2f7;color:var(--muted)}

.note{
  margin-top:14px;padding:14px 15px;border-radius:16px;background:#f7f8fd;border:1px solid var(--line);
}
.note b{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:5px}
.note p{margin:0;font-size:13.5px;line-height:1.7;color:var(--muted)}

.mission-hero{text-align:center;padding:10px 4px 4px}
.mission-hero .m-icon-big{
  width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#eef1ff,#f3ecff);color:var(--primary-ink);
}

.scn-tag{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px}
.scn-title{font-size:19px;font-weight:800;margin:0 0 14px}
.mock{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fafbff;margin-bottom:18px}
.mock-top{height:38px;display:flex;align-items:center;gap:7px;padding:0 13px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}
.mock-body{padding:16px;font-size:13.5px;line-height:1.8;white-space:pre-line;color:var(--ink)}
.mock-body.pw{padding:16px}
.pw-box{letter-spacing:3px;font-size:16px;color:var(--primary-ink);background:#fff;padding:12px;border-radius:10px;border:1px solid var(--line);text-align:center}
.pw-bars{display:flex;gap:5px;margin-top:11px}
.pw-bars i{flex:1;height:4px;border-radius:2px;background:var(--success)}

.q-title{font-size:16px;font-weight:700;margin:0 0 12px}
.choice-list{display:flex;flex-direction:column;gap:9px}
.choice{
  display:flex;align-items:flex-start;gap:12px;text-align:left;
  padding:14px 15px;border:1px solid var(--line);background:#fff;border-radius:15px;
}
.choice:active{background:#f6f8ff;border-color:#c7d1ff}
.choice-key{
  flex:none;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;
  background:#f1f3fb;color:var(--muted);font-size:12px;font-weight:800;
}
.choice-text{font-size:13.7px;line-height:1.6;padding-top:2px}

.feedback{border-radius:20px;padding:18px}
.feedback.good{background:var(--success-bg);border:1px solid #bdeecd}
.feedback.warn{background:var(--warning-bg);border:1px solid #fce3a6}
.feedback.bad{background:var(--danger-bg);border:1px solid #f7c6c6}
.fb-tag{font-size:12px;font-weight:700;margin-bottom:6px}
.feedback.good .fb-tag{color:var(--success)}
.feedback.warn .fb-tag{color:var(--warning)}
.feedback.bad .fb-tag{color:var(--danger)}
.fb-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;margin:0 0 8px}
.fb-gain{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px}
.fb-text{font-size:13.7px;line-height:1.75;color:#3b4160;margin:0}

.result-hero{text-align:center;padding:8px 6px 4px}
.result-icon{width:60px;height:60px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:var(--success-bg);color:var(--success)}
.result-score{font-size:44px;font-weight:900;letter-spacing:-.02em;margin:6px 0}

.insight{padding:14px 15px;border-radius:16px;background:#f7f8fd;border:1px solid var(--line);margin-top:12px}
.insight b{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:5px}
.insight span{font-size:13.3px;line-height:1.7;color:var(--muted)}

.skill-row{padding:13px 0;border-bottom:1px solid var(--line)}
.skill-row:last-child{border-bottom:none}
.skill-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px}

.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.profile-stat{padding:16px;border-radius:16px;background:#f7f8fd;border:1px solid var(--line);text-align:center}
.profile-stat b{display:block;font-size:22px;font-weight:800}
.profile-stat span{font-size:12px;color:var(--muted)}

.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.badge{padding:18px 10px;text-align:center;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.badge.locked{opacity:.45}
.badge .icon-lg{margin:0 auto 10px}
.badge b{display:block;font-size:12.8px;font-weight:700;margin-bottom:4px;line-height:1.4}
.badge small{font-size:11px;color:var(--muted);line-height:1.5}

.avatar-lg{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--primary),var(--accent))}
.profile-head{display:flex;align-items:center;gap:14px}
.profile-head h2{margin:0}
.profile-head p{margin:2px 0 0;color:var(--muted);font-size:13px}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + var(--safe-b));z-index:100;
  transform:translate(-50%,120px);background:#12142b;color:#fff;padding:12px 16px;border-radius:14px;
  box-shadow:0 16px 40px rgba(0,0,0,.24);transition:transform .25s ease;max-width:min(88vw,420px);
  display:flex;align-items:center;gap:9px;font-size:13.5px;
}
.toast.show{transform:translate(-50%,0)}
@media (min-width:900px){ .toast{bottom:24px} }

.loading-screen{min-height:100dvh;display:grid;place-items:center;gap:14px;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #dfe3f6;border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width:640px){
  .badge-grid{grid-template-columns:repeat(3,1fr)}
  .btn-group{flex-direction:row}
  .btn-group .btn{width:auto;flex:1}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="shield-check" class="icon-sm"></i></div>
        <span id="brandText">ด่านป้องกันภัยไซเบอร์</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="score-pill hidden" id="scorePill"></div>
        <button class="reset-btn hidden" id="resetBtn" onclick="resetGame()"><i data-lucide="rotate-ccw" class="icon-sm"></i></button>
      </div>
    </div>
  </header>

  <div class="content-wrap">
    <nav class="sidebar hidden" id="sidebar">
      <button class="side-tab" data-tab="home" onclick="goTab('home')"><i data-lucide="home" class="icon-md"></i>หน้าหลัก</button>
      <button class="side-tab" data-tab="badges" onclick="goTab('badges')"><i data-lucide="award" class="icon-md"></i>รางวัล</button>
      <button class="side-tab" data-tab="profile" onclick="goTab('profile')"><i data-lucide="user" class="icon-md"></i>โปรไฟล์</button>
    </nav>
    <main class="content" id="screen"></main>
  </div>

  <nav class="tabbar hidden" id="tabbar">
    <button class="tab" data-tab="home" onclick="goTab('home')"><i data-lucide="home" class="icon-md"></i>หน้าหลัก</button>
    <button class="tab" data-tab="badges" onclick="goTab('badges')"><i data-lucide="award" class="icon-md"></i>รางวัล</button>
    <button class="tab" data-tab="profile" onclick="goTab('profile')"><i data-lucide="user" class="icon-md"></i>โปรไฟล์</button>
  </nav>
</div>

<script>
/* ================= DATA ================= */
const missions = [
  {
    id: 1, icon: "message-square-warning", title: "ข้อความหลอกลวง", subtitle: "อย่าหลงกลข้อความปลอม",
    badge: "นักจับสแกม", badgeIcon: "message-square-warning",
    goal: "สังเกตข้อความหลอกลวง ไม่เปิดเผยรหัส OTP และตรวจสอบผ่านช่องทางทางการ",
    scenarios: [
      {
        title: "รางวัลที่มาแบบเร่งด่วน", type: "sms", icon: "message-circle",

        question: "คุณจะทำอย่างไร?",

        ],

      {

        options: [

        remember: "OTP คือรหัสยืนยันธุรกรรม ห้ามบอกใคร แม้ผู้อ้างเป็นธนาคาร",
        clues: "ธนาคารไม่ขอ OTP, มีการสร้างความกลัว, ติดต่อผ่านเบอร์หรือแอปทางการ"
      },
      {
        title: "บัญชีจะถูกระงับใน 5 นาที", type: "sms", icon: "alert-circle",
        mock: "แจ้งเตือนด่วน: บัญชีของคุณจะถูกระงับภายใน 5 นาที!\nยืนยันตัวตนที่ bit.ly/account-safe-now",
        question: "คุณควรทำอย่างไรต่อ?",
        options: [
          ["รีบกดลิงก์เพราะเหลือเวลาเพียง 5 นาที", 0],
          ["เข้าผ่านแอปหรือเว็บไซต์ทางการด้วยตนเองเพื่อตรวจสอบ", 10],
          ["ส่งข้อความนี้ไปถามกลุ่มเพื่อนก่อน", 7],
          ["กรอกข้อมูลเฉพาะชื่อเพื่อทดลอง", 1]
        ],
        remember: "อย่าปล่อยให้ความเร่งด่วนบังคับการตัดสินใจของเรา",
        clues: "เวลาจำกัดผิดปกติ, ลิงก์ย่อ, ข้อความขู่ให้กลัว"
      }
    ]
  },
  {
    id: 2, icon: "lock-keyhole", title: "รหัสผ่านแข็งแกร่ง", subtitle: "สร้างเกราะป้องกันบัญชี",
    badge: "เจ้าแห่งรหัสผ่าน", badgeIcon: "key-round",
    goal: "สร้างรหัสผ่านที่ปลอดภัย ใช้รหัสต่างกันในแต่ละบริการ และเปิดใช้ 2FA",
    scenarios: [

/* ================= STATE ================= */
const STORAGE_KEY = "dsq_state_v1";
const defaultState = () => ({ name:"", total:0, completed:[], badges:[], answers:{} });
let state = defaultState();
let activeMission = null;
let currentQuestion = 0;
let activeTab = "home"; // home | badges | profile
let storageReady = false;

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){ /* non-fatal: state stays in memory for this session */ }
  updateChrome();
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = { ...defaultState(), ...parsed };
    }
  }catch(e){
    state = defaultState();
  }
  storageReady = true;
}

/* ================= CHROME (topbar + nav) ================= */
function updateChrome(){
  const scorePill = document.getElementById("scorePill");
  const resetBtn = document.getElementById("resetBtn");
  const tabbar = document.getElementById("tabbar");
  const sidebar = document.getElementById("sidebar");
  const brandText = document.getElementById("brandText");
  const loggedIn = !!state.name;

  scorePill.classList.toggle("hidden", !loggedIn);
  resetBtn.classList.toggle("hidden", !loggedIn);
  tabbar.classList.toggle("hidden", !loggedIn);
  sidebar.classList.toggle("hidden", !loggedIn);
  brandText.textContent = loggedIn ? esc(state.name) : "ด่านป้องกันภัยไซเบอร์";

  if(loggedIn){
    scorePill.innerHTML = `<i data-lucide="shield" class="icon-sm"></i>${state.total} คะแนน`;
  }

  document.querySelectorAll(".tab, .side-tab").forEach(el=>{
    el.classList.toggle("active", el.dataset.tab === activeTab);
  });

  lucide.createIcons();
}

function goTab(tab){
  activeTab = tab;
  if(tab === "home") missionMap();
  if(tab === "badges") showBadges();
  if(tab === "profile") profileScreen();
}

function render(html){
  document.getElementById("screen").innerHTML = html;
  updateChrome();
  document.getElementById("screen").scrollTop = 0;
  window.scrollTo({top:0});
}

function showToast(message, icon="info"){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<i data-lucide="${icon}" class="icon-sm"></i><span>${esc(message)}</span>`;
  document.body.appendChild(t);
  lucide.createIcons();
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),250); }, 2600);
}

        <div class="hero-badge"><i data-lucide="lock" class="icon-sm"></i>ปกป้องบัญชี</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="startJourney()"><i data-lucide="play" class="icon-sm"></i>เริ่มต้นใช้งาน</button>
      <button class="btn btn-secondary" onclick="howToPlay()"><i data-lucide="info" class="icon-sm"></i>วิธีเล่น</button>
    </div>
  `);
}

function howToPlay(){
  render(`
    <div class="card pad">
      <p class="eyebrow">วิธีเล่น</p>
      <h2 class="h2">ทำความเข้าใจก่อนเริ่ม</h2>
      <p class="lead" style="margin-top:8px">มีทั้งหมด 5 ภารกิจ ภารกิจละ 3 สถานการณ์ เลือกแนวทางที่คุณคิดว่าเหมาะสมที่สุด แล้วดูผลลัพธ์พร้อมคำอธิบาย</p>
      <div class="note"><b><i data-lucide="graduation-cap" class="icon-sm"></i>เน้นการเรียนรู้</b><p>ไม่มีระบบแพ้ คุณเล่นต่อได้เสมอ คะแนนจะนับจากการเลือกครั้งแรกในแต่ละสถานการณ์เท่านั้น</p></div>
      <div class="note"><b><i data-lucide="award" class="icon-sm"></i>รางวัลสะสม</b><p>ผ่านแต่ละภารกิจเพื่อรับตราความสำเร็จ และดูรายงานทักษะเมื่อผ่านครบทั้ง 5 ภารกิจ</p></div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="startJourney()">พร้อมแล้ว <i data-lucide="arrow-right" class="icon-sm"></i></button>
        <button class="btn btn-secondary" onclick="home()">กลับหน้าแรก</button>
      </div>
    </div>
  `);
}

function startJourney(){
  if(state.name) { activeTab="home"; return missionMap(); }
  render(`
    <div class="card pad">
      <p class="eyebrow">เริ่มต้นใช้งาน</p>
      <h2 class="h2">ตั้งชื่อผู้เล่น</h2>
      <p class="lead" style="margin-top:6px">ใช้ชื่อหรือนามแฝงก็ได้ เพื่อบันทึกความคืบหน้าของคุณ</p>
      <div class="field">
        <label for="nameInput">ชื่อของคุณ</label>
        <input id="nameInput" class="text-input" maxlength="24" placeholder="เช่น น้องฟ้า" autocomplete="off" onkeydown="if(event.key==='Enter')createProfile()">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="createProfile()">เริ่มเล่น <i data-lucide="arrow-right" class="icon-sm"></i></button>
        <button class="btn btn-secondary" onclick="home()">ย้อนกลับ</button>
      </div>
    </div>
  `);
  setTimeout(()=>document.getElementById("nameInput")?.focus(), 250);
}

async function createProfile(){
  const val = document.getElementById("nameInput").value.trim();
  if(!val) return showToast("กรุณาระบุชื่อก่อนเริ่มต้น","alert-circle");
  state.name = val;
  await persist();
  activeTab = "home";
  missionMap();
}

function missionMap(){
  activeTab = "home";
  const completedCount = state.completed.length;
  const rows = missions.map(m=>{
    const done = state.completed.includes(m.id);
    const available = m.id === 1 || state.completed.includes(m.id-1);
    const chip = done ? `<span class="chip done">เสร็จแล้ว</span>` : available ? `<span class="chip open">พร้อมเล่น</span>` : `<span class="chip locked">ล็อกอยู่</span>`;
    return `
      <button class="mission-row ${done?"done":""} ${available?"":"locked"}" ${available?`onclick="missionIntro(${m.id})"`:`onclick="lockedTap()"`}>
        <div class="m-index"><i data-lucide="${done?"check":m.icon}" class="icon-md"></i></div>
        <div class="m-body">
          <h3>${esc(m.title)}</h3>
          <p>${esc(m.subtitle)}</p>
        </div>
        <div class="m-status">${chip}</div>
      </button>`;
  }).join("");

  render(`
    <div class="dash-header">
      <div>
        <p class="eyebrow">สวัสดี ${esc(state.name)}</p>
        <h2 class="h2">ภารกิจของคุณ</h2>
      </div>
    </div>
    <div class="card progress-card">
      <div class="row"><span>ความคืบหน้า</span><span>${completedCount}/5 ภารกิจ</span></div>
      <div class="progress"><i style="width:${completedCount*20}%"></i></div>
    </div>
    <div class="mission-list">${rows}</div>
  `);
}

function lockedTap(){
  showToast("ผ่านภารกิจก่อนหน้าก่อนนะ","lock");
}

function missionIntro(id){
  const m = missions.find(x=>x.id===id);
  render(`
    <div class="card pad">
      <div class="mission-hero">
        <div class="m-icon-big"><i data-lucide="${m.icon}" class="icon-lg"></i></div>
        <p class="eyebrow">ภารกิจที่ ${m.id}</p>
        <h2 class="h2">${esc(m.title)}</h2>
        <p class="lead">${esc(m.subtitle)}</p>
      </div>
      <div class="note"><b><i data-lucide="target" class="icon-sm"></i>เป้าหมายของภารกิจ</b><p>${esc(m.goal)}</p></div>
      <div class="note"><b><i data-lucide="layout-list" class="icon-sm"></i>ระบบคะแนน</b><p>3 สถานการณ์ สูงสุด 10 คะแนนต่อข้อ คำตอบทุกแบบให้คะแนนตามระดับความปลอดภัย เพื่อให้ทุกการเลือกเป็นบทเรียน</p></div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="playMission(${id})"><i data-lucide="play" class="icon-sm"></i>เริ่มภารกิจ</button>
        <button class="btn btn-secondary" onclick="missionMap()">กลับแดชบอร์ด</button>
      </div>
    </div>
  `);
}

function playMission(id){
  const mission = missions.find(x=>x.id===id);
  const available = id===1 || state.completed.includes(id-1);
  if(!available){ showToast("กรุณาผ่านภารกิจก่อนหน้า","lock"); return missionMap(); }
  activeMission = mission;
  currentQuestion = 0;
  playQuestion();
}

function mockHTML(s){
  const icon = `<i data-lucide="${s.icon||'message-square'}" class="icon-sm"></i>`;
  if(s.type==="sms") return `<div class="mock"><div class="mock-top">${icon}ข้อความ · ผู้ส่งไม่ระบุชื่อ</div><div class="mock-body">${s.mock}</div></div>`;
  if(s.type==="post") return `<div class="mock"><div class="mock-top">${icon}ฟีดโซเชียล · เนื้อหาที่ถูกแชร์</div><div class="mock-body">${s.mock}</div></div>`;
  if(s.type==="email") return `<div class="mock"><div class="mock-top">${icon}กล่องอีเมล</div><div class="mock-body">${s.mock}</div></div>`;
  return `<div class="mock"><div class="mock-top">${icon}การตั้งค่าความปลอดภัย</div><div class="mock-body pw">
      <div class="pw-box">••••••••••••••••</div>
      <div class="pw-bars"><i></i><i></i><i></i><i></i><i></i></div>
      <p style="margin:12px 0 0;color:var(--muted);font-size:13px">${s.mock}</p>
    </div></div>`;
}

function playQuestion(){
  const s = activeMission.scenarios[currentQuestion];
  const options = s.options.map((o,i)=>`
    <button class="choice" onclick="chooseAnswer(${i})">
      <span class="choice-key">${"ABCD"[i]}</span>
      <span class="choice-text">${esc(o[0])}</span>
    </button>`).join("");

  render(`
    <p class="eyebrow">ภารกิจที่ ${activeMission.id} · สถานการณ์ ${currentQuestion+1} จาก 3</p>
    <div class="progress" style="margin:8px 0 16px"><i style="width:${((currentQuestion+1)/3)*100}%"></i></div>
    <div class="card pad">
      <p class="scn-tag">${esc(activeMission.title)}</p>
      <h3 class="scn-title">${esc(s.title)}</h3>
      ${mockHTML(s)}
      <p class="q-title">${esc(s.question)}</p>
      <div class="choice-list">${options}</div>
    </div>
  `);
}

function chooseAnswer(index){
  const s = activeMission.scenarios[currentQuestion];
  const [answer, points] = s.options[index];
  const key = `${activeMission.id}-${currentQuestion}`;
  const firstTry = state.answers[key] === undefined;

  if(firstTry){
    state.answers[key] = points;
    state.total += points;
    persist();
  }

  const level = points>=10 ? ["ยอดเยี่ยม","good","ตัวเลือกที่ปลอดภัยที่สุด","check-circle-2"]
             : points>=7 ? ["คิดดีมาก","good","การตัดสินใจที่รอบคอบ","thumbs-up"]
             : points>=4 ? ["ระวังนิดหนึ่ง","warn","ทางเลือกนี้มีความเสี่ยงแฝงอยู่","alert-triangle"]
             : ["เสี่ยงสูง","bad","ตัวเลือกนี้มีความเสี่ยงสูงมาก","octagon-alert"];

  const explanation = points>=10
    ? `การเลือก “${esc(answer)}” ช่วยหยุดความเสี่ยงได้ก่อนเกิดความเสียหาย เป็นแนวทางที่ปลอดภัยที่สุด`
    : points>=7
    ? `“${esc(answer)}” เป็นการคิดอย่างรอบคอบ แต่ควรตรวจสอบกับช่องทางทางการโดยตรงเพิ่มเติมด้วย`
    : points>=4
    ? `“${esc(answer)}” อาจดูปลอดภัยบางส่วน แต่ยังไม่เพียงพอต่อการป้องกันการรั่วไหลของข้อมูล`
    : `“${esc(answer)}” อาจนำไปสู่การสูญเสียข้อมูลหรือทรัพย์สิน ผู้ไม่หวังดีมักใช้ความเร่งด่วนกดดันให้ตัดสินใจผิดพลาด`;

  render(`
    <p class="eyebrow">ภารกิจที่ ${activeMission.id} · สถานการณ์ ${currentQuestion+1} จาก 3</p>
    <div class="feedback ${level[1]}" style="margin-top:10px">
      <p class="fb-tag">${level[0]}</p>
      <h3 class="fb-title"><i data-lucide="${level[3]}" class="icon-md"></i>${level[2]}</h3>
      <div class="fb-gain">${firstTry ? `+${points} คะแนน` : "ทบทวนเนื้อหา"}</div>
      <p class="fb-text">${explanation}</p>
      <div class="note"><b><i data-lucide="search" class="icon-sm"></i>จุดสังเกตสำคัญ</b><p>${esc(s.clues)}</p></div>
      <div class="note"><b><i data-lucide="lightbulb" class="icon-sm"></i>หลักการที่ควรจำ</b><p>${esc(s.remember)}</p></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="nextQuestion()">${currentQuestion<2?"ไปต่อ":"สรุปผลภารกิจ"} <i data-lucide="arrow-right" class="icon-sm"></i></button>
      <button class="btn btn-secondary" onclick="playQuestion()">ดูสถานการณ์อีกครั้ง</button>
    </div>
  `);
}

function nextQuestion(){
  if(currentQuestion<2){ currentQuestion++; playQuestion(); }
  else completeMission();
}

async function completeMission(){
  const id = activeMission.id;
  const missionScore = activeMission.scenarios.reduce((sum,_,i)=> sum + (state.answers[`${id}-${i}`]||0), 0);
  let justEarnedBadge = false;

  if(!state.completed.includes(id)){
    state.completed.push(id);
    state.badges.push(activeMission.badge);
    await persist();
    justEarnedBadge = true;
  }

  const strengths = missionScore>=24
    ? "วิเคราะห์สถานการณ์ได้รอบคอบและเลือกแนวทางที่ลดความเสี่ยงได้ดี"
    : missionScore>=15
    ? "เริ่มมองเห็นสัญญาณความเสี่ยงและนำหลักการไปใช้ได้บางส่วน"
    : "เริ่มต้นฝึกสังเกตความเสี่ยงได้แล้ว ควรทบทวนจุดสังเกตสำคัญเพิ่มเติม";
  const caution = missionScore>=24
    ? "รักษานิสัยตรวจสอบก่อนคลิก ก่อนแชร์ และก่อนเปิดเผยข้อมูลให้สม่ำเสมอ"
    : "ทบทวนคำอธิบายของแต่ละสถานการณ์ โดยเฉพาะตัวเลือกที่มีความเสี่ยงแฝง";

  if(justEarnedBadge) showToast(`ได้รับตราความสำเร็จ: ${activeMission.badge}`,"award");

  render(`
    <div class="result-hero">
      <div class="result-icon"><i data-lucide="check-circle" class="icon-lg"></i></div>
      <p class="eyebrow">ภารกิจสำเร็จ</p>
      <h2 class="h2">${esc(activeMission.title)}</h2>
      <div class="result-score">${missionScore}<span style="font-size:20px;color:var(--muted);font-weight:600"> / 30</span></div>
    </div>
    <div class="insight"><b><i data-lucide="check" class="icon-sm"></i>จุดแข็งที่พบ</b><span>${strengths}</span></div>
    <div class="insight"><b><i data-lucide="alert-circle" class="icon-sm"></i>ข้อเสนอแนะ</b><span>${caution}</span></div>
    <div class="insight"><b><i data-lucide="award" class="icon-sm"></i>ตราความสำเร็จ</b><span>${esc(activeMission.badge)}</span></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="${id===5?"overallResult()":`missionIntro(${id+1})`}">${id===5?"ดูรายงานสรุปทั้งหมด":"เข้าสู่ภารกิจถัดไป"} <i data-lucide="arrow-right" class="icon-sm"></i></button>
      <button class="btn btn-secondary" onclick="missionMap()"><i data-lucide="layout-grid" class="icon-sm"></i>แดชบอร์ด</button>
    </div>
  `);
}

function overallResult(){
  const level = state.total>=121 ? "นักปกป้องมืออาชีพ"
             : state.total>=91 ? "นักสืบดิจิทัล"
             : state.total>=51 ? "ผู้พิทักษ์ปลอดภัย"
             : "ผู้เริ่มต้น";

  const rows = missions.map(m=>{
    const score = m.scenarios.reduce((sum,_,i)=> sum + (state.answers[`${m.id}-${i}`]||0), 0);
    return `
      <div class="skill-row">
        <div class="skill-head"><span>${esc(m.title)}</span><span>${score}/30</span></div>
        <div class="progress"><i style="width:${(score/30)*100}%"></i></div>
      </div>`;
  }).join("");

  render(`
    <div class="result-hero">
      <div class="result-icon"><i data-lucide="graduation-cap" class="icon-lg"></i></div>
      <p class="eyebrow">ประเมินผลเสร็จสมบูรณ์</p>
      <h2 class="h2">ยินดีด้วย!</h2>
      <p class="lead">ผลการวิเคราะห์นี้สะท้อนทักษะความปลอดภัยดิจิทัลของคุณ</p>
      <div class="result-score">${state.total}<span style="font-size:20px;color:var(--muted);font-weight:600"> / 150</span></div>
    </div>
    <div class="note"><b><i data-lucide="shield" class="icon-sm"></i>ระดับ: ${level}</b><p>คะแนนนี้สะท้อนความรอบคอบเบื้องต้นในการรับมือสถานการณ์จำลอง</p></div>
    <div class="card pad" style="margin-top:16px">${rows}</div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="profileScreen()"><i data-lucide="bar-chart-2" class="icon-sm"></i>ดูรายงานทักษะ</button>
      <button class="btn btn-secondary" onclick="showBadges()"><i data-lucide="award" class="icon-sm"></i>ตราความสำเร็จ</button>
    </div>
  `);
}

function skillReport(){
  const scores = missions.map(m => m.scenarios.reduce((sum,_,i)=> sum + (state.answers[`${m.id}-${i}`]||0), 0));
  const total = scores.reduce((a,b)=>a+b,0);
  const hasAny = total > 0;
  const max = Math.max(...scores);
  const min = Math.min(...scores);
  const strong = missions[scores.indexOf(max)];
  const improve = missions[scores.indexOf(min)];

  const rows = missions.map((m,i)=>{
    const score = scores[i];
    return `
      <div class="skill-row">
        <div class="skill-head"><span>${esc(m.title)}</span><span>${score}/30</span></div>
        <div class="progress"><i style="width:${(score/30)*100}%"></i></div>
      </div>`;
  }).join("");

  return `
    <div class="card pad">
      <p class="eyebrow">รายงานทักษะ</p>
      <h2 class="h2">สรุปจากการตัดสินใจของคุณ</h2>
      <p class="lead" style="margin-top:4px">อ้างอิงจากการเลือกครั้งแรกในทุกสถานการณ์ที่เล่นแล้ว</p>
      <div class="profile-grid">
        <div class="profile-stat"><b>${total}/150</b><span>คะแนนรวม</span></div>
        <div class="profile-stat"><b>${state.completed.length}/5</b><span>ภารกิจสำเร็จ</span></div>
      </div>
      <div style="margin-top:18px">${rows}</div>
      ${hasAny ? `
      <div class="insight"><b><i data-lucide="trending-up" class="icon-sm"></i>จุดแข็งเด่นชัด</b><span>ด้าน${esc(strong.title)} ได้ ${max}/30 แสดงว่าคุณมีแนวโน้มตัดสินใจด้านนี้ได้ดี</span></div>
      <div class="insight"><b><i data-lucide="target" class="icon-sm"></i>ด้านที่ควรเสริม</b><span>ด้าน${esc(improve.title)} ได้ ${min}/30 ควรกลับไปทบทวนจุดสังเกตของภารกิจนี้</span></div>
      ` : `<div class="note"><b><i data-lucide="info" class="icon-sm"></i>ยังไม่มีข้อมูล</b><p>เริ่มเล่นภารกิจแรกเพื่อดูรายงานทักษะของคุณ</p></div>`}
      <div class="note"><b><i data-lucide="lightbulb" class="icon-sm"></i>หลักการสำคัญ</b><p>หยุด → ตรวจสอบ → ค่อยตัดสินใจ โดยเฉพาะเมื่อพบความเร่งด่วน ลิงก์แปลก หรือการขอข้อมูลส่วนตัว</p></div>
    </div>`;
}

function profileScreen(){
  activeTab = "profile";
  const initials = state.name ? state.name.trim().charAt(0).toUpperCase() : "?";
  render(`
    <div class="card pad">
      <div class="profile-head">
        <div class="avatar-lg">${esc(initials)}</div>
        <div>
          <h2>${esc(state.name || "ผู้เล่น")}</h2>
          <p>${state.total} คะแนน · ${state.completed.length}/5 ภารกิจ</p>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="showBadges()"><i data-lucide="award" class="icon-sm"></i>ตราความสำเร็จ</button>
        <button class="btn btn-danger" onclick="resetGame()"><i data-lucide="rotate-ccw" class="icon-sm"></i>เริ่มใหม่ทั้งหมด</button>
      </div>
    </div>
    <div style="margin-top:14px">${skillReport()}</div>
  `);
}

function showBadges(){
  activeTab = "badges";
  const allBadges = [
    ["shield", "ผู้เริ่มต้น", "เริ่มต้นใช้งานระบบ", true],
    ["shield-check", "ผู้พิทักษ์ปลอดภัย", "ผ่านภารกิจอย่างน้อย 3 ด่าน", state.completed.length>=3],
    ...missions.map(m=>[m.badgeIcon, m.badge, `ผ่าน${m.title}`, state.badges.includes(m.badge)]),
    ["trophy", "นักปกป้องมืออาชีพ", "สำเร็จครบทั้ง 5 ภารกิจ", state.completed.length===5]
  ];
  const unlocked = allBadges.filter(b=>b[3]).length;

  render(`
    <div class="dash-header">
      <div><p class="eyebrow">ตราความสำเร็จ</p><h2 class="h2">คอลเลกชันของคุณ</h2></div>
      <span style="font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap">${unlocked}/${allBadges.length}</span>
    </div>
    <div class="badge-grid">
      ${allBadges.map(b=>`
        <div class="badge ${b[3]?"":"locked"}">
          <i data-lucide="${b[0]}" class="icon-lg" style="margin:0 auto 10px;color:${b[3]?'var(--accent)':'var(--muted)'}"></i>
          <b>${esc(b[1])}</b>
          <small>${b[3] ? esc(b[2]) : "ยังไม่สำเร็จ"}</small>
        </div>`).join("")}
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="${state.completed.length===5?"overallResult()":"missionMap()"}"><i data-lucide="arrow-left" class="icon-sm"></i>${state.completed.length===5?"ดูรายงานสรุป":"กลับแดชบอร์ด"}</button>
    </div>
  `);
}

async function resetGame(){
  if(!confirm("ระบบจะลบประวัติการทำภารกิจและคะแนนทั้งหมด ยืนยันเริ่มใหม่หรือไม่?")) return;
  try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}
  state = defaultState();
  activeMission = null;
  currentQuestion = 0;
  activeTab = "home";
  home();
  showToast("รีเซ็ตข้อมูลเรียบร้อยแล้ว","rotate-ccw");
}

/* ================= INIT ================= */
(async function init(){
  loadingScreen();
  await loadState();
  activeTab = "home";
  home();
})();
</script>
</body>
</html>
