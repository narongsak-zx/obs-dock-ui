<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Dock Control (Pro Upgraded)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { obs: '#2B2B2B', obsDark: '#1E1E1E', obsHover: '#3C3C3C' },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { background-color: #1E1E1E; color: #CCCCCC; overflow-x: hidden; user-select: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1E1E1E; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
        
        .tab-btn.active { background-color: #2B2B2B; color: #4FA8FF; border-bottom: 2px solid #4FA8FF; font-weight: 600; }
        
        /* สไตล์สำหรับ Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #4FA8FF; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4FA8FF; }
        
        /* สไตล์พิเศษสำหรับ Master Switch (เปิด/ปิดจอ) */
        .master-toggle:checked { border-color: #10b981; }
        .master-toggle:checked + .toggle-label { background-color: #10b981; }
        
        /* ปรับแต่ง Select ให้เข้ากับธีม OBS */
        select { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3E%3C/svg%3E"); background-position: right .5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; appearance: none; }
    </style>
</head>
<body class="flex flex-col h-screen text-sm">

    <div class="bg-obs border-b border-[#111] p-3 shadow-md z-10 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-gray-100 text-base leading-tight">Live Photo</h1>
            <span class="text-[10px] text-emerald-400 flex items-center gap-1" id="master-status-text">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> แสดงผลจอ: เปิด
            </span>
        </div>
        
        <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400">ปิด/เปิด จอ</span>
            <div class="relative inline-block w-8 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" id="master-switch" class="master-toggle toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300" style="top: 2px; left: 2px; z-index: 2;" checked/>
                <label for="master-switch" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
            </div>
        </div>
    </div>

    <div class="bg-obsDark border-b border-[#111] p-3 space-y-3">
        <div class="flex justify-between items-center bg-[#222] p-2 rounded border border-[#333]">
            <div class="flex items-center gap-2">
                <div class="relative inline-block w-8 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" id="autoplay-toggle" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300" style="top: 2px; left: 2px; z-index: 2;"/>
                    <label for="autoplay-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
                </div>
                <span class="text-xs text-gray-300 font-semibold">Auto Play</span>
            </div>
            <select id="timer-select" class="bg-obs text-gray-300 text-xs py-1 pl-2 pr-6 rounded border border-[#444] outline-none">
                <option value="5">5 วินาที</option>
                <option value="10" selected>10 วินาที</option>
                <option value="15">15 วินาที</option>
                <option value="30">30 วินาที</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="text-[9px] text-gray-500 uppercase block mb-1">หมวดการเล่น</label>
                <select id="loop-mode" class="w-full bg-[#222] text-gray-300 text-[10px] py-1.5 pl-2 pr-5 rounded border border-[#333] outline-none">
                    <option value="queue">คิวใหม่เท่านั้น</option>
                    <option value="all">วนรูปทั้งหมด</option>
                </select>
            </div>
            <div>
                <label class="text-[9px] text-gray-500 uppercase block mb-1">อนิเมชันเปลี่ยนรูป</label>
                <select id="anim-select" class="w-full bg-[#222] text-gray-300 text-[10px] py-1.5 pl-2 pr-5 rounded border border-[#333] outline-none">
                    <option value="fade">Fade</option>
                    <option value="zoom">Zoom</option>
                    <option value="slide">Slide</option>
                </select>
            </div>
        </div>
    </div>

    <div class="bg-blue-900/20 border-b border-blue-900/50 p-3 hidden" id="now-showing-container">
        <div class="text-[10px] font-bold text-blue-400 mb-1 flex items-center justify-between">
            <span>▶️ กำลังแสดงผลบนจอ</span>
            <button onclick="clearScreen()" class="text-gray-500 hover:text-red-400 px-1 rounded">ล้างหน้าจอ</button>
        </div>
        <div class="flex items-center gap-3">
            <img id="live-img" src="" class="w-12 h-12 object-cover rounded border border-blue-500/50 shadow-lg bg-black">
            <div class="flex-1 overflow-hidden">
                <div id="live-name" class="text-white font-semibold truncate text-sm"></div>
                <div id="live-msg" class="text-gray-400 text-xs truncate"></div>
            </div>
        </div>
    </div>

    <div class="flex bg-obsDark border-b border-[#111]">
        <button onclick="switchTab('queue')" id="tab-queue" class="tab-btn active flex-1 py-2 text-center transition-colors">รอคิว (<span id="queue-count">0</span>)</button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 py-2 text-center text-gray-400 transition-colors">ประวัติ (<span id="history-count">0</span>)</button>
    </div>

    <div class="flex-1 overflow-y-auto bg-obs relative">
        <div id="queue-view" class="block">
            <div id="queue-list" class="flex flex-col">
                <div class="text-center text-gray-500 py-10 text-xs">กำลังโหลดข้อมูล...</div>
            </div>
        </div>

        <div id="history-view" class="hidden">
            <div id="history-list" class="flex flex-col"></div>
        </div>
    </div>

    <div class="bg-obsDark border-t border-[#111] p-2">
        <button onclick="autoCleanUp()" class="w-full py-1.5 bg-obsHover hover:bg-red-900/50 text-gray-400 hover:text-red-400 rounded text-xs transition-colors border border-[#444] hover:border-red-900">
            🗑️ ลบข้อมูลที่เก่าเกิน 24 ชม.
        </button>
    </div>

    <script>
        // 📥 Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
            authDomain: "obs-live-photo.firebaseapp.com",
            projectId: "obs-live-photo",
            storageBucket: "obs-live-photo.firebasestorage.app",
            messagingSenderId: "410755111325",
            appId: "1:410755111325:web:814ca02445f4305267f774"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // State Variables
        let queueData = [];
        let historyData = [];
        let showingData = null;
        let isAutoPlay = false;
        let autoPlayInterval = null;
        let currentLoopIndex = 0;

        const queueList = document.getElementById('queue-list');
        const historyList = document.getElementById('history-list');
        const nowShowingContainer = document.getElementById('now-showing-container');

        // ฟังก์ชันลบข้อมูลเกิน 24 ชม
        function autoCleanUp() {
            const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
            db.collection('photos').where('timestamp', '<', oneDayAgo).get().then(snapshot => {
                let count = 0;
                snapshot.forEach(doc => { doc.ref.delete(); count++; });
                if(count > 0) alert(`ทำความสะอาดข้อมูลเก่าไป ${count} รายการ`);
            });
        }
        autoCleanUp();

        // จัดการเปิด/ปิดจอ และ Animation
        const masterSwitch = document.getElementById('master-switch');
        const animSelect = document.getElementById('anim-select');
        const masterStatusText = document.getElementById('master-status-text');

        masterSwitch.addEventListener('change', (e) => {
            const isVis = e.target.checked;
            masterStatusText.innerHTML = isVis ? '<span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> แสดงผลจอ: เปิด' : '<span class="w-1.5 h-1.5 bg-red-400 rounded-full"></span> แสดงผลจอ: ปิด';
            masterStatusText.className = isVis ? 'text-[10px] text-emerald-400 flex items-center gap-1' : 'text-[10px] text-red-400 flex items-center gap-1';
            db.collection('settings').doc('display').set({ isVisible: isVis }, { merge: true });
        });

        animSelect.addEventListener('change', (e) => {
            db.collection('settings').doc('display').set({ animation: e.target.value }, { merge: true });
        });

        db.collection('settings').doc('display').get().then(doc => {
            if (doc.exists) {
                const data = doc.data();
                if(data.isVisible !== undefined) masterSwitch.checked = data.isVisible;
                if(data.animation) animSelect.value = data.animation;
                masterSwitch.dispatchEvent(new Event('change'));
            } else {
                db.collection('settings').doc('display').set({ isVisible: true, animation: 'fade' });
            }
        });

        // ดึงข้อมูล Realtime
        db.collection('photos').onSnapshot(snapshot => {
            queueData = [];
            historyData = [];
            let latestShowing = null;
            
            snapshot.forEach(doc => {
                const item = { id: doc.id, ...doc.data() };
                if (item.status === 'showing') {
                    if (!latestShowing || item.timestamp > latestShowing.timestamp) latestShowing = item;
                } else if (item.status === 'waiting') {
                    queueData.push(item);
                } else if (item.status === 'shown') {
                    historyData.push(item);
                }
            });

            // อัปเดตกำลังแสดงผล
            showingData = latestShowing;
            if (showingData) {
                document.getElementById('live-img').src = showingData.imageUrl;
                document.getElementById('live-name').innerText = showingData.name;
                document.getElementById('live-msg').innerText = showingData.message;
                nowShowingContainer.classList.remove('hidden');
            } else {
                nowShowingContainer.classList.add('hidden');
            }

            // อัปเดตคิวและประวัติ
            queueData.sort((a, b) => a.timestamp - b.timestamp);
            historyData.sort((a, b) => b.timestamp - a.timestamp);

            document.getElementById('queue-count').innerText = queueData.length;
            document.getElementById('history-count').innerText = historyData.length;

            renderQueue();
            renderHistory();
        });

        function renderQueue() {
            if (queueData.length === 0) {
                queueList.innerHTML = '<div class="text-center text-gray-500 py-10 text-xs">ไม่มีคิวรอแสดง...</div>';
                return;
            }
            queueList.innerHTML = queueData.map(item => {
                const timeStr = new Date(item.timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                return `
                    <div class="flex items-center gap-3 p-3 border-b border-[#333] hover:bg-obsHover group transition-colors">
                        <img src="${item.imageUrl}" class="w-12 h-12 object-cover rounded bg-[#111]">
                        <div class="flex-1 overflow-hidden">
                            <div class="text-gray-200 font-semibold text-sm truncate">${item.name}</div>
                            <div class="text-gray-500 text-[10px]">${timeStr}</div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <button onclick="pushToLive('${item.id}')" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] px-2 py-1 rounded transition-colors">ขึ้นจอ</button>
                            <button onclick="rejectPhoto('${item.id}')" class="bg-transparent hover:bg-red-500/20 text-gray-500 hover:text-red-400 border border-transparent hover:border-red-500/50 text-[10px] px-2 py-0.5 rounded transition-colors">ลบ</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderHistory() {
            if (historyData.length === 0) {
                historyList.innerHTML = '<div class="text-center text-gray-500 py-10 text-xs">ยังไม่มีประวัติการแสดงผล</div>';
                return;
            }
            historyList.innerHTML = historyData.slice(0, 30).map(item => `
                <div class="flex items-center gap-3 p-2.5 border-b border-[#333] opacity-70 hover:opacity-100 hover:bg-obsHover transition-all">
                    <img src="${item.imageUrl}" class="w-10 h-10 object-cover rounded grayscale hover:grayscale-0">
                    <div class="flex-1 overflow-hidden">
                        <div class="text-gray-300 text-xs truncate">${item.name}</div>
                    </div>
                    <button onclick="pushToLive('${item.id}')" class="text-[10px] px-2 py-1 bg-obsHover hover:bg-[#444] rounded text-gray-300 border border-[#444] transition-colors">โชว์ซ้ำ</button>
                </div>
            `).join('');
        }

        async function pushToLive(docId) {
            try {
                if (showingData) await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
                await db.collection('photos').doc(docId).update({ status: 'showing' });
            } catch (err) { console.error(err); }
        }

        async function rejectPhoto(docId) {
            if(confirm("ต้องการลบรูปนี้ทิ้งใช่ไหม?")) await db.collection('photos').doc(docId).delete();
        }

        async function clearScreen() {
            if(showingData) await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
        }

        // --- ระบบ Auto Play & Loop ---
        const autoplayToggle = document.getElementById('autoplay-toggle');
        const timerSelect = document.getElementById('timer-select');
        const loopMode = document.getElementById('loop-mode');

        function manageAutoPlay() {
            clearInterval(autoPlayInterval);
            
            if (autoplayToggle.checked) {
                const intervalMs = parseInt(timerSelect.value) * 1000;
                
                autoPlayInterval = setInterval(() => {
                    const mode = loopMode.value;
                    
                    if (mode === 'queue' && queueData.length > 0) {
                        pushToLive(queueData[0].id);
                    } 
                    else if (mode === 'all') {
                        let allPhotos = [...queueData, ...historyData];
                        if (showingData) allPhotos.push(showingData);
                        
                        allPhotos.sort((a, b) => a.timestamp - b.timestamp); // วนตามเวลา
                        
                        if (allPhotos.length > 0) {
                            currentLoopIndex = (currentLoopIndex + 1) % allPhotos.length;
                            pushToLive(allPhotos[currentLoopIndex].id);
                        }
                    }
                }, intervalMs);
            }
        }

        autoplayToggle.addEventListener('change', manageAutoPlay);
        timerSelect.addEventListener('change', manageAutoPlay);
        loopMode.addEventListener('change', manageAutoPlay);

        // ฟังก์ชันสลับ Tab
        function switchTab(tab) {
            document.getElementById('tab-queue').classList.toggle('active', tab === 'queue');
            document.getElementById('tab-queue').classList.toggle('text-gray-400', tab !== 'queue');
            document.getElementById('tab-history').classList.toggle('active', tab === 'history');
            document.getElementById('tab-history').classList.toggle('text-gray-400', tab !== 'history');
            
            document.getElementById('queue-view').classList.toggle('hidden', tab !== 'queue');
            document.getElementById('history-view').classList.toggle('hidden', tab !== 'history');
        }
    </script>
</body>
</html>
