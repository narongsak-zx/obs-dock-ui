<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Dock Control</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { obs: '#2B2B2B', obsDark: '#1E1E1E', obsHover: '#3C3C3C' },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { background-color: #1E1E1E; color: #CCCCCC; overflow-x: hidden; user-select: none; }
        /* ปรับ Scrollbar ให้เล็กและเนียนตาแบบ OBS */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1E1E1E; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
        
        .tab-btn.active { background-color: #2B2B2B; color: #4FA8FF; border-bottom: 2px solid #4FA8FF; font-weight: 600; }
        .toggle-checkbox:checked { right: 0; border-color: #4FA8FF; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4FA8FF; }
    </style>
</head>
<body class="flex flex-col h-screen text-sm">

    <div class="bg-obs border-b border-[#111] p-3 shadow-md z-10 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-gray-100 text-base leading-tight">Live Photo</h1>
            <span class="text-[10px] text-emerald-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Online
            </span>
        </div>
        
        <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400" id="autoplay-text">Auto (10s)</span>
            <div class="relative inline-block w-8 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" name="toggle" id="autoplay-toggle" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300" style="top: 2px; left: 2px; z-index: 2;"/>
                <label for="autoplay-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
            </div>
        </div>
    </div>

    <div class="bg-blue-900/20 border-b border-blue-900/50 p-3 hidden" id="now-showing-container">
        <div class="text-[10px] font-bold text-blue-400 mb-1 flex items-center justify-between">
            <span>▶️ กำลังแสดงผลบนจอ</span>
            <button onclick="clearScreen()" class="text-gray-500 hover:text-red-400 px-1 rounded">ล้างหน้าจอ</button>
        </div>
        <div class="flex items-center gap-3">
            <img id="live-img" src="" class="w-12 h-12 object-cover rounded border border-blue-500/50 shadow-lg">
            <div class="flex-1 overflow-hidden">
                <div id="live-name" class="text-white font-semibold truncate text-sm"></div>
                <div id="live-msg" class="text-gray-400 text-xs truncate"></div>
            </div>
        </div>
    </div>

    <div class="flex bg-obsDark border-b border-[#111]">
        <button onclick="switchTab('queue')" id="tab-queue" class="tab-btn active flex-1 py-2 text-center transition-colors">รอคิว (<span id="queue-count">0</span>)</button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 py-2 text-center text-gray-400 transition-colors">ประวัติ</button>
    </div>

    <div class="flex-1 overflow-y-auto bg-obs relative">
        
        <div id="queue-view" class="block">
            <div id="queue-list" class="flex flex-col">
                <div class="text-center text-gray-500 py-10 text-xs">กำลังโหลดข้อมูล...</div>
            </div>
        </div>

        <div id="history-view" class="hidden">
            <div id="history-list" class="flex flex-col"></div>
        </div>

    </div>

    <div class="bg-obsDark border-t border-[#111] p-2">
        <button onclick="autoCleanUp()" class="w-full py-1.5 bg-obsHover hover:bg-red-900/50 text-gray-400 hover:text-red-400 rounded text-xs transition-colors border border-[#444] hover:border-red-900">
            🗑️ ลบข้อมูลที่เก่าเกิน 24 ชม.
        </button>
    </div>

    <script>
        // 📥 นำเอา firebaseConfig มาใส่ตรงนี้
        const firebaseConfig = {
  apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
  authDomain: "obs-live-photo.firebaseapp.com",
  projectId: "obs-live-photo",
  storageBucket: "obs-live-photo.firebasestorage.app",
  messagingSenderId: "410755111325",
  appId: "1:410755111325:web:814ca02445f4305267f774"
};

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // ตัวแปรเก็บสถานะ (State)
        let queueData = [];
        let showingData = null;
        let isAutoPlay = false;
        let autoPlayInterval = null;

        const queueList = document.getElementById('queue-list');
        const historyList = document.getElementById('history-list');
        const nowShowingContainer = document.getElementById('now-showing-container');

        // ฟังก์ชันลบข้อมูลเกิน 24 ชม
        function autoCleanUp() {
            const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
            db.collection('photos').where('timestamp', '<', oneDayAgo).get().then(snapshot => {
                let count = 0;
                snapshot.forEach(doc => { doc.ref.delete(); count++; });
                if(count > 0) alert(`ทำความสะอาดข้อมูลเก่าไป ${count} รายการ`);
            });
        }
        autoCleanUp(); // รัน 1 ครั้งตอนเปิดหน้า

        // ดึงข้อมูล "กำลังแสดง" (Showing)
        db.collection('photos').where('status', '==', 'showing').onSnapshot(snapshot => {
            if (snapshot.empty) {
                showingData = null;
                nowShowingContainer.classList.add('hidden');
                return;
            }
            
            // หาตัวใหม่สุดเผื่อมีบัคซ้อนกัน
            let latest = null;
            snapshot.forEach(doc => {
                const data = doc.data();
                if (!latest || data.timestamp > latest.timestamp) latest = { id: doc.id, ...data };
            });

            showingData = latest;
            document.getElementById('live-img').src = latest.imageUrl;
            document.getElementById('live-name').innerText = latest.name;
            document.getElementById('live-msg').innerText = latest.message;
            nowShowingContainer.classList.remove('hidden');
        });

        // ดึงข้อมูล "รอคิว" (Waiting)
        db.collection('photos').where('status', '==', 'waiting').onSnapshot(snapshot => {
            queueData = [];
            snapshot.forEach(doc => queueData.push({ id: doc.id, ...doc.data() }));
            
            // เรียงจากเก่าไปใหม่
            queueData.sort((a, b) => a.timestamp - b.timestamp);
            document.getElementById('queue-count').innerText = queueData.length;

            if (queueData.length === 0) {
                queueList.innerHTML = '<div class="text-center text-gray-500 py-10 text-xs">ไม่มีคิวรอแสดง...</div>';
                return;
            }

            queueList.innerHTML = '';
            queueData.forEach(item => {
                const timeStr = new Date(item.timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                queueList.innerHTML += `
                    <div class="flex items-center gap-3 p-3 border-b border-[#333] hover:bg-obsHover group">
                        <img src="${item.imageUrl}" class="w-14 h-14 object-cover rounded bg-[#111]">
                        <div class="flex-1 overflow-hidden">
                            <div class="text-gray-200 font-semibold text-sm truncate">${item.name}</div>
                            <div class="text-gray-500 text-[10px]">${timeStr}</div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <button onclick="pushToLive('${item.id}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2 py-1 rounded transition-colors">ขึ้นจอ</button>
                            <button onclick="rejectPhoto('${item.id}')" class="bg-transparent hover:bg-red-500/20 text-gray-500 hover:text-red-400 border border-transparent hover:border-red-500/50 text-xs px-2 py-0.5 rounded transition-colors">ลบ</button>
                        </div>
                    </div>
                `;
            });
        });

        // ดึงข้อมูล "ประวัติ" (Shown) - จำกัดแค่ 20 รูปล่าสุดเพื่อไม่ให้หน่วง
        db.collection('photos').where('status', '==', 'shown').onSnapshot(snapshot => {
            let historyData = [];
            snapshot.forEach(doc => historyData.push({ id: doc.id, ...doc.data() }));
            historyData.sort((a, b) => b.timestamp - a.timestamp); // เรียงใหม่ไปเก่า

            if (historyData.length === 0) {
                historyList.innerHTML = '<div class="text-center text-gray-500 py-10 text-xs">ยังไม่มีประวัติการแสดงผล</div>';
                return;
            }

            historyList.innerHTML = '';
            historyData.slice(0, 20).forEach(item => {
                historyList.innerHTML += `
                    <div class="flex items-center gap-3 p-3 border-b border-[#333] opacity-60 hover:opacity-100 transition-opacity">
                        <img src="${item.imageUrl}" class="w-10 h-10 object-cover rounded grayscale">
                        <div class="flex-1 overflow-hidden">
                            <div class="text-gray-300 text-xs truncate">${item.name}</div>
                        </div>
                        <button onclick="pushToLive('${item.id}')" class="text-[10px] px-2 py-1 bg-obsHover hover:bg-[#444] rounded text-gray-300 border border-[#444]">แสดงอีกครั้ง</button>
                    </div>
                `;
            });
        });

        // ฟังก์ชันสั่งขึ้นจอ
        async function pushToLive(docId) {
            try {
                // ถ้ามีตัวแสดงอยู่ ให้เปลี่ยนเป็น shown ก่อน
                if (showingData) await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
                // ดันตัวใหม่ขึ้น showing
                await db.collection('photos').doc(docId).update({ status: 'showing' });
            } catch (err) { console.error(err); }
        }

        // ฟังก์ชันลบรูป (ถ้าคนส่งรูปแปลกๆ มา)
        async function rejectPhoto(docId) {
            if(confirm("ต้องการลบรูปนี้ทิ้งใช่ไหม?")) {
                await db.collection('photos').doc(docId).delete();
            }
        }

        // ฟังก์ชันล้างหน้าจอ (ซ่อนรูปทั้งหมด)
        async function clearScreen() {
            if(showingData) {
                await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
            }
        }

        // ระบบ Auto Play
        const toggleBtn = document.getElementById('autoplay-toggle');
        const toggleText = document.getElementById('autoplay-text');

        toggleBtn.addEventListener('change', (e) => {
            isAutoPlay = e.target.checked;
            if (isAutoPlay) {
                toggleText.classList.replace('text-gray-400', 'text-blue-400');
                // ตั้งเวลาดึงคิวที่เก่าที่สุด (ตัวแรกใน Array) ขึ้นจอ ทุกๆ 10 วินาที
                autoPlayInterval = setInterval(() => {
                    if (queueData.length > 0) {
                        pushToLive(queueData[0].id);
                    }
                }, 10000); 
            } else {
                toggleText.classList.replace('text-blue-400', 'text-gray-400');
                clearInterval(autoPlayInterval);
            }
        });

        // ฟังก์ชันสลับ Tab
        function switchTab(tab) {
            document.getElementById('tab-queue').classList.toggle('active', tab === 'queue');
            document.getElementById('tab-queue').classList.toggle('text-gray-400', tab !== 'queue');
            document.getElementById('tab-history').classList.toggle('active', tab === 'history');
            document.getElementById('tab-history').classList.toggle('text-gray-400', tab !== 'history');
            
            document.getElementById('queue-view').classList.toggle('hidden', tab !== 'queue');
            document.getElementById('history-view').classList.toggle('hidden', tab !== 'history');
        }
    </script>
</body>
</html>
