<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Event Dashboard (Real Data)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: white; margin: 0; overflow: hidden; }
        .canvas-bg { background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px; }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 📥 1. ใส่ Firebase Config ของคุณตรงนี้
        const firebaseConfig = {
  apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
  authDomain: "obs-live-photo.firebaseapp.com",
  projectId: "obs-live-photo",
  storageBucket: "obs-live-photo.firebasestorage.app",
  messagingSenderId: "410755111325",
  appId: "1:410755111325:web:814ca02445f4305267f774"
};

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        function App() {
            const [activeMenu, setActiveMenu] = useState('🕒 คิวรอแสดง');
            const [photos, setPhotos] = useState([]);
            const [showingPhoto, setShowingPhoto] = useState(null);
            const [previewPhoto, setPreviewPhoto] = useState(null); // รูปที่กดเลือกมาดูบน Canvas

            // ดึงข้อมูลทั้งหมดจาก Firebase แบบ Real-time
            useEffect(() => {
                const unsubscribe = db.collection('photos')
                    .orderBy('timestamp', 'asc')
                    .onSnapshot(snapshot => {
                        const fetchedPhotos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setPhotos(fetchedPhotos);
                        
                        // หาตัวที่กำลังแสดงอยู่
                        const currentlyShowing = fetchedPhotos.find(p => p.status === 'showing');
                        setShowingPhoto(currentlyShowing || null);
                        
                        // ถ้าไม่มีการพรีวิวรูปอื่น ให้แสดงรูปที่กำลังโชว์อยู่บน Canvas
                        if (!previewPhoto && currentlyShowing) {
                            setPreviewPhoto(currentlyShowing);
                        }
                    });
                return () => unsubscribe();
            }, []);

            // ตัวกรองข้อมูลตามสถานะ
            const waitingQueue = photos.filter(p => p.status === 'waiting');
            const historyQueue = photos.filter(p => p.status === 'shown' || p.status === 'rejected');
            const stats = {
                total: photos.length,
                waiting: waitingQueue.length,
                showing: showingPhoto ? 1 : 0,
                shown: photos.filter(p => p.status === 'shown').length
            };

            // ฟังก์ชันดันรูปขึ้นจอ (อัปเดต Firebase)
            const pushToLive = async (photo) => {
                if (!photo) return;
                
                try {
                    // 1. เปลี่ยนตัวที่แสดงอยู่ปัจจุบันให้กลายเป็น 'shown'
                    if (showingPhoto) {
                        await db.collection('photos').doc(showingPhoto.id).update({ status: 'shown' });
                    }
                    // 2. เปลี่ยนตัวที่เลือกให้กลายเป็น 'showing'
                    await db.collection('photos').doc(photo.id).update({ status: 'showing' });
                    
                    alert(`ส่งรูปของ ${photo.name} ขึ้นจอเรียบร้อย!`);
                } catch (error) {
                    console.error(error);
                    alert("เกิดข้อผิดพลาดในการอัปเดตฐานข้อมูล");
                }
            };

            // ฟังก์ชันปฏิเสธรูป
            const rejectPhoto = async (photoId) => {
                if(confirm("แน่ใจหรือไม่ที่จะลบ/ปฏิเสธรูปนี้?")) {
                    await db.collection('photos').doc(photoId).update({ status: 'rejected' });
                    if(previewPhoto && previewPhoto.id === photoId) setPreviewPhoto(null);
                }
            };

            const formatTime = (ts) => {
                if(!ts) return '';
                // รองรับทั้ง Timestamp แบบตัวเลข และแบบ Firebase Object
                const date = typeof ts === 'number' ? new Date(ts) : ts.toDate();
                return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            };

            return (
                <div className="flex h-screen w-full">
                    {/* Sidebar */}
                    <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl">
                        <div className="p-5 border-b border-slate-800">
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">QR Live Display</h1>
                            <div className="mt-3 text-xs space-y-2">
                                <div className="flex items-center text-emerald-400"><span className="w-2 h-2 bg-emerald-400 rounded-full mr-2 shadow-[0_0_8px_#34d399]"></span> Database Connected</div>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {['🏠 Dashboard', '🕒 คิวรอแสดง', '▶️ กำลังแสดง', '✅ ประวัติ (แสดงแล้ว)', '⚙️ ตั้งค่า'].map(menu => (
                                <div 
                                    key={menu} 
                                    onClick={() => setActiveMenu(menu)}
                                    className={`p-3 rounded-lg cursor-pointer transition-all duration-200 font-medium ${activeMenu === menu ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {menu}
                                </div>
                            ))}
                        </nav>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col overflow-hidden bg-slate-950">
                        
                        {/* Stats Header */}
                        <div className="grid grid-cols-4 gap-4 p-5 border-b border-slate-800 bg-slate-900/80 backdrop-blur-sm">
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                <div className="text-slate-400 text-sm font-medium">จำนวนรูปวันนี้</div>
                                <div className="text-3xl font-bold text-white mt-1">{stats.total}</div>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                <div className="text-amber-400 text-sm font-medium">รอคิว</div>
                                <div className="text-3xl font-bold text-amber-400 mt-1">{stats.waiting}</div>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-emerald-500/10 rounded-full blur-2xl"></div>
                                <div className="text-emerald-400 text-sm font-medium">กำลังแสดง</div>
                                <div className="text-3xl font-bold text-emerald-400 mt-1">{stats.showing}</div>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                <div className="text-blue-400 text-sm font-medium">แสดงแล้ว</div>
                                <div className="text-3xl font-bold text-blue-400 mt-1">{stats.shown}</div>
                            </div>
                        </div>

                        {/* Middle: Canvas & List */}
                        <div className="flex-1 flex overflow-hidden">
                            
                            {/* Left: Canvas Area */}
                            <div className="flex-[2] flex flex-col p-5 border-r border-slate-800">
                                <h3 className="font-semibold text-slate-300 mb-4 flex justify-between items-center">
                                    <span>Live Canvas (Preview LED)</span>
                                    {previewPhoto && previewPhoto.status !== 'showing' && (
                                        <button 
                                            onClick={() => pushToLive(previewPhoto)}
                                            className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg shadow-lg shadow-emerald-900/20 transition-all">
                                            🚀 ส่งขึ้นจอ OBS ทันที
                                        </button>
                                    )}
                                </h3>
                                
                                <div className="flex-1 canvas-bg flex items-center justify-center rounded-xl border border-slate-800 relative overflow-hidden">
                                    {previewPhoto ? (
                                        <div className="aspect-video w-full max-w-3xl bg-black border border-slate-700 shadow-2xl flex relative overflow-hidden ring-4 ring-black/50">
                                            <div className="w-[70%] h-full relative">
                                                <img src={previewPhoto.imageUrl} className="w-full h-full object-cover" />
                                                <div className="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black via-black/80 to-transparent">
                                                    <h2 className="text-4xl font-bold text-white drop-shadow-lg">{previewPhoto.name}</h2>
                                                    <p className="text-xl text-slate-300 mt-2">{previewPhoto.message}</p>
                                                </div>
                                            </div>
                                            <div className="w-[30%] h-full bg-white flex flex-col items-center justify-center">
                                                <div className="text-center text-blue-900 font-bold text-xl mb-4">สแกนส่งรูป</div>
                                                <div className="w-40 h-40 bg-gray-100 border-8 border-gray-100 rounded-xl shadow-sm flex items-center justify-center">
                                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://your-website.com" className="w-full h-full" />
                                                </div>
                                            </div>
                                            {/* Badge บอกสถานะบน Canvas */}
                                            {previewPhoto.status === 'showing' && (
                                                <div className="absolute top-4 left-4 px-3 py-1 bg-emerald-500 text-white text-sm font-bold rounded-full flex items-center gap-2 shadow-lg">
                                                    <span className="w-2 h-2 bg-white rounded-full animate-pulse"></span> กำลังแสดงบนจอ
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="text-slate-500 flex flex-col items-center">
                                            <span className="text-4xl mb-2">📸</span>
                                            <p>คลิกเลือกรูปจากรายการด้านขวาเพื่อพรีวิว</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Right: Dynamic List based on Active Menu */}
                            <div className="flex-1 bg-slate-900/50 flex flex-col p-5">
                                <h3 className="font-semibold text-white mb-4 border-b border-slate-800 pb-2">{activeMenu}</h3>
                                
                                <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                                    {activeMenu === '🕒 คิวรอแสดง' && waitingQueue.length === 0 && <p className="text-slate-500 text-center mt-10">ไม่มีคิวรอแสดง</p>}
                                    {activeMenu === '🕒 คิวรอแสดง' && waitingQueue.map(item => (
                                        <div key={item.id} 
                                            onClick={() => setPreviewPhoto(item)}
                                            className={`bg-slate-800 p-3 rounded-xl border cursor-pointer transition-all ${previewPhoto?.id === item.id ? 'border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.3)]' : 'border-slate-700 hover:border-slate-500'}`}>
                                            <div className="flex gap-4">
                                                <img src={item.imageUrl} className="w-20 h-20 rounded-lg object-cover bg-slate-900" />
                                                <div className="flex-1 flex flex-col justify-center">
                                                    <div className="font-bold text-white text-lg">{item.name}</div>
                                                    <div className="text-sm text-slate-400 mt-1">เวลา: {formatTime(item.timestamp)}</div>
                                                </div>
                                                <div className="flex flex-col gap-2 justify-center">
                                                    <button onClick={(e) => { e.stopPropagation(); pushToLive(item); }} className="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-xs text-white rounded">แสดง</button>
                                                    <button onClick={(e) => { e.stopPropagation(); rejectPhoto(item.id); }} className="px-3 py-1 bg-red-900/50 hover:bg-red-500 text-xs text-red-200 rounded">ลบ</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}

                                    {activeMenu === '✅ ประวัติ (แสดงแล้ว)' && historyQueue.map(item => (
                                        <div key={item.id} 
                                            onClick={() => setPreviewPhoto(item)}
                                            className="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 flex gap-4 cursor-pointer hover:bg-slate-800 opacity-70 hover:opacity-100 transition-opacity">
                                            <img src={item.imageUrl} className="w-16 h-16 rounded-lg object-cover grayscale" />
                                            <div className="flex-1">
                                                <div className="font-bold text-slate-300">{item.name}</div>
                                                <div className="text-xs text-slate-500">สถานะ: {item.status === 'shown' ? 'แสดงแล้ว' : 'ปฏิเสธ'}</div>
                                            </div>
                                        </div>
                                    ))}
                                    
                                    {activeMenu !== '🕒 คิวรอแสดง' && activeMenu !== '✅ ประวัติ (แสดงแล้ว)' && (
                                        <div className="text-slate-500 text-center mt-10 p-5 bg-slate-800/30 rounded-xl border border-slate-800 border-dashed">
                                            เมนู {activeMenu} ยังไม่เปิดใช้งานในเวอร์ชัน MVP
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
