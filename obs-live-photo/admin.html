<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Photo Dock</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#17161A',
                        bgPanel: '#211F26',
                        bgItem: '#2A2830',
                        bgRaised: '#332F3B',
                        borderDim: '#0E0D10',
                        line: '#38343F',
                        accent: '#8B7CF6',
                        accentDim: '#5B4FB0',
                        flash: '#FFB020',
                        ok: '#34D399',
                        warn: '#FBBF24',
                        danger: '#F76E6E'
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #17161A; color: #E9E7EF; overflow-x: hidden; user-select: none; font-size: 12px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Toggle switch */
        .switch { position: relative; display: inline-block; width: 32px; height: 18px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #454249; transition: .2s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: #8B7CF6; }
        input:checked + .slider:before { transform: translateX(14px); }
        .master-toggle:checked + .slider { background-color: #34D399; }

        /* Film-strip progress */
        .filmstrip { display: flex; gap: 2px; height: 10px; padding: 2px 4px; background: #0E0D10; border-radius: 3px; }
        .sprocket { flex: 1; border-radius: 1px; background-color: #322F38; transition: background-color .15s linear; position: relative; }
        .sprocket.filled { background-color: #FFB020; }

        .tab-btn { border-bottom: 2px solid transparent; transition: all .15s; position: relative; }
        .tab-active { border-bottom: 2px solid #8B7CF6; color: #C9C1FF; font-weight: 600; background-color: #211F26; }

        select { background-image: none; text-align: center; }

        .drawer { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
        .drawer.open { max-height: 260px; }

        .chip { transition: all .15s; }
        .chip:active { transform: scale(0.92); }

        .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .dot-online { background: #34D399; box-shadow: 0 0 6px #34D399aa; }
        .dot-offline { background: #F76E6E; box-shadow: 0 0 6px #F76E6Eaa; }
        .dot-connecting { background: #FBBF24; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

        /* Pending badge on tab */
        .ping-badge { position: absolute; top: 3px; right: 8px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: #FFB020; color: #17161A; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .ping-dot { position: absolute; top: 3px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #FFB020; animation: pulse 1.2s infinite; }

        /* Alert banner for new pending submissions */
        #pending-banner { display: none; }
        #pending-banner.show { display: flex; }

        /* Toast */
        #toast-container { position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 100; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
        .toast { pointer-events: auto; font-size: 11px; padding: 8px 10px; border-radius: 8px; background: #2A2830; border: 1px solid #38343F; box-shadow: 0 4px 12px rgba(0,0,0,.4); display: flex; align-items: center; gap: 6px; animation: toast-in .18s ease; }
        @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .toast.success { border-color: #34D39955; }
        .toast.error { border-color: #F76E6E55; }

        /* Modal */
        #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 90; display: none; align-items: center; justify-content: center; padding: 16px; }
        #modal-backdrop.open { display: flex; }
        .modal-box { background: #211F26; border: 1px solid #38343F; border-radius: 12px; padding: 16px; width: 100%; max-width: 260px; }

        .skeleton { background: linear-gradient(90deg, #2A2830 25%, #332F3B 37%, #2A2830 63%); background-size: 400% 100%; animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        img.thumb { background: #0E0D10 repeating-conic-gradient(#141318 0% 25%, transparent 0% 50%) 50% / 8px 8px; }

        .approve-btn { background: #1F3B31; border: 1px solid #2F6650; color: #6EE7B7; }
        .approve-btn:active { background: #256345; }
        .reject-btn { background: #3B2323; border: 1px solid #7A3838; color: #FCA5A5; }
        .reject-btn:active { background: #5A2A2A; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- ===== Header ===== -->
    <div class="bg-bgPanel border-b border-borderDim px-3 py-2 flex justify-between items-center shadow-md z-20 shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-camera-retro text-accent text-sm"></i>
            <h1 class="font-bold text-white text-xs leading-none">Live Photo</h1>
            <span class="flex items-center gap-1 ml-1" title="สถานะการเชื่อมต่อ">
                <span id="status-dot" class="dot dot-connecting"></span>
                <span id="status-text" class="text-[9px] text-gray-500">กำลังเชื่อมต่อ</span>
            </span>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="toggleDrawer()" id="settings-btn" class="w-7 h-7 rounded-md bg-bgItem hover:bg-bgRaised border border-line text-gray-300 hover:text-white flex items-center justify-center transition-colors" title="ตั้งค่า">
                <i class="fa-solid fa-sliders text-[11px]"></i>
            </button>
            <div class="w-px h-5 bg-line mx-0.5"></div>
            <span id="master-status" class="text-[10px] text-emerald-400 mono">ON</span>
            <label class="switch" title="เปิด/ปิดการแสดงผลบนจอ">
                <input type="checkbox" id="master-switch" class="master-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- ===== New submission alert banner ===== -->
    <div id="pending-banner" onclick="switchTab('pending')" class="items-center gap-2 bg-flash/10 border-b border-flash/40 px-3 py-2 shrink-0 cursor-pointer hover:bg-flash/15 transition-colors">
        <span class="w-1.5 h-1.5 rounded-full bg-flash animate-pulse shrink-0"></span>
        <span class="text-[11px] text-flash font-medium flex-1">มีรูปใหม่รออนุมัติ <span id="pending-banner-count" class="mono font-bold">0</span> รายการ</span>
        <i class="fa-solid fa-chevron-right text-[10px] text-flash"></i>
    </div>

    <!-- ===== Settings drawer ===== -->
    <div id="settings-drawer" class="drawer bg-bgMain border-b border-borderDim shrink-0">
        <div class="p-2.5 space-y-2">
            <div class="bg-bgPanel p-2 rounded-lg border border-line flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <label class="switch"><input type="checkbox" id="autoplay-switch"><span class="slider"></span></label>
                    <span class="font-medium text-xs">เล่นอัตโนมัติ</span>
                </div>
                <select id="timer-select" class="bg-bgItem border border-line rounded px-2 py-0.5 text-xs outline-none focus:border-accent">
                    <option value="5">5 วิ</option><option value="10" selected>10 วิ</option><option value="15">15 วิ</option><option value="20">20 วิ</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <select id="loop-mode" class="bg-bgPanel border border-line rounded px-1 py-1.5 text-[10px] outline-none text-gray-300">
                    <option value="queue">วนเฉพาะคิวใหม่</option>
                    <option value="all">วนรูปทั้งหมด</option>
                </select>
                <select id="anim-select" class="bg-bgPanel border border-line rounded px-1 py-1.5 text-[10px] outline-none text-gray-300">
                    <option value="fade">Fade</option>
                    <option value="zoom">Zoom</option>
                    <option value="slide">Slide</option>
                </select>
            </div>

            <div class="bg-bgPanel p-2 rounded-lg border border-line flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <label class="switch"><input type="checkbox" id="sound-switch"><span class="slider"></span></label>
                    <span class="font-medium text-xs">เสียงแจ้งเตือนรูปใหม่รออนุมัติ</span>
                </div>
                <i class="fa-solid fa-volume-high text-gray-500 text-[11px]"></i>
            </div>

            <button onclick="confirmCleanup()" class="w-full text-[10px] text-gray-400 hover:text-red-400 border border-line hover:border-red-900/50 rounded-lg py-1.5 transition-colors">
                <i class="fa-solid fa-broom"></i> ล้างข้อมูลเก่าเกิน 24 ชม. (ไม่รวมรูปที่รออนุมัติ)
            </button>
        </div>
    </div>

    <!-- ===== Now showing ===== -->
    <div class="bg-bgPanel border-b border-borderDim p-2 shrink-0 hidden" id="now-showing-container">
        <div class="flex justify-between items-center mb-1.5">
            <span class="text-[10px] font-bold text-flash flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-flash animate-pulse"></span> กำลังแสดงผล
            </span>
            <span class="text-[11px] font-bold text-flash mono" id="countdown-text">--</span>
        </div>

        <div class="flex gap-2 items-center bg-bgItem p-1.5 rounded-lg border border-line">
            <img id="live-img" src="" class="thumb w-14 h-10 object-cover rounded shrink-0" onerror="this.classList.add('opacity-30')">
            <div class="flex-1 overflow-hidden">
                <div id="live-name" class="font-bold text-white text-xs truncate">...</div>
                <div id="live-msg" class="text-[9px] text-gray-400 truncate">...</div>
            </div>
            <button onclick="skipPrev()" class="w-6 h-6 rounded-md bg-bgMain hover:bg-bgRaised text-gray-400 hover:text-white border border-line transition-colors" title="ย้อนกลับรูปก่อนหน้า">
                <i class="fa-solid fa-backward-step text-[10px]"></i>
            </button>
            <button onclick="skipNext()" class="w-6 h-6 rounded-md bg-bgMain hover:bg-bgRaised text-gray-400 hover:text-white border border-line transition-colors" title="ข้ามไปรูปถัดไป">
                <i class="fa-solid fa-forward-step text-[10px]"></i>
            </button>
            <button onclick="clearScreen()" class="w-6 h-6 rounded-md bg-bgMain hover:bg-red-900/50 text-gray-400 hover:text-red-400 border border-line transition-colors" title="ล้างหน้าจอ">
                <i class="fa-solid fa-xmark text-[10px]"></i>
            </button>
        </div>

        <div class="flex items-center gap-1.5 mt-1.5">
            <div class="filmstrip flex-1" id="progress-bar"></div>
        </div>
        <div class="flex items-center gap-1.5 mt-1.5 text-[9px] text-gray-500" id="next-up-row">
            <span>ถัดไป:</span>
            <img id="next-up-img" src="" class="thumb w-4 h-4 object-cover rounded-sm">
            <span id="next-up-name" class="truncate flex-1">-</span>
        </div>
    </div>

    <!-- ===== Search ===== -->
    <div class="bg-bgMain border-b border-borderDim p-2 shrink-0">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-500 text-[10px]"></i>
            <input id="search-input" type="text" placeholder="ค้นหาชื่อหรือข้อความ..." oninput="renderAll()"
                class="w-full bg-bgPanel border border-line rounded-lg pl-7 pr-7 py-1.5 text-[11px] outline-none focus:border-accent placeholder-gray-600">
            <button id="search-clear" onclick="clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                <i class="fa-solid fa-circle-xmark text-[11px]"></i>
            </button>
        </div>
    </div>

    <!-- ===== Tabs ===== -->
    <div class="flex bg-bgMain border-b border-borderDim shrink-0">
        <button onclick="switchTab('pending')" id="tab-pending" class="tab-btn flex-1 py-2 text-center text-gray-400 hover:bg-bgPanel">
            รออนุมัติ (<span id="pending-count">0</span>)
            <span id="pending-ping" class="ping-dot hidden"></span>
        </button>
        <button onclick="switchTab('queue')" id="tab-queue" class="tab-btn flex-1 py-2 text-center text-gray-400 hover:bg-bgPanel">
            คิว (<span id="queue-count">0</span>) <span id="queue-hidden-badge" class="text-warn hidden"></span>
        </button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 py-2 text-center text-gray-400 hover:bg-bgPanel">ประวัติ (<span id="history-count">0</span>)</button>
    </div>

    <!-- ===== Bulk actions (queue tab only) ===== -->
    <div id="bulk-actions" class="hidden flex gap-1.5 px-1.5 pt-1.5 shrink-0 bg-bgMain">
        <button onclick="confirmClearQueue()" class="flex-1 text-[9.5px] text-gray-400 hover:text-red-400 bg-bgPanel border border-line rounded-md py-1 transition-colors">
            <i class="fa-solid fa-trash-can"></i> ล้างคิวทั้งหมด
        </button>
        <button onclick="unlockAll()" class="flex-1 text-[9.5px] text-gray-400 hover:text-white bg-bgPanel border border-line rounded-md py-1 transition-colors">
            <i class="fa-solid fa-lock-open"></i> ปลดล็อกทั้งหมด
        </button>
    </div>

    <!-- ===== Lists ===== -->
    <div class="flex-1 overflow-y-auto bg-bgMain p-1.5 relative">
        <div id="loading-state" class="space-y-1.5">
            <div class="skeleton h-16 rounded-lg"></div>
            <div class="skeleton h-16 rounded-lg"></div>
            <div class="skeleton h-16 rounded-lg"></div>
        </div>
        <div id="pending-list" class="space-y-1.5 hidden"></div>
        <div id="queue-list" class="space-y-1.5 hidden"></div>
        <div id="history-list" class="space-y-1.5 hidden"></div>
    </div>

    <!-- ===== Toasts ===== -->
    <div id="toast-container"></div>

    <!-- ===== Confirm modal ===== -->
    <div id="modal-backdrop">
        <div class="modal-box">
            <div id="modal-title" class="font-bold text-sm text-white mb-1.5">ยืนยัน</div>
            <div id="modal-message" class="text-[11px] text-gray-400 mb-3 leading-relaxed">...</div>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 py-1.5 rounded-lg bg-bgItem hover:bg-bgRaised text-xs text-gray-300 border border-line transition-colors">ยกเลิก</button>
                <button id="modal-confirm-btn" class="flex-1 py-1.5 rounded-lg bg-danger hover:bg-red-500 text-xs text-white transition-colors">ยืนยัน</button>
            </div>
        </div>
    </div>

    <script>
        // 📥 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
            authDomain: "obs-live-photo.firebaseapp.com",
            projectId: "obs-live-photo",
            storageBucket: "obs-live-photo.firebasestorage.app",
            messagingSenderId: "410755111325",
            appId: "1:410755111325:web:814ca02445f4305267f774"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // ===== States =====
        // Photo status lifecycle: pending -> waiting -> showing -> shown
        //                                   \-> rejected (can be restored to "waiting")
        let pendingData = [];   // awaiting admin approval
        let queueData = [];     // approved, waiting to be shown
        let shownData = [];     // history: already displayed
        let rejectedData = [];  // history: rejected by admin
        let showingData = null;

        let playIntervalMs = 10000;
        let timeLeft = 0;
        let countdownTimer = null;
        let currentLoopIndex = 0;
        let historyPageSize = 15;
        let firstSnapshotReceived = false;
        let prevPendingCount = 0;
        let soundEnabled = false;
        let currentTab = 'pending';

        // ===== Toast helper =====
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const icon = type === 'success' ? 'fa-circle-check text-ok' : type === 'error' ? 'fa-circle-exclamation text-danger' : 'fa-circle-info text-accent';
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; setTimeout(() => el.remove(), 200); }, 2600);
        }

        // ===== Confirm modal helper =====
        let modalConfirmCallback = null;
        function showConfirm(title, message, onConfirm) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            modalConfirmCallback = onConfirm;
            document.getElementById('modal-backdrop').classList.add('open');
        }
        function closeModal() {
            document.getElementById('modal-backdrop').classList.remove('open');
            modalConfirmCallback = null;
        }
        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
            if (modalConfirmCallback) modalConfirmCallback();
            closeModal();
        });

        // ===== Settings drawer =====
        function toggleDrawer() {
            document.getElementById('settings-drawer').classList.toggle('open');
            document.getElementById('settings-btn').classList.toggle('text-accent');
        }

        // ===== Connection status =====
        function setStatus(status) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            dot.className = 'dot dot-' + status;
            text.innerText = status === 'online' ? 'ออนไลน์' : status === 'offline' ? 'ขาดการเชื่อมต่อ' : 'กำลังเชื่อมต่อ';
            text.className = status === 'offline' ? 'text-[9px] text-danger' : 'text-[9px] text-gray-500';
        }
        window.addEventListener('online', () => setStatus('online'));
        window.addEventListener('offline', () => { setStatus('offline'); showToast('อินเทอร์เน็ตขาดการเชื่อมต่อ', 'error'); });

        // ===== Notification beep =====
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                osc.start(); osc.stop(ctx.currentTime + 0.35);
            } catch (e) { /* audio not available, ignore */ }
        }

        // ===== Master switch & settings =====
        const masterSwitch = document.getElementById('master-switch');
        const animSelect = document.getElementById('anim-select');
        const masterStatus = document.getElementById('master-status');
        const soundSwitch = document.getElementById('sound-switch');

        masterSwitch.addEventListener('change', (e) => {
            masterStatus.className = 'text-[10px] mono ' + (e.target.checked ? 'text-emerald-400' : 'text-red-400');
            masterStatus.innerText = e.target.checked ? 'ON' : 'OFF';
            db.collection('settings').doc('display').set({ isVisible: e.target.checked }, { merge: true });
            showToast(e.target.checked ? 'เปิดการแสดงผลบนจอแล้ว' : 'ปิดการแสดงผลบนจอแล้ว', e.target.checked ? 'success' : 'info');
        });
        animSelect.addEventListener('change', (e) => {
            db.collection('settings').doc('display').set({ animation: e.target.value }, { merge: true });
        });
        soundSwitch.addEventListener('change', (e) => { soundEnabled = e.target.checked; });

        db.collection('settings').doc('display').get().then(doc => {
            if (doc.exists) {
                if (doc.data().isVisible !== undefined) masterSwitch.checked = doc.data().isVisible;
                if (doc.data().animation) animSelect.value = doc.data().animation;
                masterStatus.className = 'text-[10px] mono ' + (masterSwitch.checked ? 'text-emerald-400' : 'text-red-400');
                masterStatus.innerText = masterSwitch.checked ? 'ON' : 'OFF';
            }
        }).catch(() => setStatus('offline'));

        // ===== Live data =====
        db.collection('photos').onSnapshot(snapshot => {
            pendingData = []; queueData = []; shownData = []; rejectedData = [];
            let stillShowing = false;

            snapshot.forEach(doc => {
                const item = { id: doc.id, isHidden: false, isLocked: false, priority: false, priorityTimestamp: 0, ...doc.data() };
                if (item.status === 'showing') { showingData = item; stillShowing = true; }
                else if (item.status === 'waiting') queueData.push(item);
                else if (item.status === 'shown') shownData.push(item);
                else if (item.status === 'pending') pendingData.push(item);
                else if (item.status === 'rejected') rejectedData.push(item);
            });
            if (!stillShowing) showingData = null;

            // Oldest submitted first, so admin reviews in the order people sent them
            pendingData.sort((a, b) => a.timestamp - b.timestamp);

            queueData.sort((a, b) => {
                if (a.priority && b.priority) return a.priorityTimestamp - b.priorityTimestamp;
                if (a.priority) return -1;
                if (b.priority) return 1;
                return a.timestamp - b.timestamp;
            });
            shownData.sort((a, b) => b.timestamp - a.timestamp);
            rejectedData.sort((a, b) => (b.rejectedAt || b.timestamp) - (a.rejectedAt || a.timestamp));

            // Sound alert only for genuinely new incoming submissions
            if (firstSnapshotReceived && soundEnabled && pendingData.length > prevPendingCount) playBeep();
            prevPendingCount = pendingData.length;
            firstSnapshotReceived = true;

            document.getElementById('loading-state').classList.add('hidden');
            setStatus('online');

            updateNowShowing();

            document.getElementById('pending-count').innerText = pendingData.length;
            document.getElementById('queue-count').innerText = queueData.length;
            document.getElementById('history-count').innerText = shownData.length + rejectedData.length;

            const hiddenCount = queueData.filter(i => i.isHidden).length;
            const hiddenBadge = document.getElementById('queue-hidden-badge');
            if (hiddenCount > 0) { hiddenBadge.innerText = `· ${hiddenCount} ซ่อน`; hiddenBadge.classList.remove('hidden'); }
            else hiddenBadge.classList.add('hidden');

            // Pending indicators: tab badge + banner
            const pendingPing = document.getElementById('pending-ping');
            const banner = document.getElementById('pending-banner');
            const bannerCount = document.getElementById('pending-banner-count');
            if (pendingData.length > 0) {
                pendingPing.classList.remove('hidden');
                bannerCount.innerText = pendingData.length;
                if (currentTab !== 'pending') { banner.classList.add('show'); banner.style.display = 'flex'; }
                else { banner.classList.remove('show'); banner.style.display = 'none'; }
            } else {
                pendingPing.classList.add('hidden');
                banner.classList.remove('show'); banner.style.display = 'none';
            }

            renderAll();
        }, err => {
            console.error(err);
            setStatus('offline');
            showToast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ', 'error');
        });

        function renderAll() { renderPending(); renderQueue(); renderHistory(); }

        function updateNowShowing() {
            const nextUpRow = document.getElementById('next-up-row');
            if (showingData) {
                document.getElementById('live-img').src = showingData.imageUrl;
                document.getElementById('live-name').innerText = showingData.name;
                document.getElementById('live-msg').innerText = showingData.message || '-';
                document.getElementById('now-showing-container').classList.remove('hidden');

                const playable = queueData.filter(p => !p.isHidden && !p.isLocked);
                if (playable.length > 0) {
                    document.getElementById('next-up-img').src = playable[0].imageUrl;
                    document.getElementById('next-up-name').innerText = playable[0].name;
                    nextUpRow.classList.remove('opacity-30');
                } else {
                    document.getElementById('next-up-img').src = '';
                    document.getElementById('next-up-name').innerText = 'ไม่มีคิวถัดไป';
                    nextUpRow.classList.add('opacity-30');
                }
            } else {
                document.getElementById('now-showing-container').classList.add('hidden');
            }
        }

        // ===== Render: pending approval =====
        function renderPending() {
            const list = document.getElementById('pending-list');
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            let data = pendingData;
            if (q) data = data.filter(i => (i.name || '').toLowerCase().includes(q) || (i.message || '').toLowerCase().includes(q));

            if (data.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-500 mt-8 text-xs">
                    <i class="fa-solid fa-inbox text-lg mb-1.5 block opacity-40"></i>
                    ${q ? 'ไม่พบรายการที่ค้นหา' : 'ไม่มีรูปรออนุมัติ'}
                </div>`;
                return;
            }

            list.innerHTML = data.map(item => `
                <div class="bg-bgPanel rounded-lg border border-flash/30 p-2 flex flex-col gap-2">
                    <div class="flex gap-2 items-start">
                        <img src="${item.imageUrl}" class="thumb w-14 h-14 object-cover rounded shrink-0" onerror="this.classList.add('opacity-30')">
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-xs truncate text-white">${item.name}</div>
                            <div class="text-[9.5px] text-gray-400 mt-0.5 line-clamp-2">${item.message || '-'}</div>
                            <div class="text-[9px] text-gray-600 mono mt-1">${new Date(item.timestamp).toLocaleTimeString('th-TH')}</div>
                        </div>
                        <button onclick="confirmDeletePhoto('${item.id}')" class="chip w-6 h-6 rounded-md bg-bgMain border border-line hover:bg-red-900/50 text-gray-500 hover:text-red-400 flex items-center justify-center text-[10px] shrink-0" title="ลบทิ้งถาวร (ไม่เก็บบันทึก)">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="approvePending('${item.id}')" class="chip approve-btn flex-1 rounded-md py-1.5 text-[11px] font-semibold flex items-center justify-center gap-1">
                            <i class="fa-solid fa-check"></i> อนุมัติ
                        </button>
                        <button onclick="rejectPending('${item.id}')" class="chip reject-btn flex-1 rounded-md py-1.5 text-[11px] font-semibold flex items-center justify-center gap-1">
                            <i class="fa-solid fa-xmark"></i> ปฏิเสธ
                        </button>
                    </div>
                </div>`
            ).join('');
        }

        // ===== Render: queue =====
        function renderQueue() {
            const list = document.getElementById('queue-list');
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            document.getElementById('search-clear').classList.toggle('hidden', q.length === 0);

            let data = queueData;
            if (q) data = data.filter(i => (i.name || '').toLowerCase().includes(q) || (i.message || '').toLowerCase().includes(q));

            if (data.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-500 mt-8 text-xs">
                    <i class="fa-regular fa-image text-lg mb-1.5 block opacity-40"></i>
                    ${q ? 'ไม่พบรายการที่ค้นหา' : 'ไม่มีคิวรอแสดง'}
                </div>`;
                return;
            }

            list.innerHTML = data.map(item => {
                const eyeClass = item.isHidden ? 'text-warn bg-yellow-900/20 border-yellow-900/50' : 'text-gray-400 hover:text-white border-line';
                const eyeIcon = item.isHidden ? 'fa-eye-slash' : 'fa-eye';
                const lockClass = item.isLocked ? 'text-accent bg-accent/10 border-accentDim/50' : 'text-gray-400 hover:text-white border-line';
                const pinClass = item.priority ? 'text-flash bg-flash/10 border-flash/40' : 'text-gray-400 hover:text-white border-line';
                const containerClass = item.isHidden ? 'opacity-50' : '';

                return `
                <div class="bg-bgPanel rounded-lg border border-line p-2 flex flex-col gap-2 ${containerClass}">
                    <div class="flex gap-2 items-center">
                        <img src="${item.imageUrl}" class="thumb w-10 h-10 object-cover rounded shrink-0" onerror="this.classList.add('opacity-30')">
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-xs truncate text-white flex items-center gap-1 ${item.isHidden ? 'line-through text-gray-500' : ''}">
                                ${item.priority ? '<i class="fa-solid fa-star text-flash text-[9px]"></i>' : ''} ${item.name}
                            </div>
                            <div class="text-[9px] text-gray-400 truncate">${item.message || '-'}</div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center border-t border-line pt-2">
                        <div class="text-[9px] text-gray-500 mono">${new Date(item.timestamp).toLocaleTimeString('th-TH')}</div>
                        <div class="flex gap-1">
                            <button onclick="toggleField('${item.id}', 'isHidden', ${!item.isHidden})" class="chip w-6 h-6 rounded-md bg-bgMain border flex items-center justify-center text-[10px] ${eyeClass}" title="ซ่อน / แสดง"><i class="fa-solid ${eyeIcon}"></i></button>
                            <button onclick="toggleField('${item.id}', 'isLocked', ${!item.isLocked})" class="chip w-6 h-6 rounded-md bg-bgMain border flex items-center justify-center text-[10px] ${lockClass}" title="ล็อก (ข้ามตอนวนอัตโนมัติ)"><i class="fa-solid fa-lock"></i></button>
                            <button onclick="togglePriority('${item.id}', ${!item.priority})" class="chip w-6 h-6 rounded-md bg-bgMain border flex items-center justify-center text-[10px] ${pinClass}" title="ดันขึ้นต้นคิว"><i class="fa-solid fa-star"></i></button>
                            <button onclick="pushToLive('${item.id}')" class="chip w-6 h-6 rounded-md bg-accent hover:bg-accentDim text-white flex items-center justify-center text-[10px]" title="แสดงขึ้นจอทันที"><i class="fa-solid fa-play"></i></button>
                            <button onclick="confirmDeletePhoto('${item.id}')" class="chip w-6 h-6 rounded-md bg-bgMain border border-line hover:bg-red-900/50 text-red-500 flex items-center justify-center text-[10px] ml-0.5"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ===== Render: history (shown + rejected) =====
        function renderHistory() {
            const list = document.getElementById('history-list');
            const q = document.getElementById('search-input').value.trim().toLowerCase();

            let combined = [
                ...shownData.map(i => ({ ...i, _kind: 'shown' })),
                ...rejectedData.map(i => ({ ...i, _kind: 'rejected' }))
            ];
            combined.sort((a, b) => (b._kind === 'rejected' ? (b.rejectedAt || b.timestamp) : b.timestamp) - (a._kind === 'rejected' ? (a.rejectedAt || a.timestamp) : a.timestamp));

            if (q) combined = combined.filter(i => (i.name || '').toLowerCase().includes(q) || (i.message || '').toLowerCase().includes(q));

            if (combined.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-500 mt-8 text-xs">
                    <i class="fa-solid fa-clock-rotate-left text-lg mb-1.5 block opacity-40"></i>
                    ${q ? 'ไม่พบรายการที่ค้นหา' : 'ยังไม่มีประวัติ'}
                </div>`;
                return;
            }

            const shown = combined.slice(0, historyPageSize);
            list.innerHTML = shown.map(item => {
                const isRejected = item._kind === 'rejected';
                const badge = isRejected
                    ? '<span class="text-[8.5px] px-1.5 py-0.5 rounded bg-red-900/30 text-red-400 border border-red-900/50">ปฏิเสธ</span>'
                    : '<span class="text-[8.5px] px-1.5 py-0.5 rounded bg-emerald-900/20 text-emerald-400/80 border border-emerald-900/40">แสดงแล้ว</span>';
                const secondaryBtn = isRejected
                    ? `<button onclick="restoreToQueue('${item.id}')" class="chip w-6 h-6 rounded-md bg-bgMain border border-line text-gray-400 hover:text-accent flex items-center justify-center text-[10px]" title="กู้คืนเข้าคิว"><i class="fa-solid fa-clock-rotate-left"></i></button>`
                    : `<button onclick="pushToLive('${item.id}')" class="chip w-6 h-6 rounded-md bg-bgMain border border-line text-gray-400 hover:text-white flex items-center justify-center text-[10px]" title="แสดงซ้ำ"><i class="fa-solid fa-rotate-right"></i></button>`;

                return `
                <div class="bg-bgPanel/60 rounded-lg border border-[#2a2730] p-2 flex items-center gap-2">
                    <img src="${item.imageUrl}" class="thumb w-8 h-8 object-cover rounded ${isRejected ? '' : 'grayscale'} shrink-0" onerror="this.classList.add('opacity-30')">
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-[11px] truncate text-gray-300 flex items-center gap-1.5">${item.name} ${badge}</div>
                        <div class="text-[9px] text-gray-600 mono">${new Date(item.timestamp).toLocaleTimeString('th-TH')}</div>
                    </div>
                    ${secondaryBtn}
                    <button onclick="confirmDeletePhoto('${item.id}')" class="chip w-6 h-6 rounded-md bg-bgMain border border-line hover:bg-red-900/50 text-red-500 flex items-center justify-center text-[10px]" title="ลบถาวร"><i class="fa-solid fa-trash-can"></i></button>
                </div>`;
            }).join('');

            if (combined.length > historyPageSize) {
                list.innerHTML += `<button onclick="loadMoreHistory()" class="w-full text-[10px] text-gray-400 hover:text-white bg-bgPanel border border-line rounded-lg py-1.5 mt-1">ดูเพิ่มเติม (${combined.length - historyPageSize})</button>`;
            }
        }
        function loadMoreHistory() { historyPageSize += 15; renderHistory(); }

        function clearSearch() { document.getElementById('search-input').value = ''; renderAll(); }

        // ===== Pending approval actions =====
        async function approvePending(docId) {
            try { await db.collection('photos').doc(docId).update({ status: 'waiting' }); showToast('อนุมัติแล้ว เข้าคิวรอแสดง'); }
            catch (err) { showToast('อนุมัติไม่สำเร็จ', 'error'); }
        }
        async function rejectPending(docId) {
            try { await db.collection('photos').doc(docId).update({ status: 'rejected', rejectedAt: Date.now() }); showToast('ปฏิเสธรูปแล้ว', 'info'); }
            catch (err) { showToast('ดำเนินการไม่สำเร็จ', 'error'); }
        }
        async function restoreToQueue(docId) {
            try { await db.collection('photos').doc(docId).update({ status: 'waiting' }); showToast('ย้ายกลับเข้าคิวแล้ว'); }
            catch (err) { showToast('ดำเนินการไม่สำเร็จ', 'error'); }
        }

        // ===== Database actions =====
        async function pushToLive(docId) {
            try {
                if (showingData) await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
                await db.collection('photos').doc(docId).update({ status: 'showing', priority: false });
                timeLeft = playIntervalMs;
            } catch (err) { console.error(err); showToast('ไม่สามารถแสดงรูปได้', 'error'); }
        }

        function skipNext() { triggerNextPhoto(true); }
        function skipPrev() {
            if (shownData.length === 0) { showToast('ไม่มีรูปก่อนหน้าในประวัติ', 'info'); return; }
            pushToLive(shownData[0].id);
        }

        async function toggleField(docId, field, value) {
            try { await db.collection('photos').doc(docId).update({ [field]: value }); }
            catch (err) { showToast('อัปเดตไม่สำเร็จ', 'error'); }
        }

        async function togglePriority(docId, value) {
            await db.collection('photos').doc(docId).update({ priority: value, priorityTimestamp: Date.now() });
            showToast(value ? 'ดันขึ้นต้นคิวแล้ว' : 'ยกเลิกการดันคิวแล้ว', 'success');
        }

        function confirmDeletePhoto(docId) {
            showConfirm('ลบรูปนี้?', 'รูปนี้จะถูกลบออกจากระบบถาวรและไม่สามารถกู้คืนได้', async () => {
                try { await db.collection('photos').doc(docId).delete(); showToast('ลบรูปแล้ว'); }
                catch (err) { showToast('ลบไม่สำเร็จ', 'error'); }
            });
        }

        function confirmClearQueue() {
            if (queueData.length === 0) { showToast('ไม่มีรายการในคิว', 'info'); return; }
            showConfirm('ล้างคิวทั้งหมด?', `รูปที่รออยู่ทั้งหมด ${queueData.length} รายการจะถูกลบออกจากคิว`, async () => {
                const batch = db.batch();
                queueData.forEach(item => batch.delete(db.collection('photos').doc(item.id)));
                try { await batch.commit(); showToast('ล้างคิวเรียบร้อย'); }
                catch (err) { showToast('ล้างคิวไม่สำเร็จ', 'error'); }
            });
        }

        async function unlockAll() {
            const locked = queueData.filter(i => i.isLocked);
            if (locked.length === 0) { showToast('ไม่มีรายการที่ถูกล็อก', 'info'); return; }
            const batch = db.batch();
            locked.forEach(item => batch.update(db.collection('photos').doc(item.id), { isLocked: false }));
            await batch.commit();
            showToast(`ปลดล็อก ${locked.length} รายการแล้ว`);
        }

        async function clearScreen() {
            if (showingData) {
                await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
                showToast('ล้างหน้าจอแล้ว');
            }
        }

        function confirmCleanup() {
            showConfirm('ล้างข้อมูลเก่า?', 'ลบรูปที่มีอายุเกิน 24 ชั่วโมงออกจากระบบถาวร (ไม่รวมรูปที่กำลังแสดงหรือรออนุมัติ)', async () => {
                const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
                try {
                    const snapshot = await db.collection('photos').where('timestamp', '<', oneDayAgo).get();
                    const toDelete = snapshot.docs.filter(doc => !['pending', 'showing'].includes(doc.data().status));
                    if (toDelete.length === 0) { showToast('ไม่มีข้อมูลเก่าที่ต้องล้าง', 'info'); return; }
                    const batch = db.batch();
                    toDelete.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    showToast(`ล้างข้อมูลเก่าแล้ว ${toDelete.length} รายการ`);
                } catch (err) { showToast('ล้างข้อมูลไม่สำเร็จ', 'error'); }
            });
        }

        // ===== Auto play & countdown =====
        const autoplaySwitch = document.getElementById('autoplay-switch');
        const timerSelect = document.getElementById('timer-select');
        const loopModeSelect = document.getElementById('loop-mode');

        function initFilmstrip() {
            const bar = document.getElementById('progress-bar');
            bar.innerHTML = '';
            for (let i = 0; i < 14; i++) bar.innerHTML += `<div class="sprocket" id="sprocket-${i}"></div>`;
        }
        initFilmstrip();

        function startAutoPlay() {
            clearInterval(countdownTimer);
            playIntervalMs = parseInt(timerSelect.value) * 1000;
            timeLeft = playIntervalMs;

            if (autoplaySwitch.checked) {
                countdownTimer = setInterval(() => {
                    timeLeft -= 100;
                    document.getElementById('countdown-text').innerText = Math.max(0, Math.ceil(timeLeft / 1000)) + 's';

                    const percent = Math.max(0, timeLeft / playIntervalMs);
                    const chunksToFill = Math.ceil(percent * 14);
                    for (let i = 0; i < 14; i++) {
                        const chunk = document.getElementById(`sprocket-${i}`);
                        if (!chunk) continue;
                        if (i < chunksToFill) chunk.classList.add('filled'); else chunk.classList.remove('filled');
                    }

                    if (timeLeft <= 0) {
                        triggerNextPhoto(false);
                        timeLeft = playIntervalMs;
                    }
                }, 100);
            } else {
                document.getElementById('countdown-text').innerText = '--';
                for (let i = 0; i < 14; i++) { const c = document.getElementById(`sprocket-${i}`); if (c) c.classList.remove('filled'); }
            }
        }

        function triggerNextPhoto(manual) {
            const mode = loopModeSelect.value;
            const playableQueue = queueData.filter(p => !p.isHidden && !p.isLocked);

            if (mode === 'queue' && playableQueue.length > 0) {
                pushToLive(playableQueue[0].id);
            } else if (mode === 'all') {
                const playableHistory = shownData.filter(p => !p.isHidden);
                let allPhotos = [...playableQueue, ...playableHistory];
                if (showingData && !showingData.isHidden) allPhotos.push(showingData);
                allPhotos.sort((a, b) => a.timestamp - b.timestamp);

                if (allPhotos.length > 0) {
                    currentLoopIndex = (currentLoopIndex + 1) % allPhotos.length;
                    pushToLive(allPhotos[currentLoopIndex].id);
                } else if (manual) {
                    showToast('ไม่มีรูปให้ข้าม', 'info');
                }
            } else if (manual) {
                showToast('ไม่มีรูปในคิว (ลองอนุมัติรูปที่รออยู่ก่อน)', 'info');
            }
            if (autoplaySwitch.checked) timeLeft = playIntervalMs;
        }

        autoplaySwitch.addEventListener('change', startAutoPlay);
        timerSelect.addEventListener('change', startAutoPlay);
        loopModeSelect.addEventListener('change', startAutoPlay);

        // ===== Tabs =====
        function switchTab(tab) {
            currentTab = tab;
            ['pending', 'queue', 'history'].forEach(t => {
                const btn = document.getElementById('tab-' + t);
                btn.className = t === tab ? 'tab-btn flex-1 py-2 text-center tab-active' : 'tab-btn flex-1 py-2 text-center text-gray-400 hover:bg-bgPanel';
                document.getElementById(t + '-list').style.display = t === tab ? 'block' : 'none';
            });
            document.getElementById('bulk-actions').classList.toggle('hidden', tab !== 'queue');

            // Hide the pending banner once the admin is looking at the pending tab
            const banner = document.getElementById('pending-banner');
            if (tab === 'pending') { banner.classList.remove('show'); banner.style.display = 'none'; }
            else if (pendingData.length > 0) { banner.classList.add('show'); banner.style.display = 'flex'; }
        }
        switchTab('pending');
    </script>
</body>
</html>
