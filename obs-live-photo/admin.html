<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Dock - Pro Control</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { bgMain: '#1E1E1E', bgPanel: '#2B2B2B', bgItem: '#333333', borderDim: '#111111', accent: '#3b82f6' },
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #1E1E1E; color: #E5E7EB; overflow-x: hidden; user-select: none; font-size: 12px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        /* Custom Toggle */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(16px); }
        .master-toggle:checked + .slider { background-color: #10b981; } /* สีเขียวสำหรับ Master Switch */

        /* Progress Bar */
        .progress-bar-bg { background-color: #111; border-radius: 3px; overflow: hidden; display: flex; gap: 1px; height: 4px; }
        .progress-chunk { flex: 1; background-color: #333; transition: background-color 0.1s; }
        .progress-chunk.filled { background-color: #3b82f6; }
        
        .tab-btn { border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; background-color: #2B2B2B; }
        
        select { background-image: none; text-align: center; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div class="bg-bgPanel border-b border-borderDim p-3 flex justify-between items-center shadow-md z-20 shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-camera-retro text-accent text-sm"></i>
            <h1 class="font-bold text-white text-sm leading-none">Live Photo</h1>
        </div>
        <div class="flex items-center gap-2">
            <span id="master-status" class="text-[10px] text-emerald-400">จอแสดงผล</span>
            <label class="switch">
                <input type="checkbox" id="master-switch" class="master-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="bg-bgMain p-2 border-b border-borderDim shrink-0 space-y-2">
        <div class="bg-bgPanel p-2 rounded border border-[#333] flex justify-between items-center">
            <div class="flex items-center gap-2">
                <label class="switch"><input type="checkbox" id="autoplay-switch"><span class="slider"></span></label>
                <span class="font-medium text-xs">Auto Play</span>
            </div>
            <select id="timer-select" class="bg-bgItem border border-[#444] rounded px-2 py-0.5 text-xs outline-none focus:border-accent">
                <option value="5">5 วิ</option><option value="10" selected>10 วิ</option><option value="15">15 วิ</option>
            </select>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
            <select id="loop-mode" class="bg-bgPanel border border-[#333] rounded px-1 py-1.5 text-[10px] outline-none text-gray-300">
                <option value="queue">วนคิวใหม่</option>
                <option value="all">วนรูปทั้งหมด</option>
            </select>
            <select id="anim-select" class="bg-bgPanel border border-[#333] rounded px-1 py-1.5 text-[10px] outline-none text-gray-300">
                <option value="fade">Fade</option>
                <option value="zoom">Zoom</option>
                <option value="slide">Slide</option>
            </select>
        </div>
    </div>

    <div class="bg-bgPanel border-b border-borderDim p-2 shrink-0 hidden" id="now-showing-container">
        <div class="flex justify-between items-center mb-2">
            <span class="text-[10px] font-bold text-accent"><i class="fa-solid fa-play text-[8px] mr-1"></i> กำลังแสดงผล</span>
            <span class="text-[10px] font-bold text-accent" id="countdown-text">--</span>
        </div>
        
        <div class="flex gap-2 items-center bg-bgItem p-1.5 rounded border border-[#444]">
            <img id="live-img" src="" class="w-14 h-10 object-cover rounded bg-black">
            <div class="flex-1 overflow-hidden">
                <div id="live-name" class="font-bold text-white text-xs truncate">...</div>
                <div id="live-msg" class="text-[9px] text-gray-400 truncate">...</div>
            </div>
            <button onclick="clearScreen()" class="w-6 h-6 rounded bg-bgMain hover:bg-red-900/50 text-gray-400 hover:text-red-400 border border-[#444] transition-colors" title="ล้างหน้าจอ">
                <i class="fa-solid fa-xmark text-[10px]"></i>
            </button>
        </div>
        <div class="progress-bar-bg mt-1.5" id="progress-bar"></div>
    </div>

    <div class="flex bg-bgMain border-b border-borderDim shrink-0">
        <button onclick="switchTab('queue')" id="tab-queue" class="tab-btn flex-1 py-2 text-center tab-active hover:bg-bgPanel">คิว (<span id="queue-count">0</span>)</button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 py-2 text-center text-gray-400 hover:bg-bgPanel">ประวัติ (<span id="history-count">0</span>)</button>
    </div>

    <div class="flex-1 overflow-y-auto bg-bgMain p-1.5 relative">
        <div id="queue-list" class="space-y-1.5"></div>
        <div id="history-list" class="space-y-1.5 hidden"></div>
    </div>

    <div class="bg-bgPanel border-t border-borderDim p-2 shrink-0 text-center">
        <button onclick="autoCleanUp()" class="text-[10px] text-gray-500 hover:text-red-400 transition-colors">
            <i class="fa-solid fa-broom"></i> ล้างข้อมูลเก่าเกิน 24 ชม.
        </button>
    </div>

    <script>
        // 📥 Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
            authDomain: "obs-live-photo.firebaseapp.com",
            projectId: "obs-live-photo",
            storageBucket: "obs-live-photo.firebasestorage.app",
            messagingSenderId: "410755111325",
            appId: "1:410755111325:web:814ca02445f4305267f774"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // States
        let queueData = [];
        let historyData = [];
        let showingData = null;
        let isAutoPlay = false;
        let playIntervalMs = 10000;
        let timeLeft = 0;
        let countdownTimer = null;
        let currentLoopIndex = 0;

        // Init Progress Bar
        const initProgressBar = () => {
            const bar = document.getElementById('progress-bar');
            bar.innerHTML = '';
            for(let i=0; i<10; i++) bar.innerHTML += `<div class="progress-chunk" id="chunk-${i}"></div>`;
        }
        initProgressBar();

        // 1. ส่งค่า Settings ขึ้นจอ
        const masterSwitch = document.getElementById('master-switch');
        const animSelect = document.getElementById('anim-select');
        const masterStatus = document.getElementById('master-status');

        masterSwitch.addEventListener('change', (e) => {
            masterStatus.className = e.target.checked ? 'text-[10px] text-emerald-400' : 'text-[10px] text-red-400';
            db.collection('settings').doc('display').set({ isVisible: e.target.checked }, { merge: true });
        });
        animSelect.addEventListener('change', (e) => {
            db.collection('settings').doc('display').set({ animation: e.target.value }, { merge: true });
        });

        // โหลดค่าเริ่มต้น
        db.collection('settings').doc('display').get().then(doc => {
            if(doc.exists) {
                if(doc.data().isVisible !== undefined) masterSwitch.checked = doc.data().isVisible;
                if(doc.data().animation) animSelect.value = doc.data().animation;
                masterSwitch.dispatchEvent(new Event('change'));
            }
        });

        // 2. ดึงข้อมูลรูปภาพ
        db.collection('photos').onSnapshot(snapshot => {
            queueData = [];
            historyData = [];
            
            snapshot.forEach(doc => {
                const item = { id: doc.id, isHidden: false, isLocked: false, ...doc.data() };
                
                if (item.status === 'showing') showingData = item;
                else if (item.status === 'waiting') queueData.push(item);
                else if (item.status === 'shown') historyData.push(item);
            });

            // อัปเดต Preview
            if (showingData) {
                document.getElementById('live-img').src = showingData.imageUrl;
                document.getElementById('live-name').innerText = showingData.name;
                document.getElementById('live-msg').innerText = showingData.message || '-';
                document.getElementById('now-showing-container').classList.remove('hidden');
            } else {
                document.getElementById('now-showing-container').classList.add('hidden');
            }

            queueData.sort((a, b) => a.timestamp - b.timestamp);
            historyData.sort((a, b) => b.timestamp - a.timestamp);

            document.getElementById('queue-count').innerText = queueData.length;
            document.getElementById('history-count').innerText = historyData.length;

            renderQueue();
            renderHistory();
        });

        // 3. Render HTML ของแต่ละรายการ (จัด Layout สำหรับพื้นที่แคบ)
        function renderQueue() {
            const list = document.getElementById('queue-list');
            if(queueData.length === 0) { list.innerHTML = '<div class="text-center text-gray-500 mt-6 text-xs">ไม่มีคิวรอแสดง</div>'; return; }
            
            list.innerHTML = queueData.map(item => {
                const eyeClass = item.isHidden ? 'text-yellow-500 bg-yellow-900/20 border-yellow-900/50' : 'text-gray-400 hover:text-white border-borderDim';
                const eyeIcon = item.isHidden ? 'fa-eye-slash' : 'fa-eye';
                const lockClass = item.isLocked ? 'text-purple-400 bg-purple-900/20 border-purple-900/50' : 'text-gray-400 hover:text-white border-borderDim';
                const containerClass = item.isHidden ? 'opacity-50' : '';
                
                return `
                <div class="bg-bgPanel rounded border border-[#333] p-2 flex flex-col gap-2 ${containerClass}">
                    <div class="flex gap-2 items-center">
                        <img src="${item.imageUrl}" class="w-10 h-10 object-cover rounded bg-black shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-xs truncate text-white ${item.isHidden ? 'line-through text-gray-500' : ''}">${item.name}</div>
                            <div class="text-[9px] text-gray-400 truncate">${item.message || '-'}</div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center border-t border-[#333] pt-2">
                        <div class="text-[9px] text-gray-500">${new Date(item.timestamp).toLocaleTimeString('th-TH')}</div>
                        <div class="flex gap-1">
                            <button onclick="toggleField('${item.id}', 'isHidden', ${!item.isHidden})" class="w-6 h-6 rounded bg-bgMain border flex items-center justify-center text-[10px] ${eyeClass}" title="ซ่อน"><i class="fa-solid ${eyeIcon}"></i></button>
                            <button onclick="toggleField('${item.id}', 'isLocked', ${!item.isLocked})" class="w-6 h-6 rounded bg-bgMain border flex items-center justify-center text-[10px] ${lockClass}" title="ล็อกคิว"><i class="fa-solid fa-lock"></i></button>
                            <button onclick="pushToLive('${item.id}')" class="w-6 h-6 rounded bg-accent hover:bg-blue-500 text-white flex items-center justify-center text-[10px]" title="แสดงขึ้นจอ"><i class="fa-solid fa-play"></i></button>
                            <button onclick="deletePhoto('${item.id}')" class="w-6 h-6 rounded bg-bgMain border border-borderDim hover:bg-red-900/50 text-red-500 flex items-center justify-center text-[10px] ml-1"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if(historyData.length === 0) { list.innerHTML = '<div class="text-center text-gray-500 mt-6 text-xs">ไม่มีประวัติ</div>'; return; }
            list.innerHTML = historyData.slice(0,40).map(item => `
                <div class="bg-bgPanel/50 rounded border border-[#222] p-2 flex items-center gap-2">
                    <img src="${item.imageUrl}" class="w-8 h-8 object-cover rounded grayscale shrink-0">
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-[11px] truncate text-gray-400">${item.name}</div>
                    </div>
                    <button onclick="pushToLive('${item.id}')" class="w-6 h-6 rounded bg-bgMain border border-borderDim text-gray-400 hover:text-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            `).join('');
        }

        // 4. ฟังก์ชัน Database
        async function pushToLive(docId) {
            try {
                if (showingData) await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
                await db.collection('photos').doc(docId).update({ status: 'showing' });
                timeLeft = playIntervalMs; 
            } catch (err) { console.error(err); }
        }

        async function toggleField(docId, field, value) {
            await db.collection('photos').doc(docId).update({ [field]: value });
        }

        async function deletePhoto(docId) {
            if(confirm("ลบรูปนี้ทิ้ง?")) await db.collection('photos').doc(docId).delete();
        }

        async function clearScreen() {
            if(showingData) await db.collection('photos').doc(showingData.id).update({ status: 'shown' });
        }
        
        function autoCleanUp() {
            const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
            db.collection('photos').where('timestamp', '<', oneDayAgo).get().then(snapshot => {
                snapshot.forEach(doc => doc.ref.delete());
                alert('ล้างข้อมูลเก่าเรียบร้อย');
            });
        }

        // 5. ระบบ Auto Play & Countdown
        const autoplaySwitch = document.getElementById('autoplay-switch');
        const timerSelect = document.getElementById('timer-select');
        const loopModeSelect = document.getElementById('loop-mode');

        function startAutoPlay() {
            clearInterval(countdownTimer);
            playIntervalMs = parseInt(timerSelect.value) * 1000;
            timeLeft = playIntervalMs;

            if (autoplaySwitch.checked) {
                countdownTimer = setInterval(() => {
                    timeLeft -= 100;
                    
                    document.getElementById('countdown-text').innerText = Math.ceil(timeLeft / 1000) + 's';
                    
                    const percent = timeLeft / playIntervalMs;
                    const chunksToFill = Math.ceil(percent * 10);
                    for(let i=0; i<10; i++) {
                        const chunk = document.getElementById(`chunk-${i}`);
                        if(i < chunksToFill) chunk.classList.add('filled');
                        else chunk.classList.remove('filled');
                    }

                    if (timeLeft <= 0) {
                        triggerNextPhoto();
                        timeLeft = playIntervalMs;
                    }
                }, 100);
            } else {
                document.getElementById('countdown-text').innerText = '--';
                for(let i=0; i<10; i++) document.getElementById(`chunk-${i}`).classList.remove('filled');
            }
        }

        function triggerNextPhoto() {
            const mode = loopModeSelect.value;
            const playableQueue = queueData.filter(p => !p.isHidden && !p.isLocked);
            
            if (mode === 'queue' && playableQueue.length > 0) {
                pushToLive(playableQueue[0].id);
            } 
            else if (mode === 'all') {
                const playableHistory = historyData.filter(p => !p.isHidden);
                let allPhotos = [...playableQueue, ...playableHistory];
                if (showingData && !showingData.isHidden) allPhotos.push(showingData);
                
                allPhotos.sort((a, b) => a.timestamp - b.timestamp);
                
                if (allPhotos.length > 0) {
                    currentLoopIndex = (currentLoopIndex + 1) % allPhotos.length;
                    pushToLive(allPhotos[currentLoopIndex].id);
                }
            }
        }

        autoplaySwitch.addEventListener('change', startAutoPlay);
        timerSelect.addEventListener('change', startAutoPlay);
        loopModeSelect.addEventListener('change', startAutoPlay);

        function switchTab(tab) {
            document.getElementById('tab-queue').className = tab === 'queue' ? 'tab-btn flex-1 py-2 text-center tab-active' : 'tab-btn flex-1 py-2 text-center text-gray-400 hover:bg-bgPanel';
            document.getElementById('tab-history').className = tab === 'history' ? 'tab-btn flex-1 py-2 text-center tab-active' : 'tab-btn flex-1 py-2 text-center text-gray-400 hover:bg-bgPanel';
            
            document.getElementById('queue-list').style.display = tab === 'queue' ? 'block' : 'none';
            document.getElementById('history-list').style.display = tab === 'history' ? 'block' : 'none';
        }
    </script>
</body>
</html>
