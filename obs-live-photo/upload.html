<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งรูปภาพขึ้นจอใหญ่</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #ffffff; display: flex; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 480px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin: 0 0 10px 0; color: #60a5fa; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.1rem; margin: 0; color: #94a3b8; }
        .upload-form { width: 100%; background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 1rem; color: #cbd5e1; font-weight: 500; }
        .form-group input[type="text"] { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; font-family: 'Prompt', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none; }
        .file-input-wrapper { position: relative; margin-bottom: 25px; }
        .hidden-file-input { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .custom-file-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #334155; padding: 30px 20px; border-radius: 12px; background-color: rgba(15, 23, 42, 0.6); text-align: center; }
        .custom-file-btn .icon { font-size: 2.5rem; margin-bottom: 8px; }
        .custom-file-btn .text { font-size: 1rem; color: #94a3b8; }
        .preview-container { display: none; width: 100%; margin-top: 15px; text-align: center; }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 2px solid #3b82f6; }
        .btn-submit { width: 100%; background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 14px; border-radius: 8px; font-family: 'Prompt', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-submit:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>ส่งรูปของคุณขึ้นจอใหญ่</h1>
            <p>ร่วมแชร์โมเมนต์ความประทับใจในงาน</p>
        </div>

        <div class="upload-form">
            <div class="form-group">
                <label for="username">ชื่อของคุณ / กลุ่มเพื่อน</label>
                <input type="text" id="username" placeholder="ตัวอย่าง: ณัฐวุฒิ และเพื่อนๆ" required>
            </div>
            <div class="form-group">
                <label for="message">ข้อความอวยพร (ไม่บังคับ)</label>
                <input type="text" id="message" placeholder="ตัวอย่าง: ยินดีด้วยน้า">
            </div>
            <div class="file-input-wrapper">
                <div class="custom-file-btn" id="upload-box">
                    <span class="icon">📸</span>
                    <span class="text" id="upload-text">กดเพื่อถ่ายรูป หรือ เลือกรูปภาพ</span>
                </div>
                <input type="file" id="file-input" class="hidden-file-input" accept="image/*" required>
            </div>
            <div class="preview-container" id="preview-div">
                <img src="" alt="Preview" class="preview-img" id="img-preview">
            </div>
            <button type="button" class="btn-submit" id="submit-btn" style="margin-top: 15px;">ส่งรูปขึ้นจอเลย! 🚀</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // 📥 1. ใส่ API Key ของ ImgBB
        const IMGBB_API_KEY = "a2e08eafbdd5b80614a1dda6624e974a";

        // 📥 2. นำเอา firebaseConfig มาใส่ตรงนี้
        const firebaseConfig = {
  apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
  authDomain: "obs-live-photo.firebaseapp.com",
  projectId: "obs-live-photo",
  storageBucket: "obs-live-photo.firebasestorage.app",
  messagingSenderId: "410755111325",
  appId: "1:410755111325:web:814ca02445f4305267f774"
};

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const fileInput = document.getElementById('file-input');
        const uploadText = document.getElementById('upload-text');
        const previewDiv = document.getElementById('preview-div');
        const imgPreview = document.getElementById('img-preview');
        const submitBtn = document.getElementById('submit-btn');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadText.innerText = "เปลี่ยนรูปภาพ";
                const reader = new FileReader();
                reader.onload = function(event) {
                    imgPreview.src = event.target.result;
                    previewDiv.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        submitBtn.addEventListener('click', async function() {
            const name = document.getElementById('username').value.trim();
            const msg = document.getElementById('message').value.trim();
            const file = fileInput.files[0];
            
            if (!name) return alert('กรุณากรอกชื่อของคุณก่อนส่งนะครับ');
            if (!file) return alert('กรุณาเลือกรูปภาพก่อนส่งนะครับ');

            submitBtn.disabled = true;
            submitBtn.innerText = "กำลังอัปโหลดรูปภาพ...";

            try {
                // อัปโหลดไป ImgBB (ตั้งค่า expiration ที่เว็บ ImgBB ไว้ 1 วันแล้ว)
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if(!result.success) {
                    throw new Error('ImgBB Upload Failed');
                }

                const imageUrl = result.data.url;
                submitBtn.innerText = "กำลังส่งข้อมูลเข้าคิว...";

                // บันทึกลง Firebase พร้อมระบุ Timestamp ปัจจุบัน (เพื่อให้ระบบคำนวณและลบได้)
                await db.collection('photos').add({
                    name: name,
                    message: msg || "ส่งความสุขเข้าร่วมงาน",
                    imageUrl: imageUrl,
                    status: 'waiting', 
                    timestamp: Date.now() // บันทึกเวลาแบบตรงๆ
                });

                alert('ส่งรูปเข้าคิวเรียบร้อยแล้ว! รอลุ้นขึ้นจอได้เลยยย 🎉');
                
                // รีเซ็ตฟอร์ม
                document.getElementById('username').value = '';
                document.getElementById('message').value = '';
                fileInput.value = '';
                previewDiv.style.display = 'none';
                uploadText.innerText = "กดเพื่อถ่ายรูป หรือ เลือกรูปภาพ";
            } catch (error) {
                console.error(error);
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "ส่งรูปขึ้นจอเลย! 🚀";
            }
        });
    </script>
</body>
</html>
