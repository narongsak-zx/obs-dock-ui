<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งรูปขึ้นจอ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #ffffff; display: flex; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 480px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin: 0 0 10px 0; color: #60a5fa; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.05rem; margin: 0; color: #94a3b8; line-height: 1.5; }
        .upload-form { width: 100%; background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 1rem; color: #cbd5e1; font-weight: 500; }
        .form-group label .optional-tag { font-size: 0.8rem; font-weight: 400; color: #64748b; }
        .form-group input[type="text"] { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; font-family: 'Prompt', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s ease; }
        .form-group input[type="text"]:focus { border-color: #3b82f6; }
        .form-group input[type="text"].input-error { border-color: #f87171; }
        .field-hint { font-size: 0.8rem; color: #64748b; margin-top: 6px; }

        .file-input-wrapper { position: relative; margin-bottom: 20px; }
        .hidden-file-input { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }

        /* กรอบเลือกรูป: ใช้กรอบเดียวกันแสดงทั้งสถานะว่างและสถานะพรีวิว */
        .custom-file-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #334155; padding: 30px 20px; border-radius: 12px; background-color: rgba(15, 23, 42, 0.6); text-align: center; transition: border-color 0.2s ease, background-color 0.2s ease, padding 0.2s ease; overflow: hidden; min-height: 120px; }
        .custom-file-btn .icon { font-size: 2.5rem; margin-bottom: 8px; }
        .custom-file-btn .text { font-size: 1rem; color: #94a3b8; }
        .custom-file-btn .subtext { font-size: 0.8rem; color: #64748b; margin-top: 4px; }

        /* สถานะเมื่อเลือกรูปแล้ว: กรอบเปลี่ยนเป็นทึบ ไม่มีขอบประ ไม่เว้น padding เพื่อให้รูป preview เต็มกรอบ */
        .custom-file-btn.has-file { border-color: #3b82f6; border-style: solid; padding: 0; }
        .custom-file-btn.has-file .icon,
        .custom-file-btn.has-file .default-text { display: none; }

        .preview-img { display: none; width: 100%; max-height: 240px; object-fit: cover; border-radius: 10px; }
        .custom-file-btn.has-file .preview-img { display: block; }

        .preview-caption { display: none; position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 10px; font-size: 0.8rem; color: #e2e8f0; background: linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%); text-align: center; }
        .custom-file-btn.has-file .preview-caption { display: block; }

        .btn-submit { width: 100%; background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 14px; border-radius: 8px; font-family: 'Prompt', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        .spinner.show { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .note { font-size: 0.85rem; color: #64748b; text-align: center; margin-top: 14px; line-height: 1.5; }

        /* ป๊อปอัปแจ้งเตือน */
        .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; box-sizing: border-box; opacity: 0; transition: opacity 0.2s ease; }
        .popup-overlay.show { display: flex; }
        .popup-overlay.show.visible { opacity: 1; }
        .popup-box { width: 100%; max-width: 340px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 26px 22px 20px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); transform: scale(0.92); transition: transform 0.2s ease; }
        .popup-overlay.show.visible .popup-box { transform: scale(1); }
        .popup-icon { font-size: 2.2rem; margin-bottom: 10px; }
        .popup-message { font-size: 1rem; color: #e2e8f0; line-height: 1.6; margin-bottom: 18px; }
        .popup-btn { display: inline-block; padding: 10px 28px; border-radius: 8px; border: none; font-family: 'Prompt', sans-serif; font-size: 0.95rem; font-weight: 500; cursor: pointer; color: white; }
        .popup-box.success .popup-btn { background: #16a34a; }
        .popup-box.error .popup-btn { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>ส่งรูปขึ้นจอ</h1>
            <p>เลือกรูปแล้วส่งได้เลย </p>
        </div>

        <div class="upload-form">
            <div class="form-group">
                <label for="username">ข้อความหลัก <span class="optional-tag">(ไม่บังคับ)</span></label>
                <input type="text" id="username">
            </div>
            <div class="form-group">
                <label for="message">ข้อความรอง <span class="optional-tag">(ไม่บังคับ)</span></label>
                <input type="text" id="message">
            </div>
            <div class="file-input-wrapper">
                <div class="custom-file-btn" id="upload-box">
                    <span class="icon">📸</span>
                    <span class="text default-text" id="upload-text">แตะเพื่อถ่ายภาพ หรือเลือกรูปจากเครื่อง</span>
                    <span class="subtext default-text">รองรับไฟล์ JPG, PNG</span>
                    <img src="" alt="ตัวอย่างรูปที่เลือก" class="preview-img" id="img-preview">
                    <span class="preview-caption">แตะเพื่อเปลี่ยนรูป</span>
                </div>
                <input type="file" id="file-input" class="hidden-file-input" accept="image/*" required>
            </div>
            <button type="button" class="btn-submit" id="submit-btn">
                <span class="spinner" id="btn-spinner"></span>
                <span id="btn-label">ส่งรูปขึ้นจอ 🚀</span>
            </button>
            <p class="note">รูปจะผ่านการตรวจสอบก่อนขึ้นจอ</p>
        </div>
    </div>

    <!-- ป๊อปอัปแจ้งเตือน -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-box" id="popup-box">
            <div class="popup-icon" id="popup-icon"></div>
            <div class="popup-message" id="popup-message"></div>
            <button class="popup-btn" id="popup-btn">ตกลง</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // ==========================================
        // 🌟 1. การตั้งค่า Cloudinary 🌟
        // ==========================================

        // 🚨 เปลี่ยนคำว่า YOUR_CLOUD_NAME เป็นชื่อ Cloud Name ของคุณ (เช่น vooiwrex)
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/vooiwrex/image/upload";

        // 🚨 ใส่ชื่อ Upload preset ที่คุณสร้างเป็นแบบ Unsigned ไว้
        const CLOUDINARY_UPLOAD_PRESET = "obs_live_photo";


        // ==========================================
        // 📥 2. การตั้งค่า Firebase (ของคุณเดิม)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
            authDomain: "obs-live-photo.firebaseapp.com",
            projectId: "obs-live-photo",
            storageBucket: "obs-live-photo.firebasestorage.app",
            messagingSenderId: "410755111325",
            appId: "1:410755111325:web:814ca02445f4305267f774"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const fileInput = document.getElementById('file-input');
        const uploadBox = document.getElementById('upload-box');
        const imgPreview = document.getElementById('img-preview');
        const submitBtn = document.getElementById('submit-btn');
        const btnLabel = document.getElementById('btn-label');
        const btnSpinner = document.getElementById('btn-spinner');
        const usernameInput = document.getElementById('username');

        const popupOverlay = document.getElementById('popup-overlay');
        const popupBox = document.getElementById('popup-box');
        const popupIcon = document.getElementById('popup-icon');
        const popupMessage = document.getElementById('popup-message');
        const popupBtn = document.getElementById('popup-btn');

        // แสดงป๊อปอัปแจ้งเตือนกลางจอ แทน alert()
        function showPopup(message, type) {
            popupMessage.textContent = message;
            popupIcon.textContent = type === 'success' ? '✅' : '⚠️';
            popupBox.className = 'popup-box ' + type;
            popupOverlay.className = 'popup-overlay show';
            // trigger transition
            requestAnimationFrame(() => {
                popupOverlay.classList.add('visible');
            });
        }
        function hidePopup() {
            popupOverlay.classList.remove('visible');
            setTimeout(() => { popupOverlay.className = 'popup-overlay'; }, 200);
        }
        popupBtn.addEventListener('click', hidePopup);
        popupOverlay.addEventListener('click', function(e) {
            if (e.target === popupOverlay) hidePopup();
        });

        // พรีวิวรูปภาพก่อนส่ง ภายในกรอบเดียวกับปุ่มเลือกรูป
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadBox.classList.add('has-file');
                const reader = new FileReader();
                reader.onload = function(event) {
                    imgPreview.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function setLoading(isLoading, label) {
            submitBtn.disabled = isLoading;
            btnSpinner.className = isLoading ? 'spinner show' : 'spinner';
            btnLabel.innerText = label;
        }

        // ลอจิกปุ่มกดส่งข้อมูล
        submitBtn.addEventListener('click', async function() {
            const name = usernameInput.value.trim();
            const msg = document.getElementById('message').value.trim();
            const file = fileInput.files[0];

            if (!file) {
                showPopup('กรุณาเลือกรูปภาพก่อนส่ง', 'error');
                return;
            }

            setLoading(true, "กำลังอัปโหลดรูป...");

            try {
                // อัปโหลดไฟล์ไปที่ Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                const response = await fetch(CLOUDINARY_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!result.secure_url) {
                    throw new Error('Cloudinary Upload Failed');
                }

                // 🌟 ระบบบีบอัดอัจฉริยะ (Smart Compression & Format Auto)
                const originalUrl = result.secure_url;
                // แทรกพารามิเตอร์ q_auto (ลดไซส์) และ f_auto (แปลงสกุลไฟล์ออโต้) เข้าไปใน URL
                const optimizedUrl = originalUrl.replace('/upload/', '/upload/q_auto,f_auto/');

                setLoading(true, "เกือบเสร็จแล้ว...");

                // บันทึกข้อมูลและ URL ที่ถูกบีบอัดแล้ว ลง Firebase เป็นสถานะ "pending"
                // ต้องรอแอดมินกดอนุมัติ/ปฏิเสธก่อน ถึงจะเข้าคิว ('waiting') และมีสิทธิ์ขึ้นจอได้
                await db.collection('photos').add({
                    name: name || "",
                    message: msg || "",
                    imageUrl: optimizedUrl, // ใช้ URL ที่ผ่านการบีบอัดแล้ว
                    status: 'pending',
                    timestamp: Date.now()
                });

                showPopup('ส่งรูปเรียบร้อยแล้ว! กำลังรอทีมงานตรวจสอบก่อนขึ้นจอ', 'success');

                // รีเซ็ตฟอร์มให้กลับมาเป็นหน้าว่างพร้อมรับรูปใหม่
                usernameInput.value = '';
                document.getElementById('message').value = '';
                fileInput.value = '';
                uploadBox.classList.remove('has-file');
                imgPreview.src = '';
            } catch (error) {
                console.error(error);
                showPopup('ส่งรูปไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', 'error');
            } finally {
                setLoading(false, "ส่งรูปขึ้นจอ 🚀");
            }
        });
    </script>
</body>
</html>
