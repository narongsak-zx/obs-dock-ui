<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Photo Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Prompt', sans-serif; background-color: transparent; overflow: hidden; }
        
        /* สวิตช์ Master Container (เปิด-ปิดจอ) */
        #master-container {
            width: 100%; height: 100%; display: flex; background-color: #0b132b;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #master-container.hidden-screen { opacity: 0; transform: scale(0.95); pointer-events: none; }

        /* รูปภาพ */
        .main-photo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        /* 1. Fade */
        .anim-fade { transition: opacity 0.8s ease-in-out; opacity: 0; }
        .anim-fade.active { opacity: 1; }
        
        /* 2. Zoom */
        .anim-zoom { transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94); opacity: 0; transform: scale(1.1); }
        .anim-zoom.active { opacity: 1; transform: scale(1); }
        
        /* 3. Slide Up */
        .anim-slide { transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; transform: translateY(50px); }
        .anim-slide.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <div id="master-container">
        <div class="w-[70%] h-full relative bg-black overflow-hidden shadow-2xl z-10">
            <img id="display-photo" class="main-photo anim-fade" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=1920&q=80">
            <div class="absolute bottom-0 left-0 w-full p-[60px_40px_40px] bg-gradient-to-t from-black via-black/60 to-transparent z-20">
                <h1 id="display-name" class="m-0 text-[3.5rem] text-white drop-shadow-lg font-bold">ยินดีต้อนรับเข้าสู่งาน</h1>
                <p id="display-message" class="mt-2 text-[1.8rem] text-slate-300 drop-shadow">รอรับรูปภาพจากผู้ร่วมงาน...</p>
            </div>
        </div>

        <div class="w-[30%] h-full bg-white flex flex-col items-center justify-center p-10 border-l-[8px] border-blue-600 relative">
            <div class="text-center z-10">
                <h2 class="text-[2.8rem] m-0 text-blue-900 font-bold leading-tight">ส่งรูปขึ้นจอ</h2>
                <h3 class="text-[2rem] m-0 text-blue-500 font-semibold mb-8">สแกน QR Code</h3>
                
                <img class="w-[80%] max-w-[400px] border-[12px] border-slate-50 rounded-3xl shadow-xl mx-auto mb-8 bg-white" 
                     src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://your-website.com/upload.html">
                
                <div class="text-center text-slate-600 text-[1.4rem] leading-relaxed">
                    <strong class="text-blue-900">📱 สแกนด้วยมือถือ</strong><br>อัปโหลดรูป / ใส่ชื่อ<br>รูปของคุณจะขึ้นจอทันที
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // 📥 นำเอา firebaseConfig ของจริงมาใส่ตรงนี้
        const firebaseConfig = {
  apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
  authDomain: "obs-live-photo.firebaseapp.com",
  projectId: "obs-live-photo",
  storageBucket: "obs-live-photo.firebasestorage.app",
  messagingSenderId: "410755111325",
  appId: "1:410755111325:web:814ca02445f4305267f774"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const masterContainer = document.getElementById('master-container');
        const photoEl = document.getElementById('display-photo');
        const nameEl = document.getElementById('display-name');
        const messageEl = document.getElementById('display-message');

        let currentAnimClass = 'anim-fade';

        // 1. รับคำสั่งตั้งค่าจอ (ซ่อน/โชว์ และ อนิเมชัน)
        db.collection('settings').doc('display').onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                
                if (data.isVisible === false) masterContainer.classList.add('hidden-screen');
                else masterContainer.classList.remove('hidden-screen');

                if (data.animation) {
                    photoEl.classList.remove('anim-fade', 'anim-zoom', 'anim-slide');
                    currentAnimClass = `anim-${data.animation}`;
                    photoEl.classList.add(currentAnimClass);
                }
            }
        });

        // 2. ดึงรูปภาพมาแสดงผล
        db.collection('photos').where('status', '==', 'showing').onSnapshot(snapshot => {
            if (snapshot.empty) return;
            
            let latestData = null;
            snapshot.forEach(doc => {
                const data = doc.data();
                if (!latestData || data.timestamp > latestData.timestamp) latestData = data;
            });
            
            if (latestData) {
                photoEl.classList.remove('active');
                setTimeout(() => {
                    photoEl.src = latestData.imageUrl;
                    nameEl.innerText = latestData.name;
                    messageEl.innerText = latestData.message;
                    photoEl.classList.add('active');
                }, 400); 
            }
        });
    </script>
</body>
</html>
