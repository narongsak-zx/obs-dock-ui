<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Photo Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Prompt', sans-serif; background-color: transparent; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* สวิตช์เปิด-ปิดจอ */
        .main-container { 
            width: 100%; height: 100%; display: flex; background-color: #0b132b; 
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .main-container.hidden-screen { opacity: 0; transform: scale(0.98); pointer-events: none; }

        /* พื้นที่ซ้าย (รูปภาพ) */
        .photo-section { width: 70%; height: 100%; position: relative; background-color: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* หน้าจอเริ่มต้น (ตอนยังไม่มีรูป) */
        #idle-screen {
            position: absolute;
            text-align: center;
            color: white;
            z-index: 1;
            transition: opacity 0.5s ease;
        }
        #idle-screen h1 { font-size: 3.5rem; margin-bottom: 10px; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #idle-screen p { font-size: 1.5rem; color: #94a3b8; }

        /* รูปภาพ */
        .photo-section img.main-photo { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* รูปพอดีกรอบ ไม่โดนตัด */
            position: absolute;
            z-index: 2;
        }
        
        /* Animation Classes */
        .anim-fade { transition: opacity 0.6s ease-in-out; opacity: 0; }
        .anim-fade.active { opacity: 1; }
        
        .anim-zoom { transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); opacity: 0; transform: scale(1.1); }
        .anim-zoom.active { opacity: 1; transform: scale(1); }
        
        .anim-slide { transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; transform: translateY(40px); }
        .anim-slide.active { opacity: 1; transform: translateY(0); }

        /* กล่องข้อความ (จัดกึ่งกลาง ชิดขอบล่าง) */
        .photo-overlay { 
            position: absolute; 
            bottom: 30px; /* ขยับลงชิดขอบล่าง */
            left: 50%; 
            transform: translateX(-50%); /* จัดกึ่งกลางแกน X */
            width: 85%; 
            padding: 25px 30px; 
            background: rgba(0, 0, 0, 0.65); 
            border-radius: 16px; 
            text-align: center; 
            color: white; 
            box-sizing: border-box; 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.4s ease;
            opacity: 0; /* ซ่อนไว้ก่อนจนกว่ารูปจะมา */
        }
        .photo-overlay.active { opacity: 1; }
        
        /* 🌟 อนิเมชันค่อยๆ เปิดตัวอักษร (Reveal Effect) */
        @keyframes revealText {
            0% { opacity: 0; filter: blur(10px); transform: translateY(15px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }
        
        .reveal-effect h1 { 
            margin: 0; font-size: 2.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
            animation: revealText 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .reveal-effect p { 
            margin: 8px 0 0 0; font-size: 1.4rem; color: #d1d5db; 
            animation: revealText 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; /* ดีเลย์ให้ขึ้นตามหลัง h1 นิดนึง */
            opacity: 0; 
        }

        /* พื้นที่ขวา (QR Code) */
        .qr-section { width: 30%; height: 100%; background-color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; border-left: 5px solid #1d4ed8; z-index: 20; }
        .qr-header { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .qr-header h2 { font-size: 2.5rem; margin: 0; }
        .qr-header h3 { font-size: 2rem; margin: 0; color: #3b82f6; }
        .qr-image { width: 80%; max-width: 400px; border: 10px solid #f3f4f6; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .qr-instruction { text-align: center; color: #4b5563; }
        .qr-instruction h4 { font-size: 1.8rem; margin: 0 0 10px 0; color: #1e3a8a; }
        .qr-instruction p { font-size: 1.3rem; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="main-container" id="master-container">
        
        <div class="photo-section">
            <div id="idle-screen">
                <h1>ยินดีต้อนรับเข้าสู่งาน</h1>
                <p>ร่วมแชร์ความประทับใจขึ้นจอผ่าน QR Code</p>
            </div>

            <img id="display-photo" class="main-photo anim-fade" src="" alt="Live Photo">
            
            <div class="photo-overlay" id="photo-overlay">
                <h1 id="display-name"></h1>
                <p id="display-message"></p>
            </div>
        </div>

        <div class="qr-section">
            <div class="qr-header">
                <h2>ส่งรูปขึ้นจอ</h2>
                <h3>สแกน QR Code</h3>
            </div>
            <img class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://narongsak-zx.github.io/obs-dock-ui/obs-live-photo/upload.html" alt="QR Code">
            <div class="qr-instruction">
                <h4>📱 สแกนด้วยมือถือ</h4>
                <p>อัปโหลดรูป / ใส่ชื่อ<br>รูปของคุณจะขึ้นบนจอทันที</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD39xzfRK2xkPnABOvSxocfIAOa1ooTGz0",
            authDomain: "obs-live-photo.firebaseapp.com",
            projectId: "obs-live-photo",
            storageBucket: "obs-live-photo.firebasestorage.app",
            messagingSenderId: "410755111325",
            appId: "1:410755111325:web:814ca02445f4305267f774"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const masterContainer = document.getElementById('master-container');
        const idleScreen = document.getElementById('idle-screen');
        const photoEl = document.getElementById('display-photo');
        const overlayEl = document.getElementById('photo-overlay');
        const nameEl = document.getElementById('display-name');
        const messageEl = document.getElementById('display-message');

        let currentAnimClass = 'anim-fade';

        // รับคำสั่งเปิด/ปิดจอ และอนิเมชัน
        db.collection('settings').doc('display').onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                
                if (data.isVisible === false) masterContainer.classList.add('hidden-screen');
                else masterContainer.classList.remove('hidden-screen');

                if (data.animation) {
                    photoEl.classList.remove('anim-fade', 'anim-zoom', 'anim-slide');
                    currentAnimClass = `anim-${data.animation}`;
                    photoEl.classList.add(currentAnimClass);
                }
            }
        });

        // ดึงรูปภาพใหม่
        db.collection('photos').where('status', '==', 'showing').onSnapshot((snapshot) => {
            // หากหน้าแอดมินกด "ล้างหน้าจอ" หรือยังไม่มีรูปในระบบ
            if (snapshot.empty) {
                photoEl.classList.remove('active');
                overlayEl.classList.remove('active');
                overlayEl.classList.remove('reveal-effect');
                idleScreen.style.opacity = '1'; // โชว์หน้าจอเริ่มต้น
                setTimeout(() => { photoEl.src = ''; }, 500);
                return;
            }

            let latestData = null;
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (!latestData || data.timestamp > latestData.timestamp) {
                    latestData = data;
                }
            });
            
            // ถ้ารูปใหม่มาถึง
            if (latestData && photoEl.src !== latestData.imageUrl) {
                
                // เอาอนิเมชันเก่าออกและซ่อนรูปเดิม
                photoEl.classList.remove('active');
                overlayEl.classList.remove('active');
                overlayEl.classList.remove('reveal-effect');
                idleScreen.style.opacity = '0'; // ซ่อนหน้าจอเริ่มต้น
                
                const preloader = new Image();
                preloader.src = latestData.imageUrl;
                
                preloader.onload = () => {
                    setTimeout(() => {
                        photoEl.src = latestData.imageUrl;
                        nameEl.innerText = latestData.name;
                        
                        // ถ้าไม่มีข้อความส่งมา ให้ซ่อนแท็ก <p>
                        if (latestData.message && latestData.message.trim() !== '') {
                            messageEl.innerText = latestData.message;
                            messageEl.style.display = 'block';
                        } else {
                            messageEl.style.display = 'none';
                        }
                        
                        // ทริกเกอร์แสดงผลพร้อมอนิเมชันเปิดตัวอักษร
                        photoEl.classList.add('active');
                        overlayEl.classList.add('active');
                        overlayEl.classList.add('reveal-effect');
                    }, 400); 
                };

                preloader.onerror = () => {
                    photoEl.src = latestData.imageUrl;
                    nameEl.innerText = latestData.name;
                    messageEl.innerText = latestData.message;
                    photoEl.classList.add('active');
                    overlayEl.classList.add('active');
                    overlayEl.classList.add('reveal-effect');
                };
            } 
            // กรณีโหลดเข้าหน้าเว็บครั้งแรก แล้วมีรูปค้างในระบบอยู่แล้ว
            else if (latestData && !photoEl.classList.contains('active')) {
                idleScreen.style.opacity = '0';
                photoEl.classList.add('active');
                overlayEl.classList.add('active');
                overlayEl.classList.add('reveal-effect');
            }
        });
    </script>
</body>
</html>
