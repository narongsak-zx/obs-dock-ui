<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Photo Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Prompt', sans-serif; background-color: transparent; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .main-container { width: 100%; height: 100%; display: flex; background-color: #0b132b; }
        .photo-section { width: 70%; height: 100%; position: relative; background-color: #000; display: flex; align-items: center; justify-content: center; }
        .photo-section img.main-photo { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease-in-out; opacity: 1; }
        .photo-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 30px 30px 30px; background: linear-gradient(to top, rgba(0, 5, 20, 0.9) 0%, rgba(0,0,0,0) 100%); color: white; box-sizing: border-box; }
        .photo-overlay h1 { margin: 0; font-size: 3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .photo-overlay p { margin: 10px 0 0 0; font-size: 1.5rem; color: #d1d5db; }
        .qr-section { width: 30%; height: 100%; background-color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; border-left: 5px solid #1d4ed8; }
        .qr-header { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .qr-header h2 { font-size: 2.5rem; margin: 0; }
        .qr-header h3 { font-size: 2rem; margin: 0; color: #3b82f6; }
        .qr-image { width: 80%; max-width: 400px; border: 10px solid #f3f4f6; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .qr-instruction { text-align: center; color: #4b5563; }
        .qr-instruction h4 { font-size: 1.8rem; margin: 0 0 10px 0; color: #1e3a8a; }
        .qr-instruction p { font-size: 1.3rem; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="photo-section">
            <img id="display-photo" class="main-photo" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=1920&q=80" alt="Live Photo">
            <div class="photo-overlay">
                <h1 id="display-name">ยินดีต้อนรับเข้าสู่งาน</h1>
                <p id="display-message">รอรับรูปภาพจากผู้ร่วมงาน...</p>
            </div>
        </div>

        <div class="qr-section">
            <div class="qr-header">
                <h2>ส่งรูปขึ้นจอ</h2>
                <h3>สแกน QR Code</h3>
            </div>
            <img class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://your-github-link.com/upload.html" alt="QR Code">
            <div class="qr-instruction">
                <h4>📱 สแกนด้วยมือถือ</h4>
                <p>อัปโหลดรูป / ใส่ชื่อ<br>รูปของคุณจะขึ้นบนจอทันที</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // 📥 นำเอา firebaseConfig มาใส่ตรงนี้
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const photoEl = document.getElementById('display-photo');
        const nameEl = document.getElementById('display-name');
        const messageEl = document.getElementById('display-message');

        // ดึงข้อมูลรูปที่สถานะ showing
        db.collection('photos')
          .where('status', '==', 'showing')
          .onSnapshot((snapshot) => {
              if (snapshot.empty) return;

              let latestData = null;
              snapshot.forEach((doc) => {
                  const data = doc.data();
                  // เลือกรุปที่ใหม่ที่สุดมาแสดง
                  if (!latestData || data.timestamp > latestData.timestamp) {
                      latestData = data;
                  }
              });
              
              if (latestData) {
                  photoEl.style.opacity = 0;
                  setTimeout(() => {
                      photoEl.src = latestData.imageUrl;
                      nameEl.innerText = latestData.name;
                      messageEl.innerText = latestData.message;
                      photoEl.style.opacity = 1;
                  }, 500);
              }
          });
    </script>
</body>
</html>
