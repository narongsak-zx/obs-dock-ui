<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OBSCam Sender V3.1 Pro UI (Full)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background: #050505;
            color: white;
            touch-action: manipulation;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #setup {
            height: 100dvh;
            overflow-y: auto;
            position: relative;
            z-index: 50;
            padding-bottom: 50px;
        }

        .video-full {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translateZ(0);
        }

        /* =========================================
           สไตล์หลักสำหรับ Live UI Responsive
           ========================================= */
        .live-hud {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .live-tools {
            position: absolute;
            pointer-events: auto;
            z-index: 20;
            display: flex;
            gap: 0.75rem;
        }

        .live-dock {
            position: absolute;
            pointer-events: auto;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 0.75rem 1.5rem;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .zoom-wrapper {
            position: absolute;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 10px 5px;
            backdrop-filter: blur(4px);
        }

        input[type=range][orient=vertical] {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 150px;
            padding: 0 5px;
        }

        /* แนวนอน (Landscape) */
        @media (orientation: landscape) {
            .live-dock {
                right: 1.5rem;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: column;
            }

            .live-hud {
                top: 1.5rem;
                left: 1.5rem;
            }

            .live-tools {
                bottom: 1.5rem;
                left: 1.5rem;
                flex-direction: row;
            }

            .zoom-wrapper {
                /* ขยับออกมาเป็น 160px เพื่อไม่ให้ทับปุ่มแดงใน Dock */
                right: 160px;
                top: 50%;
                transform: translateY(-50%);
            }
        }

        /* แนวตั้ง (Portrait) */
        @media (orientation: portrait) {
            .live-dock {
                bottom: 2.5rem;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                width: 90%;
                max-width: 400px;
                justify-content: space-around;
                padding: 1rem;
            }

            .live-hud {
                top: 3.5rem;
                left: 1rem;
            }

            .live-tools {
                top: 3.5rem;
                right: 1rem;
                flex-direction: column;
            }

            .zoom-wrapper {
                right: 1rem;
                top: 50%;
                transform: translateY(-50%);
            }
        }

        /* =========================================
           Utils & Modals
           ========================================= */
        .simple-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-main {
            font-size: 3rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -2px;
            line-height: 1;
            background: -webkit-linear-gradient(#fff, #999);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-sub {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #666;
            margin-top: -5px;
        }

        .fade-ui {
            transition: opacity 0.3s ease;
        }

        .ui-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: transform 0.3s ease;
            transform: translateY(100%);
        }

        .settings-modal.active {
            transform: translateY(0);
        }

        /* Bottom Sheet สำหรับตั้งค่าตอน Live */
        .live-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-top: 1px solid #333;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            z-index: 110;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
        }

        .live-sheet.active {
            transform: translateY(0);
        }

        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 105;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <div id="setup" class="p-6 flex flex-col items-center bg-slate-950">
        <button onclick="toggleSettingsModal(true)"
            class="absolute top-4 right-4 bg-gray-800 text-gray-300 hover:text-white px-3 py-2 rounded-lg text-xs font-bold border border-gray-700">
            <i class="fas fa-cog mr-1"></i> SETTINGS
        </button>

        <div class="simple-logo mt-12">
            <div class="logo-main">OBSCam</div>
            <div class="logo-sub">SENDER</div>
        </div>

        <div class="space-y-4 max-w-sm w-full mb-10 mt-6">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">Target Room ID</label>
                <div class="flex gap-2">
                    <input type="tel" id="room-id" placeholder="######" maxlength="6" onkeyup="checkRoomConfig()"

                        <i class="fas fa-qrcode text-2xl"></i>
                    </button>
                </div>
                <div id="setup-room-name" class="hidden mt-2 text-center">
                    <span class="text-green-400 text-sm font-bold">
                        <i class="fas fa-check-circle mr-1"></i><span id="setup-room-name-text"></span>
                    </span>
                </div>
            </div>

            <div class="bg-blue-900/20 p-4 rounded-xl border border-blue-500/30">
                <label class="text-[10px] text-blue-300 font-bold uppercase block mb-1">Send To (Slot)</label>
                <select id="cam-index"
                    class="w-full bg-black text-white p-3 rounded-xl text-sm border border-blue-500/50 outline-none font-bold">
                    <option value="1">CAMERA 1</option>
                    <option value="2">CAMERA 2</option>
                    <option value="3">CAMERA 3</option>
                    <option value="4">CAMERA 4</option>
                </select>
            </div>

            <button onclick="startStreaming()"
                class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-xl shadow-[0_0_20px_rgba(37,99,235,0.4)] active:scale-95 transition-transform text-white mb-4 mt-4">
                START STREAMING
            </button>
        </div>
    </div>

    <div id="settings-ui" class="settings-modal overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-white"><i class="fas fa-sliders-h mr-2"></i> Settings</h2>
            <button onclick="toggleSettingsModal(false)" class="text-gray-400 hover:text-white text-lg"><i
                    class="fas fa-times"></i></button>
        </div>

        <div class="space-y-4 max-w-sm w-full mx-auto pb-8">
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">Select Camera</label>
                <select id="camera-select"
                    class="w-full bg-black text-white p-3 rounded-lg text-sm border border-gray-700 outline-none">
                    <option value="">Default (Rear/Auto)</option>
                </select>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">

                <select id="audio-source"

                    <option value="">Default (Auto)</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                    <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">Res</label>
                    <select id="res"
                        class="w-full bg-black text-white p-2 rounded-lg text-xs border border-gray-700 outline-none">
                        <option value="1080" selected>1080p</option>
                        <option value="720">720p</option>
                        <option value="480">480p</option>
                    </select>
                </div>
                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                    <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">FPS</label>
                    <select id="fps"
                        class="w-full bg-black text-white p-2 rounded-lg text-xs border border-gray-700 outline-none">
                        <option value="30" selected>30</option>
                        <option value="60">60</option>
                    </select>
                </div>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">Bitrate</label>
                <select id="bitrate"
                    class="w-full bg-black text-white p-2 rounded-lg text-xs border border-gray-700 outline-none"
                    onchange="checkCustomBitrate(this)">
                    <option value="2000">2.0 M</option>
                    <option value="2500">2.5 M</option>
                    <option value="3000">3.0 M</option>
                    <option value="4000">4.0 M</option>
                    <option value="6000" selected>6.0 M (High)</option>
                    <option value="8500">8.5 M (Ultra)</option>
                    <option value="10000">10.0 M (Max)</option>
                    <option value="custom">Custom...</option>
                </select>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">Audio Start State</label>
                <select id="audio-enable"
                    class="w-full bg-black text-white p-2 rounded-lg text-xs border border-gray-700 outline-none">
                    <option value="false">Mute on Start</option>
                    <option value="true" selected>Unmute on Start</option>
                </select>
            </div>
            <button onclick="toggleSettingsModal(false)"
                class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold text-white mt-4">DONE</button>
        </div>
    </div>

    <div id="live-ui" class="hidden absolute inset-0 bg-black z-0" onclick="toggleUI(event)">
        <video id="preview" class="video-full" autoplay playsinline muted></video>

        <div id="grid-layer"
            class="grid-lines hidden absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none z-10 opacity-50">
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
            <div class="border border-white/30"></div>
        </div>

        <div id="overlay-controls" class="absolute inset-0 pointer-events-none fade-ui z-20">

            <div class="live-hud">
                <div
                    class="bg-black/60 px-3 py-2 rounded-xl backdrop-blur-md border border-white/10 flex items-center gap-2 pointer-events-auto shadow-lg w-fit">
                    <div id="status-dot" class="w-3 h-3 rounded-full bg-yellow-400 animate-pulse"></div>
                    <span id="status-txt" class="text-xs text-white font-bold tracking-wide">CONNECTING...</span>
                </div>
                <div class="flex gap-2 text-[10px] font-mono pointer-events-auto">
                    <span id="realtime-bw"
                        class="bg-black/50 px-2 py-1 rounded-md text-green-400 backdrop-blur-md">0 kbps</span>
                    <span id="battery-stat"
                        class="bg-black/50 px-2 py-1 rounded-md text-yellow-400 backdrop-blur-md"><i
                            class="fas fa-bolt"></i> --%</span>
                    <span class="bg-black/50 px-2 py-1 rounded-md text-white backdrop-blur-md" id="room-info">R:
                        ----</span>
                </div>
                <div
                    class="bg-black/50 px-2 py-1 rounded-md text-[10px] text-cyan-400 font-mono w-fit flex items-center gap-1 backdrop-blur-md pointer-events-auto">
                    <i class="fas fa-video"></i><span id="live-res-text">-- × -- --fps</span>
                </div>
            </div>

            <div class="live-tools">
                <button onclick="toggleMic()" id="mic-btn"
                    class="w-10 h-10 rounded-full bg-green-500/90 backdrop-blur text-white shadow-lg active:scale-90 transition"><i
                        class="fas fa-microphone"></i></button>
                <button onclick="toggleCinematicBlur()" id="cinematic-btn"
                    class="w-10 h-10 rounded-full bg-black/60 backdrop-blur text-white shadow-lg border border-white/10 active:scale-90 transition"><i
                        class="fas fa-user-circle"></i></button>
                <button onclick="toggleTorch()" id="torch-btn"
                    class="w-10 h-10 rounded-full bg-black/60 backdrop-blur text-white shadow-lg border border-white/10 active:scale-90 transition"><i
                        class="fas fa-bolt"></i></button>
                <button onclick="toggleGrid()"
                    class="w-10 h-10 rounded-full bg-black/60 backdrop-blur text-white shadow-lg border border-white/10 active:scale-90 transition"><i
                        class="fas fa-border-all"></i></button>
            </div>

            <div class="live-dock">
                <button onclick="reconnectSignaling()"
                    class="w-12 h-12 rounded-full bg-gray-800/80 hover:bg-gray-700 flex flex-col items-center justify-center text-white transition active:scale-90 shadow"
                    title="Reset Signal">
                    <i class="fas fa-satellite-dish text-sm mb-0.5"></i>
                    <span class="text-[7px] font-bold uppercase tracking-wider">Reset</span>
                </button>

                <button onclick="stopStreaming()"
                    class="w-16 h-16 rounded-full bg-red-600 border-[3px] border-white/40 flex items-center justify-center shadow-[0_0_20px_rgba(220,38,38,0.6)] active:scale-90 transition">
                    <div class="w-6 h-6 bg-white rounded-sm"></div>
                </button>

                <button onclick="openLiveSettings()"
                    class="w-12 h-12 rounded-full bg-gray-800/80 hover:bg-gray-700 flex flex-col items-center justify-center text-white transition active:scale-90 shadow"
                    title="Settings">
                    <i class="fas fa-sliders-h text-sm mb-0.5"></i>
                    <span class="text-[7px] font-bold uppercase tracking-wider">Setup</span>
                </button>
            </div>

            <div id="zoom-container" class="hidden zoom-wrapper pointer-events-auto">
                <i class="fas fa-plus text-[10px] text-white mb-2"></i>
                <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1"
                    oninput="applyZoom(this.value)" style="height: 120px; width: 6px; appearance: slider-vertical;">
                <i class="fas fa-minus text-[10px] text-white mt-2"></i>
            </div>
        </div>
    </div>

    <div id="sheet-backdrop" class="sheet-backdrop" onclick="closeLiveSettings()"></div>

    <div id="live-sheet" class="live-sheet flex flex-col gap-4">
        <div class="w-12 h-1 bg-gray-700 rounded-full mx-auto mb-2"></div>
        <h3 class="text-white font-bold text-center text-sm mb-2">Live Camera Settings</h3>

        <div class="space-y-3 max-w-sm mx-auto w-full">
            <select id="live-cam-select" onchange="switchCamera(this.value)"
                class="w-full bg-gray-900 text-white text-xs p-3 rounded-xl border border-gray-700 outline-none">
                <option value="">Change Lens / Camera...</option>
            </select>

            <select id="live-mic-select" onchange="switchMic(this.value)"
                class="w-full bg-gray-900 text-white text-xs p-3 rounded-xl border border-gray-700 outline-none">
                <option value="">Change Microphone...</option>
            </select>

            <div class="grid grid-cols-3 gap-2">
                <select id="live-res" onchange="applyLiveSettings()"
                    class="bg-gray-900 text-cyan-400 text-xs p-3 rounded-xl border border-gray-700 outline-none text-center">
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                </select>
                <select id="live-fps" onchange="applyLiveSettings()"
                    class="bg-gray-900 text-cyan-400 text-xs p-3 rounded-xl border border-gray-700 outline-none text-center">
                    <option value="60">60 FPS</option>
                    <option value="30">30 FPS</option>
                </select>
                <select id="live-bitrate" onchange="updateLiveBitrate(this.value)"
                    class="bg-gray-900 text-white text-xs p-3 rounded-xl border border-gray-700 outline-none text-center">
                    <option value="2000">2.0 M</option>
                    <option value="3000">3.0 M</option>
                    <option value="6000">6.0 M</option>
                    <option value="8500">8.5 M</option>
                    <option value="10000">10.0 M</option>
                </select>
            </div>

            <button onclick="closeLiveSettings()"
                class="w-full mt-2 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl text-white text-xs font-bold transition">Close</button>
        </div>
    </div>

    <div id="qr-overlay" class="hidden fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center">
        <video id="qr-video" class="absolute inset-0 w-full h-full object-cover"></video>
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div
                class="w-64 h-64 border-4 border-blue-500 rounded-3xl relative shadow-[0_0_100px_rgba(59,130,246,0.5)]">
            </div>
        </div>
        <button onclick="stopQRScanner()"
            class="absolute bottom-10 bg-red-600 px-8 py-3 rounded-full font-bold shadow-lg z-20 text-white">CANCEL</button>
        <canvas id="qr-canvas" hidden></canvas>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCRpQWN6J1HYE4r5R8YC2od0ZBt_gSm-iQ",
            authDomain: "obscam-p2p.firebaseapp.com",
            databaseURL: "https://obscam-p2p-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "obscam-p2p",
            appId: "1:531335072084:web:dc373db6b66581a63160c1"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        let pc = null;
        let monPc = null;
        let statsChannel = null;
        let myStream;
        let videoTrack;
        let audioTrack;
        let qrStream;
        let customBitrateVal = 6000;
        let targetCamIndex = "1";
        let roomId = "";
        let statsInterval = null;
        let lastBytes = 0;
        let lastTime = 0;
        let sessionTotalBytes = 0;
        let currentMaxCams = 4;
        let currentRoomName = '';

        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');

        initDeviceSelection().then(() => {
            loadSettings();
        });

        async function initDeviceSelection() {
            try {
                const tmpStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const devices = await navigator.mediaDevices.enumerateDevices();

                tmpStream.getTracks().forEach(track => track.stop());

                const videoSelect = document.getElementById('camera-select');
                const liveSelect = document.getElementById('live-cam-select');
                const liveMicSelect = document.getElementById('live-mic-select');
                const audioSelect = document.getElementById('audio-source');

                videoSelect.innerHTML = '<option value="">Default (Rear/Auto)</option>';
                liveSelect.innerHTML = '<option value="">Change Lens...</option>';
                liveMicSelect.innerHTML = '<option value="">Change Mic...</option>';
                audioSelect.innerHTML = '<option value="">Default (Auto)</option>';

                let vCount = 1;
                let aCount = 1;

                devices.forEach(device => {
                    if (device.kind === 'videoinput') {
                        const option = new Option(device.label || `Camera ${vCount++}`, device.deviceId);
                        videoSelect.appendChild(option);
                        liveSelect.appendChild(option.cloneNode(true));
                    } else if (device.kind === 'audioinput') {
                        const option = new Option(device.label || `Microphone ${aCount++}`, device.deviceId);
                        audioSelect.appendChild(option);
                        liveMicSelect.appendChild(option.cloneNode(true));
                    }
                });
            } catch (e) {
                console.log("Permission Error", e);
            }
        }

        // ============================
        // ฟังก์ชันควบคุม UI ใหม่
        // ============================
        function toggleSettingsModal(show) {
            const modal = document.getElementById('settings-ui');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function openLiveSettings() {
            document.getElementById('sheet-backdrop').classList.add('active');
            document.getElementById('live-sheet').classList.add('active');
        }

        function closeLiveSettings() {
            document.getElementById('sheet-backdrop').classList.remove('active');
            document.getElementById('live-sheet').classList.remove('active');
        }

        function toggleUI(e) {
            // ซ่อน/แสดง ควบคุมเมื่อแตะที่ว่างบนวิดีโอ
            if (e.target.id === 'preview' || e.target.id === 'live-ui') {
                document.getElementById('overlay-controls').classList.toggle('ui-hidden');
            }
        }
        // ============================

        function loadSettings() {
            if (roomFromUrl) {
                document.getElementById('room-id').value = roomFromUrl;
                checkRoomConfig();
            } else if (localStorage.getItem('obs_room_id')) {
                document.getElementById('room-id').value = localStorage.getItem('obs_room_id');
                checkRoomConfig();
            }

            if (localStorage.getItem('obs_cam_index')) {
                document.getElementById('cam-index').value = localStorage.getItem('obs_cam_index');
            }
            if (localStorage.getItem('obs_camera_id')) {
                document.getElementById('camera-select').value = localStorage.getItem('obs_camera_id');
            }

        function setMediaBitrateSDP(sdp, bitrate) {
            let lines = sdp.split('\n');
            let line = -1;

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].indexOf('m=video') === 0) {
                    line = i;
                    break;
                }
            }

            if (line === -1) {
                return sdp;
            }
            line++;

            while (line < lines.length && (lines[line].indexOf('i=') === 0 || lines[line].indexOf('c=') === 0)) {
                line++;
            }

            if (line < lines.length && lines[line].indexOf('b=AS') === 0) {
                lines[line] = 'b=AS:' + bitrate;
            } else {
                lines.splice(line, 0, 'b=AS:' + bitrate);
            }

            return lines.join('\n');
        }

        function preferCodec(sdp, codec) {
            var sdpLines = sdp.split('\r\n');
            var mLineIndex = -1;

            for (var i = 0; i < sdpLines.length; i++) {
                if (sdpLines[i].search('m=video') !== -1) {
                    mLineIndex = i;
                    break;
                }
            }

            if (mLineIndex === -1) {
                return sdp;
            }

            var codecPayload = null;
            var pattern = new RegExp(":(\\d+) " + codec + "/90000");

            for (var i = 0; i < sdpLines.length; i++) {
                var result = sdpLines[i].match(pattern);
                if (result) {
                    codecPayload = result[1];
                    break;
                }
            }

            if (!codecPayload) {
                return sdp;
            }

            var mLine = sdpLines[mLineIndex];
            var elements = mLine.split(' ');
            var newMLine = elements.slice(0, 3);
            newMLine.push(codecPayload);

            for (var i = 3; i < elements.length; i++) {
                if (elements[i] !== codecPayload) {
                    newMLine.push(elements[i]);
                }
            }

            sdpLines[mLineIndex] = newMLine.join(' ');
            return sdpLines.join('\r\n');
        }

        async function connectOBS(rid, cIdx) {
            const roomRef = db.ref(`OBSCam_rooms/${rid}/cam${cIdx}/obs`);
            pc = new RTCPeerConnection(rtcConfig);

            myStream.getTracks().forEach(track => pc.addTrack(track, myStream));
            connectMonitor(rid, cIdx);

            let pendingCandidates = [];

            pc.onicecandidate = event => {
                if (event.candidate) {
                    pendingCandidates.push({
                        c: event.candidate.candidate,
                        m: event.candidate.sdpMid,
                        i: event.candidate.sdpMLineIndex
                    });
                } else {
                    if (pendingCandidates.length > 0) {
                        roomRef.child('callerCandidates').set(pendingCandidates);
                    }
                }
            };

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                if (state === 'connected' || state === 'completed') {
                    document.getElementById('status-txt').innerText = `CAM ${targetCamIndex}`;
                    document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-red-500 animate-pulse';
                } else if (state === 'disconnected' || state === 'failed') {
                    document.getElementById('status-txt').innerText = 'RECONNECTING...';
                    document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-yellow-400 animate-pulse';

                    if (state === 'failed') {
                        pc.restartIce();
                        pc.createOffer({ iceRestart: true }).then(async newOffer => {
                            let finalSDP = preferCodec(newOffer.sdp, 'H264');
                            finalSDP = setMediaBitrateSDP(finalSDP, 10000);
                            newOffer = new RTCSessionDescription({ type: 'offer', sdp: finalSDP });

                            await pc.setLocalDescription(newOffer);
                            await roomRef.child('offer').set({ sdp: newOffer.sdp, type: newOffer.type });
                        }).catch(e => console.error(e));
                    }
                }
            };

            let offer = await pc.createOffer();
            let finalSDP = preferCodec(offer.sdp, 'H264');
            finalSDP = setMediaBitrateSDP(finalSDP, 10000);
            offer = new RTCSessionDescription({ type: 'offer', sdp: finalSDP });

            await pc.setLocalDescription(offer);
            await roomRef.child('offer').set({ sdp: offer.sdp, type: offer.type });

            roomRef.child('answer').on('value', async snapshot => {
                const data = snapshot.val();
                if (!data) return;
                if (!pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                }
            });

            roomRef.child('calleeCandidates').on('value', snapshot => {
                const candidates = snapshot.val();
                if (candidates && Array.isArray(candidates)) {
                    candidates.forEach(c => {
                        if (c) {
                            pc.addIceCandidate(new RTCIceCandidate({
                                candidate: c.c,
                                sdpMid: c.m,
                                sdpMLineIndex: c.i
                            })).catch(e => { });
                        }
                    });
                }
            });

            setBitrate(pc, getTargetBitrate() * 1000);
        }

        async function connectMonitor(rid, cIdx) {
            const monRef = db.ref(`OBSCam_rooms/${rid}/cam${cIdx}/mon`);
            await monRef.child('answer').remove();
            await monRef.child('calleeCandidates').remove();

            monPc = new RTCPeerConnection(rtcConfig);
            statsChannel = monPc.createDataChannel('stats');

            let pendingCandidates = [];

            monPc.onicecandidate = event => {
                if (event.candidate) {
                    pendingCandidates.push({
                        c: event.candidate.candidate,
                        m: event.candidate.sdpMid,
                        i: event.candidate.sdpMLineIndex
                    });
                } else if (pendingCandidates.length > 0) {
                    monRef.child('callerCandidates').set(pendingCandidates);
                }
            };

            let offer = await monPc.createOffer();
            await monPc.setLocalDescription(offer);
            await monRef.child('offer').set({ sdp: offer.sdp, type: offer.type });

            monRef.child('answer').on('value', async snapshot => {
                const data = snapshot.val();
                if (!data) return;
                if (!monPc.currentRemoteDescription) {
                    await monPc.setRemoteDescription(new RTCSessionDescription(data));
                }
            });

            monRef.child('calleeCandidates').on('value', snapshot => {
                const candidates = snapshot.val();
                if (candidates && Array.isArray(candidates)) {
                    candidates.forEach(c => {
                        if (c) {
                            monPc.addIceCandidate(new RTCIceCandidate({
                                candidate: c.c,
                                sdpMid: c.m,
                                sdpMLineIndex: c.i
                            })).catch(e => { });
                        }
                    });
                }
            });
        }

        function setBitrate(targetPC, bitrate) {
            const sender = targetPC.getSenders().find(s => s.track.kind === 'video');
            if (sender && sender.getParameters) {
                const params = sender.getParameters();
                if (!params.encodings) {
                    params.encodings = [{}];
                }

                params.encodings[0].maxBitrate = bitrate;
                params.encodings[0].degradationPreference = 'maintain-resolution';
                sender.setParameters(params).catch(e => console.log(e));
            }
        }

        function startUpdatingStats() {
            lastBytes = 0;
            lastTime = Date.now();
            sessionTotalBytes = 0;
            updateLiveResDisplay();

            statsInterval = setInterval(async () => {
                let obsBytes = 0;

                if (pc && pc.connectionState === 'connected') {
                    const s = await pc.getStats();
                    s.forEach(r => {
                        if (r.type === 'outbound-rtp' && r.kind === 'video') {
                            obsBytes += r.bytesSent;
                        }
                    });
                }

                const now = Date.now();
                const diffTime = now - lastTime;
                let mainKbps = 0;

                if (diffTime > 0) {
                    if (obsBytes > 0 && lastBytes > 0) {
                        mainKbps = Math.round(((obsBytes - lastBytes) * 8) / diffTime);
                    }
                    const diffMain = (obsBytes > lastBytes) ? (obsBytes - lastBytes) : 0;
                    sessionTotalBytes += diffMain;
                }

                lastBytes = obsBytes;
                lastTime = now;

                document.getElementById('realtime-bw').innerText = `${mainKbps} kbps`;
                updateLiveResDisplay();

                let batLevel = 100;
                try {
                    const battery = await navigator.getBattery();
                    batLevel = Math.round(battery.level * 100);
                    document.getElementById('battery-stat').innerHTML = `<i class="fas fa-bolt"></i> ${batLevel}%`;
                } catch (e) { }

                if (statsChannel && statsChannel.readyState === 'open') {
                    const settings = videoTrack ? videoTrack.getSettings() : {};
                    const currentRes = settings.height || document.getElementById('live-res').value;
                    const currentFps = Math.round(settings.frameRate || document.getElementById('live-fps').value);
                    const dataUsage = (sessionTotalBytes / (1024 * 1024)).toFixed(1);

                    const payload = {
                        r: currentRes + "p",
                        f: currentFps,
                        k: mainKbps,
                        b: batLevel,
                        d: dataUsage
                    };
                    statsChannel.send(JSON.stringify(payload));
                }
            }, 1000);
        }

        function updateLiveResDisplay() {

        async function switchCamera(deviceId, forceRes, forceFps) {
            if (!myStream) return;
            const quality = forceRes || parseInt(document.getElementById('live-res').value);
            const fpsVal = forceFps || parseInt(document.getElementById('live-fps').value);

            try {
                myStream.getVideoTracks().forEach(t => t.stop());

                let videoConstraints = {
                    width: { ideal: quality * 1.777 },
                    height: { ideal: quality },
                    frameRate: { ideal: fpsVal },
                    resizeMode: "none"
                };

                if (deviceId) {
                    videoConstraints.deviceId = { exact: deviceId };
                } else if (videoTrack && videoTrack.getSettings().deviceId) {
                    videoConstraints.deviceId = { exact: videoTrack.getSettings().deviceId };
                } else {
                    videoConstraints.facingMode = 'environment';
                }

                let newStream;
                try {
                    newStream = await navigator.mediaDevices.getUserMedia({ audio: audioTrack && audioTrack.enabled, video: videoConstraints });
                } catch (err) {
                    try {
                        delete videoConstraints.resizeMode;
                        newStream = await navigator.mediaDevices.getUserMedia({ audio: audioTrack && audioTrack.enabled, video: videoConstraints });
                    } catch (err2) {
                        newStream = await navigator.mediaDevices.getUserMedia({ audio: audioTrack && audioTrack.enabled, video: true });
                    }
                }
                const newVideoTrack = newStream.getVideoTracks()[0];

                if (pc) {
                    const sender = pc.getSenders().find(s => s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(newVideoTrack);
                    }
                }

                videoTrack = newVideoTrack;
                videoTrack.contentHint = "detail";

                let tracks = [newVideoTrack];
                if (audioTrack) {
                    tracks.push(audioTrack);
                }
                myStream = new MediaStream(tracks);

                document.getElementById('preview').srcObject = myStream;
                checkZoomCapabilities();
                updateLiveResDisplay();

                if (deviceId) {
                    document.getElementById('camera-select').value = deviceId;
                    saveSettings();
                }
            } catch (e) {
                alert("Switch/Apply Settings failed: " + e);
            }
        }

        async function switchMic(deviceId) {
            if (!myStream) return;
            try {
                if (audioTrack) {
                    audioTrack.stop();
                }

                let audioConstraints = true;
                if (deviceId) {
                    audioConstraints = { deviceId: { exact: deviceId } };
                }

                const newStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
                const newAudioTrack = newStream.getAudioTracks()[0];

                if (pc) {
                    const sender = pc.getSenders().find(s => s.track.kind === 'audio');
                    if (sender) {
                        sender.replaceTrack(newAudioTrack);
                    }
                }

                audioTrack = newAudioTrack;
                const micBtn = document.getElementById('mic-btn');
                audioTrack.enabled = micBtn.classList.contains('bg-green-500/90');

                let tracks = [videoTrack];
                if (audioTrack) {
                    tracks.push(audioTrack);
                }
                myStream = new MediaStream(tracks);

                document.getElementById('preview').srcObject = myStream;

                if (deviceId) {
                    document.getElementById('audio-source').value = deviceId;
                    saveSettings();
                }
            } catch (e) {
                alert("Switch Mic failed: " + e);
            }
        }

        async function startQRScanner() {
            document.getElementById('qr-overlay').classList.remove('hidden');
            const video = document.getElementById('qr-video');
            const canvas = document.getElementById('qr-canvas');
            const ctx = canvas.getContext('2d');

            qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = qrStream;
            video.play();
            requestAnimationFrame(tick);

            function tick() {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);

                    if (code && code.data.length >= 6) {
                        document.getElementById('room-id').value = code.data.replace(/\D/g, '').substring(0, 6);
                        stopQRScanner();
                        checkRoomConfig();
                    }
                }
                if (!document.getElementById('qr-overlay').classList.contains('hidden')) {
                    requestAnimationFrame(tick);
                }
            }
        }

        function stopQRScanner() {
            document.getElementById('qr-overlay').classList.add('hidden');
            if (qrStream) {
                qrStream.getTracks().forEach(t => t.stop());
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') {
                if (videoTrack && videoTrack.readyState === 'ended') {
                    const devId = document.getElementById('camera-select').value;
                    document.getElementById('status-txt').innerText = "RESUMING...";
                    document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-yellow-400 animate-pulse";

                    switchCamera(devId ? devId : undefined);

                    setTimeout(() => {
                        document.getElementById('status-txt').innerText = `CAM ${targetCamIndex}`;
                        document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
                    }, 2000);
                } else if (pc && pc.iceConnectionState === 'disconnected') {
                    reconnectSignaling();
                }
            }
        });
    </script>
</body>
